const IMG={};
['w_bg','w_stone','w_foe','w_boss','w_boss2','w_teeth','w_danya','w_danya2','w_pasha','w_pol','w_rock','w_ladder'].forEach(k=>{
  if(!ART[k]) return;
  const i=new Image(); i.src=ART[k]; IMG[k]=i;
});
function ready(k){ const i=IMG[k]; return i && i.complete && i.naturalWidth>0; }

function fitCanvas(){
  cv=$('#cv'); cx=cv.getContext('2d');
  const r=Math.min(window.devicePixelRatio||1, 2);
  VW=cv.clientWidth; VH=cv.clientHeight;
  cv.width=Math.round(VW*r); cv.height=Math.round(VH*r);
  cx.setTransform(r,0,0,r,0,0);
}
window.addEventListener('resize', ()=>{ if(G) fitCanvas(); });

/* геометрия: пролёты по горизонтали, лезут снизу вверх */
function laneX(i){ return VW*(i+0.5)/LANES; }
const TOPY = ()=> VH*0.30;          // линия парапета
const BOTY = ()=> VH;               // стена и лестницы идут до нижнего края
const BTNY = ()=> VH*0.92;          // полоса кнопок

function startWall(){
  show('game'); fitCanvas();
  G={
    t:0, wave:0, spawned:0, lives:LIVES,
    pause:1.6, gapT:0, foes:[],
    boss:null, bossHp:0, bossHits:0, bossJump:0, bossFace:'misha', rocks:[], yell:'', yellT:0,
    pos:2, cool:0, mcool:0, jump:0, jumpT:0.45, jumpFrom:0, jumpTo:0,
    flash:'', flashT:0, shake:0, over:0, won:false,
    last:performance.now()
  };
  requestAnimationFrame(loop);
}

function wave(){ return WAVES[Math.min(G.wave, WAVES.length-1)]; }
function flash(t){ G.flash=t; G.flashT=1.6; }

function spawnFoe(){
  const w=wave();
  G.foes.push({lane:Math.floor(Math.random()*LANES), y:1,
               spd:w.spd*(0.85+Math.random()*0.3), hp:FOE_HP,
               ph:Math.random()*3, hurt:0});
}
function spawnBoss(){
  G.boss={lane:Math.floor(LANES/2), y:1, ph:0};
  G.bossHp=BOSS_HP; G.bossHits=0; G.bossJump=BOSS_JUMP;
  flash(G.bossFace==='misha' ? 'ХАН ЗАЛУПЕЙ' : 'ГЛАВАРЬ'); sfxBoss();
}

/* Даня скидывает булыжник со своей позиции */
function throwRock(){
  const g=G;
  if(g.cool>0) return;
  g.cool=THROW_CD;
  g.rocks.push({lane:g.pos, y:0.02, spin:0});
  sfxPush();
}
function moveDanya(d){
  const g=G;
  if(g.mcool>0) return;
  const n=g.pos+d;
  if(n<0 || n>=LANES) return;
  g.pos=n; g.mcool=MOVE_CD;
}

/* верхняя треть экрана — бросок, низ — шаги вбок */
const THROW_ZONE = 0.42;

function bindPointer(){
  $('#game').addEventListener('pointerdown', e=>{
    e.preventDefault();
    if(!G || G.over>0) return;
    const r=cv.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    if(e.pointerType==='mouse'){ throwRock(); return; }   // на ПК мышь всегда бросает
    if(y < VH*THROW_ZONE) throwRock();                    // на телефоне верх экрана — бросок
    else moveDanya(x < VW/2 ? -1 : 1);
  });
  addEventListener('keydown', e=>{
    if(!G || G.over>0) return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); moveDanya(-1); }
    if(e.key==='ArrowRight'){ e.preventDefault(); moveDanya(1); }
    if(e.key===' '||e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); throwRock(); }
  });
}

/* ── шаг ── */
function step(dt){
  const g=G;
  if(g.over>0){ g.over-=dt; if(g.over<=0) finish(); return; }
  g.t+=dt;
  if(g.flashT>0) g.flashT-=dt;
  if(g.yellT>0) g.yellT-=dt;
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*22);
  if(g.cool>0) g.cool-=dt;
  if(g.mcool>0) g.mcool-=dt;          // откат шага тикает и в паузе между волнами

  const w=wave();

  if(g.pause>0){
    g.pause-=dt;
    if(g.pause<=0){ flash('ВОЛНА '+(g.wave+1)); sfxWave(); if(w.boss) spawnBoss(); }
    return;
  }

  if(!w.boss && g.spawned < w.n){
    g.gapT-=dt;
    if(g.gapT<=0){ spawnFoe(); g.spawned++; g.gapT=w.gap; }
  }


  /* булыжники падают вниз по своей лестнице */
  for(const r of g.rocks){
    r.y += ROCK_SPD*dt;
    r.spin += dt*7;
    let hit=null;
    for(const f of g.foes){
      if(f.lane!==r.lane || f.hp<=0) continue;
      if(Math.abs((1-f.y) - r.y) < 0.06 && (!hit || f.y<hit.y)) hit=f;
    }
    if(hit){ hit.hp=0; hit.fall=0.01; hit.spin=0; r.dead=true; g.shake=Math.max(g.shake,4); }
    else if(g.boss && g.boss.lane===r.lane && Math.abs((1-g.boss.y) - r.y) < 0.08){
      r.dead=true; g.bossHp--; g.bossHits++; g.shake=Math.max(g.shake,6);
      g.yell=BOSS_YELL[Math.floor(Math.random()*BOSS_YELL.length)]; g.yellT=1.1;
      if(g.bossHits>=BOSS_KNOCK){
        g.bossHits=0; g.boss.y=Math.min(1, g.boss.y+BOSS_DOWN);
      }
    }
  }
  g.rocks=g.rocks.filter(r=>!r.dead && r.y<1.05);

  /* сбитые срываются вниз и уходят за край */
  for(const f of g.foes){
    if(f.fall===undefined) continue;
    f.fall += dt*2.4;
    f.spin += dt*6;
    f.y += f.fall*dt*1.4;          // вниз: единица это низ стены
  }
  g.foes=g.foes.filter(f=>f.fall===undefined ? f.hp>0 : f.y < 1.3);

  for(const f of g.foes){
    if(f.fall!==undefined) continue;
    f.y -= f.spd*dt;
    if(f.hurt>0) f.hurt-=dt;
    f.ph += dt*6;
    if(f.y<=0){ f.hp=0; f.gone=true; g.lives--; g.shake=8; sfxHit(); flash('ПРОРВАЛСЯ'); }
  }
  g.foes=g.foes.filter(f=>!f.gone && (f.fall!==undefined ? f.y < 1.3 : f.hp>0));

  if(g.boss){
    g.boss.y -= BOSS_SPD*dt;
    g.boss.ph += dt*5;
    g.bossJump -= dt;
    if(g.jump>0){                                 // летит между лестницами
      g.jump-=dt;
      if(g.jump<=0){ g.boss.lane=g.jumpTo; g.bossHits=0; }
    } else if(g.bossJump<=0){
      g.bossJump=BOSS_JUMP;
      let n=g.boss.lane + (Math.random()<0.5?-1:1);
      if(n<0) n=1; if(n>=LANES) n=LANES-2;
      g.jumpFrom=g.boss.lane; g.jumpTo=n; g.jump=0.45; g.jumpT=0.45;
    }
    if(g.bossHp<=0){ g.boss=null; flash('ПОБЕДА'); }
    else if(g.boss.y<=0){ g.boss=null; g.lives=0; }
  }

  if(g.lives<=0 && !g.over){ g.over=1.2; g.won=false; sfxHit(); return; }

  const bossLeft = w.boss && g.boss;
  const done = w.boss ? !bossLeft : (g.spawned>=w.n && g.foes.length===0);
  if(done){
    g.wave++;
    if(g.wave>=WAVES.length){ g.over=1.5; g.won=true; sfxWin(); return; }
    g.spawned=0; g.gapT=0; g.pause=PAUSE; g.rocks.length=0;
  }
}

/* ── рисование ── */
function drawWall(){
  const top=TOPY(), bot=BOTY();

  if(ready('w_bg')){                                   // равнина и небо
    const im=IMG.w_bg, h=top, w=h*im.naturalWidth/im.naturalHeight;
    for(let x=0;x<VW;x+=w) cx.drawImage(im, x, 0, w, h);
  } else {
    const sky=cx.createLinearGradient(0,0,0,top);
    sky.addColorStop(0,'#2b3a44'); sky.addColorStop(1,'#7c6a52');
    cx.fillStyle=sky; cx.fillRect(0,0,VW,top);
  }

  if(ready('w_stone')){                                // кладка тайлом
    const t=Math.max(90, VW/6);
    for(let x=0;x<VW;x+=t) for(let y=top;y<bot;y+=t) cx.drawImage(IMG.w_stone, x, y, t, t);
  } else {
    cx.fillStyle='#5d5647'; cx.fillRect(0,top,VW,bot-top);
  }
  cx.fillStyle='rgba(0,0,0,.16)'; cx.fillRect(0,top,VW,bot-top);   // притемняем, чтобы фигуры читались

  if(ready('w_teeth')){                                // зубцы
    const im=IMG.w_teeth, h=Math.min(64, VH*0.10), w=h*im.naturalWidth/im.naturalHeight;
    for(let x=0;x<VW;x+=w) cx.drawImage(im, x, top-h*0.86, w, h);
  } else {
    cx.fillStyle='#6b6454';
    const cw=VW/14;
    for(let i=0;i<14;i+=2) cx.fillRect(i*cw, top-18, cw, 18);
  }

  cx.strokeStyle='rgba(0,0,0,.20)'; cx.lineWidth=2;
  for(let i=1;i<LANES;i++){
    const x=VW*i/LANES;
    cx.beginPath(); cx.moveTo(x,top); cx.lineTo(x,bot); cx.stroke();
  }
}
function drawLadders(){
  const top=TOPY(), bot=BOTY(), im=IMG.w_ladder;
  const w=Math.min(58, VW/LANES*0.5);
  for(let i=0;i<LANES;i++){
    const x=laneX(i);
    if(im && im.complete && im.naturalWidth>0){
      const seg=w*im.naturalHeight/im.naturalWidth;
      for(let y=top-14; y<bot; y+=seg) {
        const h=Math.min(seg, bot-y);
        cx.drawImage(im, 0, 0, im.naturalWidth, im.naturalHeight*(h/seg), x-w/2, y, w, h);
      }
    } else {
      cx.strokeStyle='#6b5a3c'; cx.lineWidth=4;
      cx.beginPath(); cx.moveTo(x-w/2, top-10); cx.lineTo(x-w/2, bot);
                      cx.moveTo(x+w/2, top-10); cx.lineTo(x+w/2, bot); cx.stroke();
      cx.lineWidth=3;
      for(let y=top-4; y<bot; y+=26){ cx.beginPath(); cx.moveTo(x-w/2,y); cx.lineTo(x+w/2,y); cx.stroke(); }
    }
  }
}

function figH(){ return Math.min(VH*FIG_H, 190); }

function drawFoe(f){
  const x=laneX(f.lane), top=TOPY(), bot=BOTY();
  const y=top+(bot-top)*f.y;
  const frame=Math.floor(f.ph)%3;
  const im=IMG.w_foe;
  if(im && im.complete && im.naturalWidth>0){
    const fw=im.naturalWidth/3, fh=im.naturalHeight;
    const h=figH(), w=h*fw/fh;
    if(f.fall!==undefined){
      cx.save(); cx.translate(x, y-h*0.3); cx.rotate(f.spin);
      cx.globalAlpha=Math.max(0, Math.min(1, (1.3-f.y)*2.2));
      cx.drawImage(im, frame*fw, 0, fw, fh, -w/2, -h*0.42, w, h);
      cx.restore();
    } else {
      if(f.hurt>0){ cx.save(); cx.globalAlpha=0.55; }
      cx.drawImage(im, frame*fw, 0, fw, fh, x-w/2, y-h*0.72, w, h);
      if(f.hurt>0) cx.restore();
    }
  } else {
    cx.fillStyle=f.hurt>0?'#b02a1a':'#3e4a3a';
    cx.beginPath(); cx.ellipse(x,y,18,22,0,0,7); cx.fill();
  }
}

function drawBoss(){
  const b=G.boss; if(!b) return;
  const top=TOPY(), bot=BOTY();
  let x=laneX(b.lane), lift=0;
  if(G.jump>0){                                   // дуга между лестницами
    const t=1-G.jump/G.jumpT;
    x = laneX(G.jumpFrom) + (laneX(G.jumpTo)-laneX(G.jumpFrom))*t;
    lift = Math.sin(t*Math.PI) * figH()*0.42;
  }
  const y=top+(bot-top)*b.y - lift;
  const key = G.bossFace==='misha' ? 'w_boss' : 'w_boss2';
  const im=IMG[key], h=figH();
  cx.save();
  if(G.jump>0) cx.translate(x,y), cx.rotate(Math.sin((1-G.jump/G.jumpT)*Math.PI)*0.22), cx.translate(-x,-y);
  if(im && im.complete && im.naturalWidth>0){
    const w=h*im.naturalWidth/im.naturalHeight;
    cx.drawImage(im, x-w/2, y-h*0.74, w, h);
  } else {
    cx.fillStyle='#4a3b2a'; cx.beginPath(); cx.ellipse(x,y,20,24,0,0,7); cx.fill();
  }
  cx.restore();
  const bw=h*0.7, bh=8, by=y-h*0.86;
  cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(x-bw/2, by, bw, bh);
  cx.fillStyle='#b02a1a';        cx.fillRect(x-bw/2, by, bw*Math.max(0,G.bossHp/BOSS_HP), bh);
  if(G.yellT>0){                                  // ругань
    cx.textAlign='center';
    cx.globalAlpha=Math.min(1,G.yellT);
    cx.fillStyle='#f0c860';
    cx.font='700 '+Math.round(Math.min(26,VW*0.032))+'px Arial Black, Arial, sans-serif';
    cx.fillText(G.yell, x, by-14);
    cx.globalAlpha=1; cx.textAlign='left';
  }
}

/* булыжники */
function drawRocks(){
  const top=TOPY(), bot=BOTY();
  const im=IMG.w_rock, w=Math.min(50, VW/LANES*0.44);
  for(const r of G.rocks){
    const x=laneX(r.lane), y=top+(bot-top)*r.y;
    if(im && im.complete && im.naturalWidth>0){
      const h=w*im.naturalHeight/im.naturalWidth;
      cx.save(); cx.translate(x,y); cx.rotate(r.spin);
      cx.drawImage(im, -w/2, -h/2, w, h); cx.restore();
    } else {
      cx.fillStyle='#7d7566'; cx.beginPath(); cx.arc(x,y,w*0.4,0,7); cx.fill();
    }
  }
}

/* наверху: Даня ходит по пролётам, Пол и Паша стоят */
function drawHeroes(){
  const top=TOPY(), h=figH();
  function put(key, x, alpha){
    const im=IMG[key]; if(!(im&&im.complete&&im.naturalWidth>0)) return;
    const w=h*im.naturalWidth/im.naturalHeight;
    cx.save(); if(alpha) cx.globalAlpha=alpha;
    cx.drawImage(im, x-w/2, top-h*0.92, w, h); cx.restore();
  }
  const gap = i => VW*(i+1)/LANES;          // промежутки между лестницами
  put('w_pol',   gap(0), 0.92);
  put('w_pasha', gap(2), 0.92);
  const dx=laneX(G.pos);
  put(G.cool>0 ? 'w_danya' : 'w_danya2', dx, 1);
}

function drawHud(){
  const g=G;
  cx.fillStyle='rgba(228,220,198,.92)'; cx.font='bold 15px Courier New, monospace'; cx.textAlign='left';
  cx.fillText('ВОЛНА '+Math.min(g.wave+1,WAVES.length)+' / '+WAVES.length, 14, 26);
  cx.textAlign='right';
  cx.fillText('ПРОПУЩЕНО '+(LIVES-g.lives)+' / '+LIVES, VW-14, 26);

  if(g.cool>0){
    const w=VW*0.28;
    cx.fillStyle='rgba(0,0,0,.35)'; cx.fillRect(VW/2-w/2, 40, w, 4);
    cx.fillStyle='rgba(240,200,96,.7)';
    cx.fillRect(VW/2-w/2, 40, w*(1-g.cool/THROW_CD), 4);
  }
  if(g.flashT>0){
    cx.textAlign='center';
    cx.fillStyle='rgba(240,200,96,'+Math.min(1,g.flashT)+')';
    cx.font='700 '+Math.round(Math.min(44,VW*0.07))+'px Arial Black, Arial, sans-serif';
    cx.fillText(g.flash, VW/2, VH*0.20);
  }
  cx.textAlign='left';
}

function draw(){
  cx.save();
  if(G.shake>0) cx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  drawWall();
  drawLadders();
  for(const f of G.foes) drawFoe(f);
  drawBoss();
  drawRocks();
  drawHeroes();
  cx.restore();
  drawHud();
  if(G.over>0 && !G.won){
    cx.fillStyle='rgba(176,42,26,'+Math.min(.5,G.over*0.45)+')';
    cx.fillRect(0,0,VW,VH);
  }
}
function loop(now){
  if(!G) return;
  const dt=Math.min(0.033,(now-G.last)/1000); G.last=now;
  step(dt);
  if(!G) return;
  draw();
  requestAnimationFrame(loop);
}

function finish(){
  const g=G, won=g.won, wv=Math.min(g.wave+1,WAVES.length); G=null;
  if(won){ if(onDone) onDone(); else show('menu'); return; }
  show('over');
  $('#overbox').innerHTML =
    '<h2>Прорвались</h2><div class="rule"></div>'+
    '<p>Продержались до волны '+wv+' из '+WAVES.length+'.</p>'+
    '<p>Стена большая, монголов больше.</p>'+
    '<button class="bigbtn" id="ov-again">Ещё раз</button>';
  $('#ov-again').onclick = startWall;
}

bindPointer();
return { start(cb){ onDone=cb; startWall(); }, stop(){ G=null; },
         skip(){ G=null; if(onDone) onDone(); }, state(){ return G; } };
})();

/* ══════════ МИССИЯ 6: КАШТАН ══════════ */
const KASH = (function(){
let onDone=null;
/* ═══════════ КАШТАН — ГОРЯЩИЙ ЗАЛ ═══════════ */

const sfxDart =()=>blip(420,.05,'square',.03);
const sfxPop  =()=>blip(240,.08,'square',.04);
const sfxRoll =()=>blip(120,.20,'sawtooth',.04);
const sfxBoss =()=>blip(90,.55,'sawtooth',.07);
const sfxFire =()=>blip(180,.30,'sawtooth',.035);

let K=null, kcv=null, kx=null, KW=0, KH=0;
const COARSE = matchMedia('(pointer:coarse)').matches;
let kstick={on:false,id:-1,bx:0,by:0,dx:0,dy:0};
const rnd = n => Math.floor(Math.random()*n);

/* ── баланс ── */
const HERO_HP   = 5;
const HERO_SPD  = 240;
const DART_CD   = 0.22;
const DART_SPD  = 560;
const DART_DMG  = 2;

const WAVES     = [4, 6, 8, 10, 12];   // пять волн, миньоны заходят из-за края
const FOE_HP    = {roll:2, spike:1, jump:2, chain:1};
const FOE_SPD   = {roll:70,  spike:52, jump:0,  chain:44};

const WAVE_NAME = ['','ПЕРВАЯ ВОЛНА','ВТОРАЯ ВОЛНА','ТРЕТЬЯ ВОЛНА','ЧЕТВЁРТАЯ ВОЛНА','ПЯТАЯ ВОЛНА'];
const NUT_SPD   = 290;               // скорость брошенного ореха
const NUT_CD    = 3.4;               // как часто метатель кидает
const BOSS_NUTS = 5;                 // сколько горящих орехов кидает Каштан за раз
const BOSS_HP   = 30;
const BOSS_PH   = [1, 0.66, 0.33];   // границы фаз по доле здоровья
const FIRE_EVERY = 16;               // как часто загорается новый сектор
const FIRE_DMG   = 0.9;              // урон в секунду в огне
const GRID_X = 4, GRID_Y = 3;        // сетка секторов пола
const PROPS_N  = 5;                  // столов и стоек на арене

const KIMG={};
['k_danya','k_roll','k_spike','k_jump','k_chain','k_boss','k_floor','k_fire','k_table','k_counter'].forEach(k=>{
  if(!ART[k]) return; const i=new Image(); i.src=ART[k]; KIMG[k]=i;
});
function kready(k){ const i=KIMG[k]; return i && i.complete && i.naturalWidth>0; }
function kput(key,x,y,h,rot,alpha){
  if(!kready(key)) return false;
  const im=KIMG[key], w=h*im.naturalWidth/im.naturalHeight;
  kx.save(); kx.translate(x,y);

}

function kfit(){
  kcv=$('#cv'); kx=kcv.getContext('2d');
  const r=Math.min(window.devicePixelRatio||1, 2);
  KW=kcv.clientWidth; KH=kcv.clientHeight;
  kcv.width=Math.round(KW*r); kcv.height=Math.round(KH*r);
  kx.setTransform(r,0,0,r,0,0);
}
addEventListener('resize', ()=>{ if(K) kfit(); });

function arena(){ return {x:KW*0.06, y:KH*0.12, w:KW*0.88, h:KH*0.74}; }
function clampArena(o,r){
  const a=arena();
  o.x=Math.max(a.x+r, Math.min(a.x+a.w-r, o.x));
  o.y=Math.max(a.y+r, Math.min(a.y+a.h-r, o.y));
}
function sectorOf(x,y){
  const a=arena();
  const i=Math.min(GRID_X-1, Math.max(0, Math.floor((x-a.x)/(a.w/GRID_X))));
  const j=Math.min(GRID_Y-1, Math.max(0, Math.floor((y-a.y)/(a.h/GRID_Y))));
  return j*GRID_X+i;
}

function startKash(){
  show('game'); kfit();
  const a=arena();
  K={
    t:0, phase:'wave', wave:0, over:0, won:false, shake:0,
    me:{x:a.x+a.w*0.5, y:a.y+a.h*0.8, hp:HERO_HP, cd:0, inv:0, face:1, held:0},
    foes:[], darts:[], hail:[], shards:[], roots:[], nuts:[],
    boss:null, bossPh:0, clones:[],
    fire:new Set(), fireT:FIRE_EVERY, props:makeProps(),
    flash:'', flashT:0, last:performance.now()
  };
  spawnWave();
  requestAnimationFrame(kloop);
}

function makeProps(){
  const a=arena(), out=[];
  out.push({kind:'counter', x:a.x+a.w*0.5, y:a.y+a.h*0.10, w:a.w*0.095, h:a.h*0.11});
  const spots=[[0.20,0.40],[0.78,0.38],[0.32,0.72],[0.70,0.70]];
  for(const [px,py] of spots)
    out.push({kind:'table', x:a.x+a.w*px, y:a.y+a.h*py, w:a.w*0.095, h:a.h*0.11});
  return out;
}
/* мебель не пускает: выталкиваем по меньшей оси перекрытия */
function pushOut(o, r){
  for(const p of K.props){
    const dx=o.x-p.x, dy=o.y-p.y;
    const ox=p.w/2+r-Math.abs(dx), oy=p.h/2+r-Math.abs(dy);
    if(ox>0 && oy>0){
      if(ox<oy) o.x += dx>0 ? ox : -ox;
      else      o.y += dy>0 ? oy : -oy;
    }
  }
}

function kflash(t){ K.flash=t; K.flashT=1.2; }

function edgeSpot(){
  const a=arena(), side=rnd(4), m=18;          // прямо у кромки арены
  if(side===0) return {x:a.x+m,          y:a.y+a.h*(0.1+Math.random()*0.8)};
  if(side===1) return {x:a.x+a.w-m,      y:a.y+a.h*(0.1+Math.random()*0.8)};
  if(side===2) return {x:a.x+a.w*(0.1+Math.random()*0.8), y:a.y+m};
  return              {x:a.x+a.w*(0.1+Math.random()*0.8), y:a.y+a.h-m};
}

function spawnWave(){
  const n=WAVES[K.wave]||6;
  const kinds=['roll','spike','jump','chain'];
  let spikes=0;
  for(let i=0;i<n;i++){
    const kind=kinds[i%4];
    const p=edgeSpot();
    if(kind==='chain'){
      for(let k=0;k<3;k++) K.foes.push({x:p.x+k*26, y:p.y, hp:FOE_HP.chain, kind:'chain',
                                        t:0, link:k===1, gid:K.t*100+i, hurt:0});
    } else {
      const thrower = (kind==='spike') && (spikes++ % 2 === 0);   // каждый второй колючий кидает орехи
      K.foes.push({x:p.x, y:p.y, hp:FOE_HP[kind], kind, t:Math.random()*2,
                   st:'idle', vx:0, vy:0, hurt:0, thrower, tcd:1.4+Math.random()*1.4});
    }
  }
  kflash(WAVE_NAME[K.wave+1] || 'ВОЛНА');
}

function spawnBoss(){
  const a=arena();
  K.phase='boss';
  K.boss={x:a.x+a.w*0.5, y:a.y+a.h*0.22, hp:BOSS_HP, st:'idle', t:0, cd:1.2, armor:false, open:0};
  K.bossPh=0;
  kflash('КАШТАН'); sfxBoss();
}

/* ── управление ── */
function throwDart(){
  const g=K; if(!g||g.over>0||g.me.cd>0||g.me.held>0) return;
  const me=g.me; me.cd=DART_CD;
  let tx=null, ty=null, bd=1e9;
  const cands=[...g.foes.filter(f=>f.hp>0), ...g.clones, ...(g.boss?[g.boss]:[])];
  for(const f of cands){
    const d=Math.hypot(f.x-me.x, f.y-me.y);
    if(d<bd){ bd=d; tx=f.x; ty=f.y; }
  }
  if(tx===null){ tx=me.x; ty=me.y-100; }
  const ang=Math.atan2(ty-me.y, tx-me.x);
  me.face = Math.cos(ang)>0 ? 1 : -1;
  g.darts.push({x:me.x, y:me.y, vx:Math.cos(ang)*DART_SPD, vy:Math.sin(ang)*DART_SPD, t:0});
  sfxDart();
}

const keys={};
function bindPointer(){
  addEventListener('keydown', e=>{
    keys[e.key]=true;
    if(e.key===' '){ e.preventDefault(); throwDart(); }
    if(K && K.me.held>0 && (e.key===' '||e.key.startsWith('Arrow'))) K.me.held-=0.12;
  });
  addEventListener('keyup', e=>{ keys[e.key]=false; });

  const el=$('#game');
  el.addEventListener('pointerdown', e=>{
    if(!K||K.over>0) return;
    const r=kcv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(K.me.held>0){ K.me.held-=0.15; return; }        // вырываемся из корней тапами
    if(COARSE && x < KW*0.45){ kstick={on:true,id:e.pointerId,bx:x,by:y,dx:0,dy:0}; }
    else throwDart();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  });
  el.addEventListener('pointermove', e=>{
    if(!K||!kstick.on||e.pointerId!==kstick.id) return;
    const r=kcv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    const dx=x-kstick.bx, dy=y-kstick.by, d=Math.hypot(dx,dy)||1, m=Math.min(1,d/60);
    kstick.dx=dx/d*m; kstick.dy=dy/d*m;
  });
  const up=e=>{ if(kstick.on&&e.pointerId===kstick.id) kstick={on:false,id:-1,bx:0,by:0,dx:0,dy:0}; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

function hurtMe(n){
  const me=K.me;
  if(me.inv>0) return;
  me.hp-=(n||1); me.inv=1.0; K.shake=10; sfxHit();
  if(me.hp<=0 && K.over<=0){ K.over=1.3; K.won=false; }
}

/* ── шаг ── */
function kstep(dt){
  const g=K, a=arena(), me=g.me;
  if(g.over>0){ g.over-=dt; if(g.over<=0) kfinish(); return; }
  g.t+=dt;
  if(g.flashT>0) g.flashT-=dt;
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*24);
  if(me.cd>0) me.cd-=dt;
  if(me.inv>0) me.inv-=dt;
  if(me.held>0) me.held-=dt*0.35;

  /* пожар расползается */
  g.fireT-=dt;
  if(g.fireT<=0 && g.fire.size < GRID_X*GRID_Y-2){
    g.fireT=FIRE_EVERY;
    let s; do { s=rnd(GRID_X*GRID_Y); } while(g.fire.has(s));
    g.fire.add(s); if(g.phase==='wave') kflash('ГОРИТ'); sfxFire();
  }
  if(g.fire.has(sectorOf(me.x,me.y))){
    me.fireHurt=(me.fireHurt||0)+dt;
    if(me.fireHurt>1/FIRE_DMG){ me.fireHurt=0; me.inv=0; hurtMe(1); }
  }

  /* герой */
  if(me.held<=0){
    let dx=0, dy=0;
    if(kstick.on){ dx=kstick.dx; dy=kstick.dy; }
    if(keys['ArrowLeft']||keys['a']) dx=-1;
    if(keys['ArrowRight']||keys['d']) dx=1;
    if(keys['ArrowUp']||keys['w']) dy=-1;
    if(keys['ArrowDown']||keys['s']) dy=1;
    const d=Math.hypot(dx,dy);
    if(d>0){ me.x+=dx/d*HERO_SPD*dt; me.y+=dy/d*HERO_SPD*dt; me.face=dx>0?1:(dx<0?-1:me.face); }
    clampArena(me, 16); pushOut(me, 16);
  }

  /* шприцы */
  for(const s of g.darts){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.t+=dt;
    if(s.x<a.x||s.x>a.x+a.w||s.y<a.y||s.y>a.y+a.h) s.dead=true;
  }

  stepFoes(dt);
  stepBoss(dt);

  /* попадания */
  for(const s of g.darts){
    if(s.dead) continue;
    for(const f of g.foes){
      if(f.hp<=0) continue;
      if(f.kind==='roll' && f.st==='roll') continue;      // катун в шаре неуязвим
      if(f.kind==='chain' && !f.link) continue;           // сцепку бьём только в стык
      if(Math.hypot(f.x-s.x, f.y-s.y) < 22){
        f.hp-=DART_DMG; f.hurt=0.15; s.dead=true; sfxPop();
        if(f.hp<=0 && f.kind==='spike') burst(f.x, f.y);
        if(f.hp<=0 && f.kind==='chain') breakChain(f.gid);
        break;
      }
    }
    if(s.dead) continue;
    for(const c of g.clones){
      if(Math.hypot(c.x-s.x, c.y-s.y) < 30){
        s.dead=true;
        if(c.real){ g.boss.hp-=DART_DMG; sfxPop(); }
        else { kflash('ХА-ХА, ЛОХ'); blip(200,.18,'square',.05); }
        break;
      }
    }
    if(s.dead || !g.boss || g.clones.length) continue;
    if(Math.hypot(g.boss.x-s.x, g.boss.y-s.y) < 34){
      s.dead=true;
      if(g.boss.armor && g.boss.open<=0){ blip(120,.06,'square',.03); }
      else { g.boss.hp-=DART_DMG; sfxPop(); g.shake=Math.max(g.shake,4); }
    }
  }
  g.darts=g.darts.filter(s=>!s.dead && s.t<2);
  g.foes=g.foes.filter(f=>f.hp>0);

  /* волны и переход к боссу */
  if(g.phase==='wave' && g.foes.length===0){
    g.wave++;
    if(g.wave>=WAVES.length) spawnBoss();
    else spawnWave();
  }
  if(g.phase==='boss' && g.boss && g.boss.hp<=0 && g.over<=0){
    g.over=1.6; g.won=true; sfxWin(); kflash('ПОБЕДА');
  }
}

function burst(x,y){
  K.shards.push({x,y,t:0});
  if(Math.hypot(K.me.x-x, K.me.y-y) < 74) hurtMe(1);
  sfxPop();
}
function breakChain(gid){
  for(const f of K.foes) if(f.kind==='chain' && f.gid===gid) f.link=true;
}

function stepFoes(dt){
  const g=K, me=g.me;
  for(const f of g.foes){
    if(f.hurt>0) f.hurt-=dt;
    if(f.stun>0){ f.stun-=dt; continue; }
    f.t+=dt;
    const dx=me.x-f.x, dy=me.y-f.y, d=Math.hypot(dx,dy)||1;

    if(f.kind==='roll'){
      if(f.st==='idle' && f.t>1.4){ f.st='wind'; f.t=0; }
      else if(f.st==='wind' && f.t>0.6){
        f.st='roll'; f.t=0; f.vx=dx/d; f.vy=dy/d; sfxRoll();
      } else if(f.st==='roll'){
        const sp=FOE_SPD.roll*(1+f.t*1.6);
        f.x+=f.vx*sp*dt; f.y+=f.vy*sp*dt;
        if(f.t>1.6){ f.st='idle'; f.t=0; }
      } else if(f.st==='idle'){
        f.x+=dx/d*30*dt; f.y+=dy/d*30*dt;
      }
    }
    else if(f.kind==='spike'){
      if(f.thrower){                                   // держится поодаль и кидает орехи
        if(d>190){ f.x+=dx/d*FOE_SPD.spike*dt; f.y+=dy/d*FOE_SPD.spike*dt; }
        else if(d<130){ f.x-=dx/d*FOE_SPD.spike*0.7*dt; f.y-=dy/d*FOE_SPD.spike*0.7*dt; }
        f.tcd-=dt;
        if(f.tcd<=0){
          f.tcd=NUT_CD;
          g.nuts.push({x:f.x, y:f.y, vx:dx/d*NUT_SPD, vy:dy/d*NUT_SPD, fire:false, t:0});
          sfxPop();
        }
      } else {
        f.x+=dx/d*FOE_SPD.spike*dt; f.y+=dy/d*FOE_SPD.spike*dt;
      }
    }
    else if(f.kind==='jump'){
      if(f.st==='idle' && f.t>1.2){ f.st='aim'; f.t=0; f.tx=me.x; f.ty=me.y; }
      else if(f.st==='aim' && f.t>0.8){ f.st='fly'; f.t=0; f.sx=f.x; f.sy=f.y; }
      else if(f.st==='fly'){
        const p=Math.min(1, f.t/0.5);
        f.x=f.sx+(f.tx-f.sx)*p; f.y=f.sy+(f.ty-f.sy)*p;
        if(p>=1){
          f.st='idle'; f.t=0;
          if(Math.hypot(me.x-f.x, me.y-f.y)<64) hurtMe(1);
          g.shards.push({x:f.x,y:f.y,t:0,ring:true});
        }
      }
    }
    else if(f.kind==='chain'){
      f.x+=dx/d*FOE_SPD.chain*dt; f.y+=dy/d*FOE_SPD.chain*dt;
    }

    clampArena(f, 14); pushOut(f, 14);
    if(Math.hypot(me.x-f.x, me.y-f.y) < 26 && me.inv<=0){
      hurtMe(1);
      const bx=f.x-me.x, by=f.y-me.y, bd=Math.hypot(bx,by)||1;
      f.x+=bx/bd*70; f.y+=by/bd*70; f.stun=0.6;      // отлетает и замирает
      if(f.kind==='roll'){ f.st='idle'; f.t=0; }
    }
  }
  for(const n of g.nuts){
    n.x+=n.vx*dt; n.y+=n.vy*dt; n.t+=dt;
    const a2=arena();
    if(n.x<a2.x-60||n.x>a2.x+a2.w+60||n.y<a2.y-60||n.y>a2.y+a2.h+60) n.dead=true;
    if(!n.dead && Math.hypot(me.x-n.x, me.y-n.y)<24){
      n.dead=true; hurtMe(1);
      if(n.fire){ g.shards.push({x:n.x,y:n.y,t:0}); K.fire.add(sectorOf(n.x,n.y)); }
    }
  }
  g.nuts=g.nuts.filter(n=>!n.dead && n.t<3);

  for(const s of g.shards) s.t+=dt;
  g.shards=g.shards.filter(s=>s.t<0.5);
}

function stepBoss(dt){
  const g=K, bs=g.boss; if(!bs) return;
  const me=g.me, a=arena();
  bs.t+=dt; bs.cd-=dt;
  if(bs.open>0) bs.open-=dt;

  const frac=bs.hp/BOSS_HP;
  const ph = frac>BOSS_PH[1] ? 0 : (frac>BOSS_PH[2] ? 1 : 2);
  if(ph!==g.bossPh){
    g.bossPh=ph;
    bs.armor = ph>=1;
    if(ph===2) splitBoss();
    sfxBoss();
  }

  /* град каштанов */
  for(const p of g.props){                       // мебель
    const key = p.kind==='counter' ? 'k_counter' : 'k_table';
    if(!kput(key, p.x, p.y+p.h*0.30, p.h*1.35, 0, 1)){
      kx.fillStyle='#4a3524'; kx.fillRect(p.x-p.w/2, p.y-p.h/2, p.w, p.h);
    }
  }

  for(const h of g.hail){
    h.t+=dt;
    if(h.t>1.0 && !h.hit){
      h.hit=true;
      if(Math.hypot(me.x-h.x, me.y-h.y)<40) hurtMe(1);
      g.shards.push({x:h.x,y:h.y,t:0});
    }
  }
  g.hail=g.hail.filter(h=>h.t<1.4);

  /* корни */
  for(const r of g.roots){
    r.t+=dt;
    if(r.t>0.7 && !r.hit){
      r.hit=true;
      if(Math.hypot(me.x-r.x, me.y-r.y)<44){ me.held=1.1; }
    }
  }
  g.roots=g.roots.filter(r=>r.t<1.6);

  if(g.clones.length){                       // третья фаза: трое по краям
    for(const c of g.clones){
      const dx=me.x-c.x, dy=me.y-c.y, d=Math.hypot(dx,dy)||1;
      c.x+=dx/d*16*dt; c.y+=dy/d*16*dt;      // сходятся медленно
      clampArena(c, 22); pushOut(c, 22);
      if(Math.hypot(me.x-c.x, me.y-c.y)<30) hurtMe(1);
      c.cd-=dt;
      if(c.cd<=0){                            // каждый кидает горящие орехи
        c.cd=2.4+Math.random();
        const an=Math.atan2(me.y-c.y, me.x-c.x);
        for(let i=-1;i<=1;i++)
          g.nuts.push({x:c.x, y:c.y, vx:Math.cos(an+i*0.16)*NUT_SPD,
                       vy:Math.sin(an+i*0.16)*NUT_SPD, fire:true, t:0});
        sfxFire();
      }
    }
    return;
  }

  /* обычные фазы */
  const dx=me.x-bs.x, dy=me.y-bs.y, d=Math.hypot(dx,dy)||1;
  if(bs.st==='idle'){
    bs.x+=dx/d*34*dt; bs.y+=dy/d*34*dt; clampArena(bs, 26); pushOut(bs, 26);
    if(bs.cd<=0){
      const pool = g.bossPh===0 ? ['whip','hail','nuts'] : ['whip','hail','roots','nuts','whip'];
      bs.st=pool[rnd(pool.length)]; bs.t=0;
      if(bs.st==='hail'){
        for(let i=0;i<5;i++) g.hail.push({x:a.x+a.w*Math.random(), y:a.y+a.h*Math.random(), t:0});
      }
      if(bs.st==='nuts'){
        for(let i=0;i<BOSS_NUTS;i++){
          const an=Math.atan2(me.y-bs.y, me.x-bs.x)+(i-(BOSS_NUTS-1)/2)*0.20;
          g.nuts.push({x:bs.x, y:bs.y, vx:Math.cos(an)*NUT_SPD, vy:Math.sin(an)*NUT_SPD, fire:true, t:0});
        }
        sfxFire();
      }
      if(bs.st==='roots'){
        for(let i=0;i<3;i++) g.roots.push({x:me.x+(Math.random()-0.5)*90, y:me.y+(Math.random()-0.5)*90, t:0});
      }
    }
  } else if(bs.st==='whip'){
    if(bs.t>0.5 && !bs.done){
      bs.done=true;
      if(Math.hypot(me.x-bs.x, me.y-bs.y) < 150) hurtMe(1);
    }
    if(bs.t>0.9){ bs.st='idle'; bs.done=false; bs.cd=1.5; bs.open=1.1; }
  } else {
    if(bs.t>0.8){ bs.st='idle'; bs.cd=1.8; bs.open=1.1; }
  }
}

function splitBoss(){
  const a=arena(), real=rnd(3);
  const spots=[{x:a.x+30,        y:a.y+a.h*0.25},
               {x:a.x+a.w-30,    y:a.y+a.h*0.25},
               {x:a.x+a.w*0.5,   y:a.y+a.h-30}];
  K.clones=spots.map((p,i)=>({x:p.x, y:p.y, real:i===real, cd:1.0+i*0.5}));
}

/* ── рисование ── */
function kdraw(){
  const g=K, a=arena();
  kx.fillStyle='#140d0a'; kx.fillRect(0,0,KW,KH);

  /* пол секторами, горящие своим тайлом */
  for(let j=0;j<GRID_Y;j++) for(let i=0;i<GRID_X;i++){
    const s2=j*GRID_X+i, x=a.x+a.w*i/GRID_X, y=a.y+a.h*j/GRID_Y;
    const w=a.w/GRID_X, h=a.h/GRID_Y;
    const burn=g.fire.has(s2), key=burn?'k_fire':'k_floor';
    if(kready(key)){
      const im=KIMG[key], t=Math.max(64, w/2);
      kx.save(); kx.beginPath(); kx.rect(x,y,w,h); kx.clip();
      for(let px=x; px<x+w; px+=t) for(let py=y; py<y+h; py+=t) kx.drawImage(im, px, py, t, t);
      if(burn){ kx.fillStyle='rgba(220,90,20,'+(0.16+Math.sin(g.t*6+s2)*0.06)+')'; kx.fillRect(x,y,w,h); }
      kx.restore();
    } else {
      kx.fillStyle = burn ? 'rgba(176,60,20,.6)' : ((i+j)%2 ? '#2a2119' : '#241c15');
      kx.fillRect(x,y,w,h);
    }
  }
  kx.strokeStyle='#4a3a28'; kx.lineWidth=4; kx.strokeRect(a.x,a.y,a.w,a.h);

  for(const p of g.props){                       // мебель
    const key = p.kind==='counter' ? 'k_counter' : 'k_table';
    if(!kput(key, p.x, p.y+p.h*0.30, p.h*1.35, 0, 1)){
      kx.fillStyle='#4a3524'; kx.fillRect(p.x-p.w/2, p.y-p.h/2, p.w, p.h);
    }
  }

  for(const h of g.hail){                       // тени падающих каштанов
    const p=Math.min(1,h.t/1.0);
    kx.strokeStyle='rgba(240,200,96,'+(0.35+p*0.5)+')'; kx.lineWidth=3;
    kx.beginPath(); kx.arc(h.x,h.y,40*(1-p*0.4),0,7); kx.stroke();
    if(p<1){ kx.fillStyle='#5b3a20'; kx.beginPath(); kx.arc(h.x, h.y-160*(1-p), 12,0,7); kx.fill(); }
  }
  for(const r of g.roots){                      // корни
    const p=Math.min(1,r.t/0.7);
    kx.strokeStyle='#6b4a28'; kx.lineWidth=5;
    for(let i=0;i<4;i++){
      const an=i*1.6+r.t;
      kx.beginPath(); kx.moveTo(r.x,r.y);
      kx.lineTo(r.x+Math.cos(an)*34*p, r.y+Math.sin(an)*34*p); kx.stroke();
    }
  }
  for(const s of g.shards){                     // осколки и волны
    const p=s.t/0.5;
    kx.strokeStyle='rgba(240,200,96,'+(1-p)+')'; kx.lineWidth=3;
    kx.beginPath(); kx.arc(s.x,s.y,(s.ring?70:60)*p,0,7); kx.stroke();
  }

  for(const f of g.foes) drawFoe(f);
  for(const c of g.clones){
    const jx = c.real ? 0 : Math.sin(g.t*22+c.x)*2.4;    // подделки дрожат
    const jy = c.real ? 0 : Math.cos(g.t*19+c.y)*1.8;
    if(c.real){                                          // настоящий чуть светится
      const p=0.18+Math.sin(g.t*3)*0.06;
      const gr=kx.createRadialGradient(c.x, c.y-18, 6, c.x, c.y-18, 62);
      gr.addColorStop(0,'rgba(240,200,96,'+p+')');
      gr.addColorStop(1,'rgba(240,200,96,0)');
      kx.fillStyle=gr;
      kx.beginPath(); kx.arc(c.x, c.y-18, 62, 0, 7); kx.fill();
    }
    drawKash(c.x+jx, c.y+jy, 0.8, false);
  }
  if(g.boss && !g.clones.length) drawKash(g.boss.x,g.boss.y,1, true);

  for(const n of g.nuts){                       // орехи
    kx.save(); kx.translate(n.x,n.y); kx.rotate(n.t*9);
    kx.fillStyle=n.fire?'#c85a1a':'#7a4a22';
    kx.beginPath(); kx.ellipse(0,0,9,8,0,0,7); kx.fill();
    kx.strokeStyle=n.fire?'#f0c860':'#3a2a18'; kx.lineWidth=2;
    kx.beginPath(); kx.arc(0,0,9,0,7); kx.stroke();
    if(n.fire){ kx.fillStyle='rgba(240,160,60,.45)'; kx.beginPath(); kx.arc(0,0,15,0,7); kx.fill(); }
    kx.restore();
  }

  for(const s of g.darts){                      // шприцы
    kx.strokeStyle='#e4dcc6'; kx.lineWidth=3;
    const an=Math.atan2(s.vy,s.vx);
    kx.beginPath(); kx.moveTo(s.x,s.y); kx.lineTo(s.x-Math.cos(an)*14, s.y-Math.sin(an)*14); kx.stroke();
  }
  drawHero();
  drawHud();

  if(kstick.on){
    kx.strokeStyle='rgba(240,200,96,.35)'; kx.lineWidth=3;
    kx.beginPath(); kx.arc(kstick.bx,kstick.by,46,0,7); kx.stroke();
    kx.fillStyle='rgba(240,200,96,.5)';
    kx.beginPath(); kx.arc(kstick.bx+kstick.dx*46, kstick.by+kstick.dy*46, 16,0,7); kx.fill();
  }
}

function drawFoe(f){
  const key = f.kind==='roll' ? 'k_roll' : f.kind==='spike' ? 'k_spike'
            : f.kind==='jump' ? 'k_jump' : 'k_chain';
  let y=f.y, rot=0;
  if(f.kind==='roll' && f.st==='roll') rot=f.t*12;
  if(f.kind==='jump' && f.st==='fly') y-=26*Math.sin(Math.PI*Math.min(1,f.t/0.5));
  const alpha = f.hurt>0 ? 0.5 : 1;
  if(!kput(key, f.x, y, 46, rot, alpha)){
    kx.fillStyle=f.hurt>0?'#d8d2c0':'#8a5a2c';
    kx.beginPath(); kx.ellipse(f.x,y,15,13,0,0,7); kx.fill();
  }
}

function drawKash(x,y,s,glow){
  if(!kput('k_boss', x, y, 96*s, 0, 1)){
    kx.fillStyle='#8a4f22'; kx.beginPath(); kx.ellipse(x,y,26*s,24*s,0,0,7); kx.fill();
  }
}

function drawHero(){
  const me=K.me;
  const a = (me.inv>0 && Math.floor(me.inv*14)%2) ? 0.45 : 1;
  if(!kput('k_danya', me.x, me.y, 64, 0, a)){
    kx.fillStyle='#e8e2d4'; kx.beginPath(); kx.ellipse(me.x,me.y,15,19,0,0,7); kx.fill();
  }
  if(me.held>0){
    kx.strokeStyle='#6b4a28'; kx.lineWidth=4;
    for(let i=0;i<5;i++){ const an=i*1.25;
      kx.beginPath(); kx.moveTo(me.x,me.y+6);
      kx.lineTo(me.x+Math.cos(an)*26, me.y+6+Math.sin(an)*14); kx.stroke(); }
  }
}

function drawHud(){
  const g=K;

  /* сердца — как в бою с Н.О. */
  const heart=(cxp,cyp,sc,fill)=>{
    kx.save(); kx.translate(cxp,cyp); kx.scale(sc,sc);
    kx.beginPath(); kx.moveTo(0,3.4);
    kx.bezierCurveTo(-5.2,-1.4,-4.4,-6.4,-1.9,-6.4);
    kx.bezierCurveTo(-0.7,-6.4,0,-5.5,0,-4.6);
    kx.bezierCurveTo(0,-5.5,0.7,-6.4,1.9,-6.4);
    kx.bezierCurveTo(4.4,-6.4,5.2,-1.4,0,3.4);
    kx.closePath(); kx.fillStyle=fill; kx.fill();
    kx.strokeStyle='rgba(6,8,4,.8)'; kx.lineWidth=1.1; kx.stroke(); kx.restore();
  };
  for(let i=0;i<HERO_HP;i++)
    heart(24+i*22, 26, 2.0, i<g.me.hp ? '#c8342a' : 'rgba(180,170,150,.18)');

  /* полоска босса — тот же формат */
  if(g.boss){
    const bw=Math.min(KW*0.56,460), bx=KW/2-bw/2, by=16;
    kx.fillStyle='rgba(6,8,4,.78)'; kx.fillRect(bx-2,by-2,bw+4,17);
    kx.fillStyle='#3a2a1a'; kx.fillRect(bx,by,bw,13);
    kx.fillStyle = g.bossPh===2 ? '#b02a1a' : g.bossPh===1 ? '#d08a2a' : '#8a4a9a';
    kx.fillRect(bx,by,bw*Math.max(0,g.boss.hp/BOSS_HP),13);
    kx.font='700 10px "Courier New",monospace'; kx.textAlign='center'; kx.fillStyle='#e4dcc6';
    kx.fillText('КАШТАН', KW/2, by+24); kx.textAlign='left';
  } else {
    kx.fillStyle='rgba(228,220,198,.9)'; kx.font='bold 14px Courier New, monospace';
    kx.textAlign='right';
    kx.fillText('волна '+(g.wave+1)+' из '+WAVES.length+'   осталось '+g.foes.length, KW-16, 28);
    kx.textAlign='left';
  }

  if(g.flashT>0){
    kx.save(); kx.globalAlpha=Math.min(1,g.flashT*1.5);
    kx.font='700 '+Math.round(Math.min(36,KW*0.052))+'px Arial Black, Arial, sans-serif';
    kx.textAlign='center'; kx.fillStyle='#f0c860';
    kx.fillText(g.flash, KW/2, KH*0.32); kx.restore(); kx.textAlign='left';
  }
}

function kloop(now){
  if(!K) return;
  const dt=Math.min(0.033,(now-K.last)/1000); K.last=now;
  kstep(dt);
  if(!K) return;
  kx.save();
  if(K.shake>0) kx.translate((Math.random()-0.5)*K.shake,(Math.random()-0.5)*K.shake);
  kdraw();
  kx.restore();
  requestAnimationFrame(kloop);
}

function kfinish(){
  const won=K.won; K=null;
  if(won){ if(onDone) onDone(); else show('menu'); return; }
  show('over');
  $('#overbox').innerHTML =
    '<h2>Сгорел</h2><div class="rule"></div>'+
    '<p>Каштан остался стоять на столе.</p>'+
    '<p>Зал догорает без вас.</p>'+
    '<button class="bigbtn" id="ov-again">Ещё раз</button>';
  $('#ov-again').onclick = startKash;
}

bindPointer();
return { start(cb){ onDone=cb; startKash(); }, stop(){ K=null; },
         skip(){ K=null; if(onDone) onDone(); }, state(){ return K; } };
})();

/* ══════════ МИССИЯ 7: Е.А. ══════════ */
const EABOSS = (function(){
let onDone=null;
/* ═══════════ Е.А. — КОНТРОЛЬНАЯ ═══════════ */

const sfxDart =()=>blip(420,.05,'square',.03);
const sfxPop  =()=>blip(240,.08,'square',.04);
const sfxRoll =()=>blip(110,.30,'sawtooth',.05);
const sfxTap  =()=>blip(700,.06,'square',.05);
const sfxBoss =()=>blip(90,.55,'sawtooth',.07);

let E=null, ecv=null, ex=null, EW=0, EH=0;
const COARSE = matchMedia('(pointer:coarse)').matches;
let estick={on:false,id:-1,bx:0,by:0,dx:0,dy:0};
const rnd = n => Math.floor(Math.random()*n);

/* ── баланс ── */
const HERO_HP  = 5;
const HERO_SPD = 240;
const DART_CD  = 0.24;
const DART_SPD = 560;
const DART_DMG = 2;

const BOSS_HP  = 22;
const FOE_HP   = 2;
const FOE_SPD  = 54;
const FOE_EVERY= 2.4;       // как часто подходит новый миньон
const FOE_MAX  = 6;         // сколько их держится на арене разом

const SERYOGA_OK = true;    // жив ли Серёга — снаружи выставляется до старта
const TEST_TIME = 4.2;      // сколько даётся на контрольную
const TEST_EVERY= 8;       // как часто она случается
const OPEN_TIME = 4.2;      // окно урона после верного ответа

const TESTS = [
  {q:'КТО БРОСИЛ БУМАГУ В УНИТАЗ НА ДАЧЕ', a:['МИША','ПАША','СЕНЯ'], r:1}
];

const EIMG={};
['e_boss','e_boss4','e_boss3','e_foe','e_globe','e_tent','e_ground','e_danya','e_danya2','e_tree','e_fire','e_misha','e_pasha','e_senya'].forEach(k=>{
  if(!ART[k]) return; const i=new Image(); i.src=ART[k]; EIMG[k]=i;
});
function eready(k){ const i=EIMG[k]; return i && i.complete && i.naturalWidth>0; }
function eput(key,x,y,h,rot,alpha){
  if(!eready(key)) return false;
  const im=EIMG[key], w=h*im.naturalWidth/im.naturalHeight;
  ex.save(); ex.translate(x,y);
  if(rot) ex.rotate(rot);
  if(alpha!==undefined) ex.globalAlpha=alpha;
  ex.drawImage(im, -w/2, -h*0.62, w, h);
  ex.restore(); return true;
}
/* размеры один в один как в бою с Н.О. */
const SZ = {hero:64, foe:66, boss:104, globe:70, tent:118, fire:74};

function efit(){
  ecv=$('#cv'); ex=ecv.getContext('2d');
  const r=Math.min(window.devicePixelRatio||1, 2);
  EW=ecv.clientWidth; EH=ecv.clientHeight;
  ecv.width=Math.round(EW*r); ecv.height=Math.round(EH*r);
  ex.setTransform(r,0,0,r,0,0);
}
addEventListener('resize', ()=>{ if(E) efit(); });

function arena(){ return {x:20, y:EH*0.18, w:EW-40, h:EH-30-EH*0.18}; }
function clampArena(o,r){
  const a=arena();
  o.x=Math.max(a.x+r, Math.min(a.x+a.w-r, o.x));
  o.y=Math.max(a.y+r, Math.min(a.y+a.h-r, o.y));
}
function edgeSpot(){
  const a=arena(), s=rnd(4), m=16;
  if(s===0) return {x:a.x+m, y:a.y+a.h*(0.1+Math.random()*0.8)};
  if(s===1) return {x:a.x+a.w-m, y:a.y+a.h*(0.1+Math.random()*0.8)};
  if(s===2) return {x:a.x+a.w*(0.1+Math.random()*0.8), y:a.y+m};
  return {x:a.x+a.w*(0.1+Math.random()*0.8), y:a.y+a.h-m};
}

function startEA(){
  show('game'); efit();
  const a=arena();
  E={
    t:0, over:0, won:false, shake:0, flash:'', flashT:0,
    me:{x:a.x+a.w*0.5, y:a.y+a.h*0.78, hp:HERO_HP, cd:0, inv:0, held:0},
    foes:[], darts:[], globe:null, jab:null,
    boss:{x:a.x+a.w*0.5, y:a.y+a.h*0.18, hp:BOSS_HP, st:'idle', t:0, cd:2.0, open:0, kick:0, pull:0},
    ph:0, foeT:1.2, testT:TEST_EVERY, test:null, tents:makeTents(),
    last:performance.now()
  };
  eflash('Е.А.'); sfxBoss();
  requestAnimationFrame(eloop);
}
function makeTents(){
  const a=arena();
  const out=[[0.14,0.20],[0.86,0.20],[0.11,0.80],[0.89,0.80]].map(([px,py])=>({
    kind:'tent', x:a.x+a.w*px, y:a.y+a.h*py, w:a.w*0.15, h:a.h*0.20
  }));
  out.push({kind:'fire', x:a.x+a.w*0.5, y:a.y+a.h*0.55, w:a.w*0.07, h:a.h*0.09});
  return out;
}
function pushOut(o,r){
  for(const t of E.tents){
    if(t.kind==='fire') continue;
    const dx=o.x-t.x, dy=o.y-t.y;
    const ox=t.w/2+r-Math.abs(dx), oy=t.h/2+r-Math.abs(dy);
    if(ox>0 && oy>0){
      if(ox<oy) o.x += dx>0?ox:-ox; else o.y += dy>0?oy:-oy;
    }
  }
}

function eflash(t){ E.flash=t; E.flashT=1.3; }

function hurtMe(n){
  const me=E.me;
  if(me.inv>0) return;
  me.hp-=(n||1); me.inv=1.0; E.shake=10; sfxHit();
  if(me.hp<=0 && E.over<=0){ E.over=1.3; E.won=false; }
}

function throwDart(){
  const g=E; if(!g||g.over>0||g.me.cd>0||g.me.held>0) return;
  const me=g.me; me.cd=DART_CD;
  let tx=g.boss.x, ty=g.boss.y, bd=Math.hypot(g.boss.x-me.x, g.boss.y-me.y);
  for(const f of g.foes){
    const d=Math.hypot(f.x-me.x, f.y-me.y);
    if(d<bd*0.8){ bd=d; tx=f.x; ty=f.y; }
  }
  const an=Math.atan2(ty-me.y, tx-me.x);
  g.darts.push({x:me.x, y:me.y, vx:Math.cos(an)*DART_SPD, vy:Math.sin(an)*DART_SPD, t:0});
  sfxDart();
}

const keys={};
function bindPointer(){
  addEventListener('keydown', e=>{
    keys[e.key]=true;
    if(e.key===' '){ e.preventDefault(); throwDart(); }
    if(E && E.me.held>0) E.me.held-=0.12;
  });
  addEventListener('keyup', e=>{ keys[e.key]=false; });
  const el=$('#game');
  el.addEventListener('pointerdown', e=>{
    if(!E||E.over>0) return;
    const r=ecv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(E.me.held>0){ E.me.held-=0.15; return; }
    if(COARSE && x < EW*0.45) estick={on:true,id:e.pointerId,bx:x,by:y,dx:0,dy:0};
    else throwDart();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  });
  el.addEventListener('pointermove', e=>{
    if(!E||!estick.on||e.pointerId!==estick.id) return;
    const r=ecv.getBoundingClientRect();
    const dx=e.clientX-r.left-estick.bx, dy=e.clientY-r.top-estick.by;
    const d=Math.hypot(dx,dy)||1, m=Math.min(1,d/60);
    estick.dx=dx/d*m; estick.dy=dy/d*m;
  });
  const up=e=>{ if(estick.on&&e.pointerId===estick.id) estick={on:false,id:-1,bx:0,by:0,dx:0,dy:0}; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

/* ── контрольная ── */
function startTest(){
  const a=arena(), t=TESTS[rnd(TESTS.length)];
  const R=Math.min(a.w,a.h)*0.075;   // круги вдвое меньше
  const zones=[];
  for(let i=0;i<3;i++){
    let z=null;
    for(let tries=0; tries<60 && !z; tries++){
      const c={x:a.x+R+Math.random()*(a.w-2*R), y:a.y+R+Math.random()*(a.h-2*R)};
      let ok=true;
      for(const t of E.tents)
        if(Math.abs(c.x-t.x)<t.w/2+R && Math.abs(c.y-t.y)<t.h/2+R) ok=false;
      for(const o of zones)
        if(Math.hypot(c.x-o.x, c.y-o.y) < R*2.4) ok=false;
      if(ok) z=c;
    }
    if(!z) z={x:a.x+a.w*(0.2+i*0.3), y:a.y+a.h*0.7};
    zones.push({x:z.x, y:z.y, r:R, label:t.a[i], right:i===t.r,
                port:['e_misha','e_pasha','e_senya'][t.a[i]==='МИША'?0:t.a[i]==='ПАША'?1:2]});
  }
  E.test={q:t.q, zones, t:TEST_TIME, done:false};
  eflash('КОНТРОЛЬНАЯ'); sfxTap();
  if(SERYOGA_OK) setTimeout(()=>{ if(E&&E.test) eflash('«ПАША, ДАНЯ! ПАША!»'); }, 900);
}
function judgeTest(){
  const me=E.me, ts=E.test;
  let inRight=false, inAny=false;
  for(const z of ts.zones){
    if(Math.hypot(me.x-z.x, me.y-z.y) < z.r){ inAny=true; if(z.right) inRight=true; }
  }
  ts.done=true;
  if(inRight){ E.boss.open=OPEN_TIME; eflash('ВЕРНО'); }
  else { hurtMe(1); E.shake=12; eflash('НЕВЕРНО'); sfxTap(); }
  setTimeout(()=>{ if(E) E.test=null; }, 700);
}

/* ── шаг ── */
function estep(dt){
  const g=E, a=arena(), me=g.me, bs=g.boss;
  if(g.over>0){ g.over-=dt; if(g.over<=0) efinish(); return; }
  g.t+=dt;
  if(g.flashT>0) g.flashT-=dt;
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*24);
  if(me.cd>0) me.cd-=dt;
  if(me.inv>0) me.inv-=dt;
  if(me.held>0) me.held-=dt*0.35;
  if(bs.open>0) bs.open-=dt;

  const frac=bs.hp/BOSS_HP;
  const ph = frac>0.66 ? 0 : frac>0.33 ? 1 : 2;
  if(ph!==g.ph){ g.ph=ph; sfxBoss(); }

  /* герой */
  for(const t of g.tents){                       // костёр обжигает
    if(t.kind!=='fire') continue;
    if(Math.abs(me.x-t.x)<t.w/2+14 && Math.abs(me.y-t.y)<t.h/2+14) hurtMe(1);
  }
  if(me.held<=0){
    let dx=0,dy=0;
    if(estick.on){ dx=estick.dx; dy=estick.dy; }
    if(keys['ArrowLeft']||keys['a']) dx=-1;
    if(keys['ArrowRight']||keys['d']) dx=1;
    if(keys['ArrowUp']||keys['w']) dy=-1;
    if(keys['ArrowDown']||keys['s']) dy=1;
    const d=Math.hypot(dx,dy);
    if(d>0){ me.x+=dx/d*HERO_SPD*dt; me.y+=dy/d*HERO_SPD*dt; }
    clampArena(me,16); pushOut(me,16);
  }

  /* контрольная */
  if(g.test){
    g.test.t-=dt;
    if(g.test.t<=0 && !g.test.done) judgeTest();
  } else {
    g.testT-=dt;
    if(g.testT<=0){ g.testT=TEST_EVERY-g.ph*2.2; startTest(); }
  }

  /* миньоны подходят потоком */
  g.foeT-=dt;
  if(g.foeT<=0 && g.foes.length<FOE_MAX){
    g.foeT=Math.max(0.9, FOE_EVERY-g.ph*0.5);
    const p=edgeSpot();
    g.foes.push({x:p.x, y:p.y, hp:FOE_HP, hurt:0, jab:0, stun:0});
  }
  for(const f of g.foes){
    if(f.hurt>0) f.hurt-=dt;
    if(f.stun>0){ f.stun-=dt; continue; }
    if(E.test){ f.jab=0; continue; }        // на контрольной замирают
    const dx=me.x-f.x, dy=me.y-f.y, d=Math.hypot(dx,dy)||1;
    if(d>52){ f.x+=dx/d*FOE_SPD*dt; f.y+=dy/d*FOE_SPD*dt; f.jab=0; }
    else {
      f.jab+=dt;
      if(f.jab>0.7){ f.jab=0; if(d<62 && me.inv<=0) hurtMe(1); }
    }
    clampArena(f,14); pushOut(f,14);
  }

  /* снаряды */
  for(const s of g.darts){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.t+=dt;
    if(s.x<a.x||s.x>a.x+a.w||s.y<a.y||s.y>a.y+a.h) s.dead=true;
    if(s.dead) continue;
    for(const f of g.foes){
      if(f.hp<=0) continue;
      if(Math.hypot(f.x-s.x, f.y-s.y)<22){ f.hp-=DART_DMG; f.hurt=0.15; s.dead=true; sfxPop(); break; }
    }
    if(s.dead) continue;
    if(Math.hypot(bs.x-s.x, bs.y-s.y)<34){
      s.dead=true;
      if(bs.open>0){ bs.hp-=DART_DMG; sfxPop(); g.shake=Math.max(g.shake,4); }
      else eflash('НЕ ОТВЛЕКАЙТЕСЬ');
    }
  }
  g.darts=g.darts.filter(s=>!s.dead && s.t<2);
  g.foes=g.foes.filter(f=>f.hp>0);

  /* глобус */
  if(g.globe){
    const gl=g.globe;
    gl.x+=gl.vx*dt; gl.y+=gl.vy*dt; gl.sp+=dt*8;
    if(!gl.dust) gl.dust=[];
    gl.dust.push({x:gl.x,y:gl.y,t:0});
    for(const d of gl.dust) d.t+=dt;
    gl.dust=gl.dust.filter(d=>d.t<0.5);
    if(gl.x<a.x+20||gl.x>a.x+a.w-20) gl.vx*=-1;
    if(gl.y<a.y+20||gl.y>a.y+a.h-20) gl.vy*=-1;
    gl.life-=dt;
    if(Math.hypot(me.x-gl.x, me.y-gl.y)<34) hurtMe(1);
    if(gl.life<=0) g.globe=null;
  }

  /* приёмы Е.А. */
  bs.t+=dt; bs.cd-=dt;
  if(bs.st==='idle'){
    const dx=me.x-bs.x, dy=me.y-bs.y, d=Math.hypot(dx,dy)||1;
    bs.x+=dx/d*26*dt; bs.y+=dy/d*26*dt; clampArena(bs,28); pushOut(bs,28);
    if(bs.cd<=0 && !g.test){
      const pool = g.ph===0 ? ['jab','globe'] : ['jab','globe','pull','globe'];
      bs.st=pool[rnd(pool.length)]; bs.t=0;
      if(bs.st==='globe'){ bs.kick=0.5;
        const an=Math.atan2(dy,dx), sp=210+g.ph*40;
        g.globe={x:bs.x, y:bs.y, vx:Math.cos(an)*sp, vy:Math.sin(an)*sp, sp:0, life:4.5};
        sfxRoll();
      }
      if(bs.st==='pull'){ me.held=1.1; bs.pull=0.9; eflash('К ДОСКЕ'); }
    }
  } else if(bs.st==='jab'){
    if(bs.t>0.45 && !bs.done){
      bs.done=true;
      const dx=me.x-bs.x, dy=me.y-bs.y;
      if(Math.hypot(dx,dy)<190) hurtMe(1);
      g.jab={x:bs.x, y:bs.y, ax:dx, ay:dy, t:0};
    }
    if(bs.t>0.9){ bs.st='idle'; bs.done=false; bs.cd=1.6-g.ph*0.25; }
  } else {
    if(bs.t>0.8){ bs.st='idle'; bs.cd=1.9-g.ph*0.3; }
  }
  if(g.jab){ g.jab.t+=dt; if(g.jab.t>0.25) g.jab=null; }
  if(bs.kick>0) bs.kick-=dt;
  if(bs.pull>0) bs.pull-=dt;

  if(bs.hp<=0 && g.over<=0){ g.over=1.6; g.won=true; sfxWin(); eflash('ПОБЕДА'); }
}

/* ── рисование ── */
function edraw(){
  const g=E, a=arena();
  ex.fillStyle='#2e2416'; ex.fillRect(0,0,EW,EH);
  if(eready('e_ground')){
    const im=EIMG.e_ground, t=Math.max(90, a.w/6);
    ex.save(); ex.beginPath(); ex.rect(a.x,a.y,a.w,a.h); ex.clip();
    for(let px=a.x; px<a.x+a.w; px+=t) for(let py=a.y; py<a.y+a.h; py+=t)
      ex.drawImage(im, px, py, t, t);
    ex.restore();
  } else { ex.fillStyle='#5a4a2e'; ex.fillRect(a.x,a.y,a.w,a.h); }

  for(const t of g.tents){
    const kk = t.kind==='tree' ? 'e_tree' : t.kind==='fire' ? 'e_fire' : 'e_tent';
    if(!eput(kk, t.x, t.y+t.h*0.28, (t.kind==='fire'?SZ.fire:SZ.tent), 0, 1)){
      ex.fillStyle='#4a4a34'; ex.fillRect(t.x-t.w/2, t.y-t.h/2, t.w, t.h);
    }
  }

  if(g.test){                                    // зоны контрольной
    for(const z of g.test.zones){
      const inside = Math.hypot(g.me.x-z.x, g.me.y-z.y) < z.r;
      ex.fillStyle = inside ? 'rgba(240,200,96,.30)' : 'rgba(240,200,96,.12)';
      ex.beginPath(); ex.arc(z.x,z.y,z.r,0,7); ex.fill();
      ex.strokeStyle='rgba(240,200,96,'+(inside?1:.75)+')'; ex.lineWidth=inside?5:3;
      ex.beginPath(); ex.arc(z.x,z.y,z.r,0,7); ex.stroke();
      if(!eput(z.port, z.x, z.y+z.r*0.42, z.r*1.43, 0, 1)){   // портрет крупнее, по центру круга
        ex.fillStyle='#f0c860'; ex.textAlign='center';
        ex.font='700 13px "Courier New",monospace';
        ex.fillText(z.label, z.x, z.y+4);
      }
      ex.fillStyle='#f0c860'; ex.textAlign='center';
      ex.font='700 12px "Courier New",monospace';
      ex.fillText(z.label, z.x, z.y+z.r+16);
    }
    ex.textAlign='left';
  }

  for(const f of g.foes){                        // миньоны-глобусы
    const look = g.test ? (Math.atan2(g.test.zones[0].y-f.y, g.test.zones[0].x-f.x)*0.12) : 0;
    if(!eput('e_foe', f.x, f.y, SZ.foe, look, f.hurt>0?0.5:1)){
      ex.fillStyle=f.hurt>0?'#d8d2c0':'#3f6f8a';
      ex.beginPath(); ex.arc(f.x,f.y,15,0,7); ex.fill();
    }
  }

  if(g.globe){                                   // катящийся глобус
    const gl=g.globe;
    if(!eput('e_globe', gl.x, gl.y, SZ.globe, gl.sp, 1)){
      ex.fillStyle='#3f6f8a'; ex.beginPath(); ex.arc(gl.x,gl.y,26,0,7); ex.fill();
    }
  }

  /* Е.А. */
  const bs=g.boss;
  const H=SZ.boss;
  let key='e_boss4', frame=Math.floor(g.t*1.6)%2;        // покой: дыхание
  if(bs.st==='jab'){ key='e_boss4'; frame = bs.t<0.45 ? 2 : 3; }
  else if(bs.kick>0){ key='e_boss3'; frame = bs.kick>0.3 ? 0 : 1; }
  else if(bs.pull>0){ key='e_boss3'; frame = 2; }
  const sheetCols = key==='e_boss4' ? 4 : 3;
  const im=EIMG[key];
  if(im && im.complete && im.naturalWidth>0){
    const fw=im.naturalWidth/sheetCols, fh=im.naturalHeight, w=H*fw/fh;
    ex.drawImage(im, frame*fw, 0, fw, fh, bs.x-w/2, bs.y-H*0.62, w, H);
  } else {
    ex.fillStyle='#4a4436'; ex.beginPath(); ex.ellipse(bs.x,bs.y+4,26,30,0,0,7); ex.fill();
  }
  if(g.jab){                                     // росчерк указки
    const j=g.jab, d=Math.hypot(j.ax,j.ay)||1, k=1-j.t/0.25;
    ex.strokeStyle='rgba(240,220,180,'+(0.25+k*0.55)+')'; ex.lineWidth=7;
    ex.beginPath(); ex.moveTo(bs.x,bs.y);
    ex.lineTo(bs.x+j.ax/d*180*k, bs.y+j.ay/d*180*k); ex.stroke();
  }

  for(const s of g.darts){                       // шприцы
    ex.strokeStyle='#e4dcc6'; ex.lineWidth=3;
    const an=Math.atan2(s.vy,s.vx);
    ex.beginPath(); ex.moveTo(s.x,s.y); ex.lineTo(s.x-Math.cos(an)*14, s.y-Math.sin(an)*14); ex.stroke();
  }

  /* герой */
  const me=g.me;
  const al=(me.inv>0 && Math.floor(me.inv*14)%2)?0.45:1;
  const dh=SZ.hero, dim=EIMG.e_danya2;
  if(dim && dim.complete && dim.naturalWidth>0){
    const fw=dim.naturalWidth/2, fh=dim.naturalHeight, w=dh*fw/fh;
    const fr = me.cd>DART_CD*0.45 ? 1 : 0;
    ex.save(); ex.globalAlpha=al;
    ex.drawImage(dim, fr*fw, 0, fw, fh, me.x-w/2, me.y-dh*0.62, w, dh);
    ex.restore();
  } else if(!eput('e_danya', me.x, me.y, dh, 0, al)){
    ex.fillStyle='#e8e2d4'; ex.beginPath(); ex.ellipse(me.x,me.y,15,19,0,0,7); ex.fill();
  }
  if(me.held>0){
    ex.strokeStyle='#8a7a5a'; ex.lineWidth=4;
    ex.beginPath(); ex.moveTo(me.x,me.y); ex.lineTo(g.boss.x, g.boss.y); ex.stroke();
  }

  edrawHud();
}

function edrawHud(){
  const g=E;
  const heart=(cxp,cyp,sc,fill)=>{
    ex.save(); ex.translate(cxp,cyp); ex.scale(sc,sc);
    ex.beginPath(); ex.moveTo(0,3.4);
    ex.bezierCurveTo(-5.2,-1.4,-4.4,-6.4,-1.9,-6.4);
    ex.bezierCurveTo(-0.7,-6.4,0,-5.5,0,-4.6);
    ex.bezierCurveTo(0,-5.5,0.7,-6.4,1.9,-6.4);
    ex.bezierCurveTo(4.4,-6.4,5.2,-1.4,0,3.4);
    ex.closePath(); ex.fillStyle=fill; ex.fill();
    ex.strokeStyle='rgba(6,8,4,.8)'; ex.lineWidth=1.1; ex.stroke(); ex.restore();
  };
  for(let i=0;i<HERO_HP;i++)
    heart(24+i*22, 26, 2.0, i<g.me.hp ? '#c8342a' : 'rgba(180,170,150,.18)');

  const bw=Math.min(EW*0.56,460), bx=EW/2-bw/2, by=16;
  ex.fillStyle='rgba(6,8,4,.78)'; ex.fillRect(bx-2,by-2,bw+4,17);
  ex.fillStyle='#3a2a1a'; ex.fillRect(bx,by,bw,13);
  ex.fillStyle = g.ph===2 ? '#b02a1a' : g.ph===1 ? '#d08a2a' : '#8a4a9a';
  ex.fillRect(bx,by,bw*Math.max(0,g.boss.hp/BOSS_HP),13);
  ex.font='700 10px "Courier New",monospace'; ex.textAlign='center'; ex.fillStyle='#e4dcc6';
  ex.fillText('Е.А.', EW/2, by+24);

  if(g.test){                                    // вопрос и отсчёт
    ex.font='700 '+Math.round(Math.min(26,EW*0.034))+'px Arial Black, Arial, sans-serif';
    ex.fillStyle='#f0c860';
    ex.fillText(g.test.q, EW/2, EH*0.20);
    ex.font='700 15px "Courier New",monospace'; ex.fillStyle='#e4dcc6';
    ex.fillText(Math.max(0,g.test.t).toFixed(1), EW/2, EH*0.245);
  }
  if(g.flashT>0){
    ex.save(); ex.globalAlpha=Math.min(1,g.flashT*1.5);
    ex.font='700 '+Math.round(Math.min(34,EW*0.05))+'px Arial Black, Arial, sans-serif';
    ex.fillStyle='#f0c860'; ex.fillText(g.flash, EW/2, EH*0.32); ex.restore();
  }
  ex.textAlign='left';
}

function eloop(now){
  if(!E) return;
  const dt=Math.min(0.033,(now-E.last)/1000); E.last=now;
  estep(dt);
  if(!E) return;
  ex.save();
  if(E.shake>0) ex.translate((Math.random()-0.5)*E.shake,(Math.random()-0.5)*E.shake);
  edraw();
  ex.restore();
  requestAnimationFrame(eloop);
}

function efinish(){
  const won=E.won; E=null;
  if(won){ if(onDone) onDone(); else show('menu'); return; }
  show('over');
  $('#overbox').innerHTML =
    '<h2>Двойка</h2><div class="rule"></div>'+
    '<p>Е.А. опускает указку и кивает миньонам.</p>'+
    '<p>Дальше вы уже не помните.</p>'+
    '<button class="bigbtn" id="ov-again">Ещё раз</button>';
  $('#ov-again').onclick = startEA;
}

bindPointer();
return { start(cb){ onDone=cb; startEA(); }, stop(){ E=null; },
         skip(){ E=null; if(onDone) onDone(); }, state(){ return E; } };
})();

/* ══════════ МИССИЯ 8: ВИКТОРИНА ══════════ */
const VIKT = (function(){
let onDone=null, onFail=null;
/* ═══════════ ВИКТОРИНА Е.А. ═══════════ */

const sfxTick =()=>blip(900,.03,'square',.02);
const sfxRight=()=>[660,880].forEach((f,i)=>setTimeout(()=>blip(f,.14,'triangle',.05),i*110));
const sfxWrong=()=>blip(120,.45,'sawtooth',.07);
const sfxHint =()=>blip(520,.09,'triangle',.04);

const Q_TIME  = 20;      // секунд на ответ
const SERYOGA_OK = true; // жив ли Серёга — снаружи выставляется до старта

const QUESTIONS = [
  {q:'Столица Франции?',       a:['Париж','Лион','Марсель','Ницца'], r:0, lvl:'лёгкий'},
  {q:'Столица Японии?',        a:['Осака','Токио','Киото','Нагоя'],  r:1, lvl:'лёгкий'},
  {q:'Столица Египта?',        a:['Александрия','Луксор','Каир','Гиза'], r:2, lvl:'лёгкий'},
  {q:'Столица Австралии?',     a:['Сидней','Мельбурн','Канберра','Перт'], r:2, lvl:'средний'},
  {q:'Столица Канады?',        a:['Торонто','Оттава','Монреаль','Ванкувер'], r:1, lvl:'средний'},
  {q:'Столица Турции?',        a:['Стамбул','Измир','Анкара','Бурса'], r:2, lvl:'средний'},
  {q:'Кто бросил бумагу в унитаз на даче?',
                               a:['Миша','Сеня','Паша','Серёга'], r:2, lvl:'последний'}
];

let Q=null;

/* Е.А. одна и та же весь бой, без смены выражения */
function eaFace(){
  const im=$('#vea'); if(!ART.v_ea) return;
  im.src=ART.v_ea;
  im.style.width='300%';
  im.style.objectFit='none';
  im.style.objectPosition='0% 50%';
  im.style.clipPath='inset(0 66.68% 0 0)';
}
function setupArt(){
  if(ART.v_bg)  $('#vbg').style.backgroundImage="url('"+ART.v_bg+"')";
  if(ART.v_ser) $('#vser').src=ART.v_ser;
  $('#vser').style.display = SERYOGA_OK ? 'block' : 'none';
  eaFace();
  
  const eyes=$('#qeyes'); eyes.innerHTML='';
  for(let i=0;i<9;i++){ const u=document.createElement('u'); eyes.appendChild(u); }
  blinkLoop();
}
function blinkLoop(){
  setInterval(()=>{
    const us=[...document.querySelectorAll('#qeyes u')];
    us.forEach(u=>u.style.opacity='1');
    setTimeout(()=>us.forEach(u=>u.style.opacity='.15'), 90);
    setTimeout(()=>us.forEach(u=>u.style.opacity='1'), 240);
  }, 3400);
}
function drawFlags(){
  const box=$('#qflags'); box.innerHTML='';
  for(let i=0;i<QUESTIONS.length;i++){
    const f=document.createElement('s');
    if(i<Q.i) f.className='on';
    box.appendChild(f);
  }
}

function showQuiz(on){ const e=document.querySelector('#quiz'); if(e) e.classList.toggle('on', !!on); }
function startQuiz(){
  showQuiz(true); setupArt();
  Q={ i:0, t:Q_TIME, lock:false, used:{h50:false, hcall:false, hser:false}, raf:0, last:performance.now() };
  ['h50','hcall','hser'].forEach(k=>$('#'+k).classList.remove('used'));
  renderQ(); drawFlags();
  Q.raf=requestAnimationFrame(tick);
}

function renderQ(){
  const q=QUESTIONS[Q.i];
  $('#qnum').textContent = 'вопрос '+(Q.i+1)+' из '+QUESTIONS.length;
  $('#qlvl').textContent = q.lvl;
  $('#qtext').innerHTML = q.q;
  $('#qsay').textContent = '';
  const box=$('#qopts'); box.innerHTML='';
  q.a.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=txt;
    if(ART.v_plate) b.style.backgroundImage="url('"+ART.v_plate+"')";
    b.onclick=()=>answer(i,b);
    box.appendChild(b);
  });
  Q.t=Q_TIME; Q.lock=false;
}

function tick(now){
  if(!Q) return;
  const dt=Math.min(0.05,(now-Q.last)/1000); Q.last=now;
  if(!Q.lock){
    Q.t-=dt;
    if(Math.floor(Q.t*2)!==Math.floor((Q.t+dt)*2) && Q.t<6) sfxTick();
    const p=Math.max(0, Q.t/Q_TIME);
    $('#fline').style.width = (p*100)+'%';
    $('#fspark').style.left = (p*100)+'%';
    $('#fspark').style.opacity = p>0 ? '1' : '0';
    if(Q.t<=0){ answer(-1,null); }
  }
  Q.raf=requestAnimationFrame(tick);
}

function answer(i, btn){
  if(!Q || Q.lock) return;
  Q.lock=true;
  const q=QUESTIONS[Q.i];
  const opts=[...document.querySelectorAll('#qopts .opt')];
  opts[q.r].classList.add('right');
  if(i===q.r){
    sfxRight(); 
    setTimeout(()=>{
      Q.i++;
      if(Q.i>=QUESTIONS.length){ finishQuiz(true); return; }
      renderQ(); drawFlags(); 
    }, 900);
  } else {
    if(btn) btn.classList.add('wrong');
    sfxWrong(); 
    $('#qsay').textContent = i<0 ? 'Время вышло.' : 'Неверно.';
    setTimeout(()=>finishQuiz(false), 1500);
  }
}

/* ── подсказки ── */
$('#h50').onclick = ()=>{
  if(!Q || Q.used.h50 || Q.lock) return;
  Q.used.h50=true; $('#h50').classList.add('used'); sfxHint();
  const q=QUESTIONS[Q.i], opts=[...document.querySelectorAll('#qopts .opt')];
  const wrong=[0,1,2,3].filter(k=>k!==q.r).sort(()=>Math.random()-0.5).slice(0,2);
  wrong.forEach(k=>opts[k].classList.add('gone'));
  $('#qsay').textContent='Осталось два.';
};
$('#hcall').onclick = ()=>{
  if(!Q || Q.used.hcall || Q.lock) return;
  Q.used.hcall=true; $('#hcall').classList.add('used'); sfxHint();
  const say=$('#qsay');
  say.textContent='Гудки…';
  setTimeout(()=>say.textContent='Гудки… гудки…', 900);
  setTimeout(()=>say.textContent='Паша не берёт. Паше похуй.', 2000);
};
$('#hser').onclick = ()=>{
  if(!Q || Q.used.hser || Q.lock) return;
  Q.used.hser=true; $('#hser').classList.add('used'); sfxHint();
  const q=QUESTIONS[Q.i];
  if(!SERYOGA_OK){ $('#qsay').textContent='Кричать некому.'; return; }
  $('#qsay').textContent='С дерева: «'+q.a[q.r].toUpperCase()+', ДАНЯ! '+q.a[q.r].toUpperCase()+'!»';
  const sv=$('#vser'); sv.classList.remove('yell'); void sv.offsetWidth; sv.classList.add('yell');
};

function finishQuiz(won){
  if(Q && Q.raf) cancelAnimationFrame(Q.raf);
  Q=null;
  showQuiz(false);
  if(won){ if(onDone) onDone(); return; }
  if(onFail) onFail();
  return;
}


return { start(ok,fail){ onDone=ok; onFail=fail; startQuiz(); },
         stop(){ Q=null; }, skip(){ Q=null; if(onDone) onDone(); },
         right(){ return Q ? QUESTIONS[Q.i].r : -1; }, state(){ return Q; } };
})();


/* ═══════════ СЦЕНАРИЙ ═══════════ */

/* гасим кнопки сразу после нажатия — иначе быстрый двойной клик проматывает сцену */
function lockBtns(box){
  if(!box) return;
  box.querySelectorAll('button').forEach(b=>{ b.disabled=true; b.style.pointerEvents='none'; });
}

const MEN=[{k:'seryoga',n:'Серёга',f:'Штык-Ножов'},
           {k:'misha',  n:'Миша',  f:'Овердрафтов'}];

/* сколько талонов просит бабка */
const TALONS_NEED = 75;

/* обувь Дани: 'on' — кроссовки, 'hujon' — кроксы.
   кадры после развилки лежат парами: <база>-on и <база>-hujon */
function shoeKey(base){ return base + '-' + (ST.shoes === 'on' ? 'on' : 'hujon'); }

/* какая фотография соответствует погибшим */
function fotoKey(){
  const order=['seryoga','misha'];
  const dead=order.filter(k=>!ST.alive[k]);
  return dead.length ? 'foto-'+dead.join('-') : null;
}

/* ── показ кадра ── */
function cut(img, html, btns){

/* ── текстовая карточка ── */
function card(big, small, btnText, go){

    '<div class="tbig">'+big+'</div>'+

function goStep(i){
  ST.step=i; saveST();
  if(typeof stopVo==='function') stopVo();   // прошлая реплика обрывается
  const want = MUSMAP[i] || null;
  if(!(MUSKEY==='menu' && want===null)) playMus(want);   // трек меню держится до «Подшить к делу»

}

  const box=$('#crew'); box.innerHTML='';

  const dead=MEN.filter(x=>!ST.alive[x.k]);

    n.innerHTML='возможно, вы ещё какой воздухан<br>проверить мы это не можем — но пиздеть плохо';

      '<br><span style="color:#a49c8a">так и запишем</span>';
    ST.lied=false;
  }
}

/* ── досье на планшете: листается кнопкой ── */
const DOSE=[
  {k:'danya',   img:'dose-danya',   n:'Даниил Кукоцкий', f:'',              g:'КАПИТАН ЗАЕБАЛСЯ'},
  {k:'pasha',   img:'dose-pasha',   n:'Паша',            f:'Фигма',         g:'ПОХУИСТМЕН'},
  {k:'seryoga', img:'dose-seryoga', n:'Серёга',          f:'Штык-Ножов',    g:'ПРАПОР ХУЯПОР'},
  {k:'misha',   img:'dose-misha',   n:'Миша',            f:'Овердрафтов',   g:'ХАН ЗАЛУПЕЙ'},
  {k:'senya',   img:'dose-senya',   n:'Сеня',            f:'Деривативов',   g:'ЁБАКС'}
];
/* статус в досье меняется по ходу игры */
function doseStatus(k){
  if(k==='danya')  return '<b>в строю</b> (босиком, но в строю)';
  if(k==='pasha')  return ST.polRanen===undefined
      ? '<b>в строю</b> (в широком смысле слова)'
      : '<b>в строю</b> (руки из карманов не вынимал)';
  if(k==='senya'){
    if(ST.kartaSrv!==undefined) return '<b>в строю</b> (полгода проходил каштаном)';
    return '<b>в строю</b>';
  }
  if(k==='seryoga'){
    if(ST.alive.seryoga===false) return '<b>погиб</b>';
    if(ST.seryogaSvoboden) return '<b>снят с дерева</b> (орёт, но снят)';
    if((ST.visited||[]).includes('savanna')) return '<b>висит вниз головой</b> у Е.А.';
    return '<b>неизвестно</b> (где-то ебланит)';
  }
  if(k==='misha'){
    if(ST.alive.misha===false) return '<b>погиб</b>';
    if((ST.visited||[]).includes('servernaya')) return '<b>жив</b> (ебланил с монголами полгода)';
    return '<b>неизвестно</b> (где-то ебланит)';
  }
  return ST.alive[k]===false ? '<b>погиб</b>' : '<b>неизвестно</b> (где-то ебланит)';
}

function dose(i){
  const d=DOSE[i];
  let status = doseStatus(d.k);
  cut(d.img,
    d.n + (d.f ? ' ' + d.f : '') + '<br>'+
    'позывной — <b>' + d.g + '</b><br><br>'+
    'статус: ' + status,
    [ i+1 < DOSE.length
        ? {t:'Следующий', go:()=>dose(i+1)}
        : {t:'Закрыть планшет', go:next} ]);
}

/* ── титры ── */
const CRED=['t_1_studiya','t_2_v_glavnyh_rolyah','t_danya','t_seryoga','t_misha',
            't_pasha','t_senya','t_andrey',
            't_s1_shkola','t_s2_virtual','t_s3_uchastok','t_s4_sportzal','t_s5_park',
            't_b1_bablti','t_b2_sapy','t_b3_klub','t_b4_veliki','t_b5_pasha_spit','t_b6_karty',
            't_9_mesiteli_final'];
let credT=null;                              // таймер титров держим снаружи,
function credits(){                          // иначе старый запуск мешает новому
  clearTimeout(credT);
  let i=0, swapping=false;
  show('cred');
  const img=$('#credpic');
  img.style.opacity=0;

  let hint=document.querySelector('.credhint');
  if(hint) hint.classList.remove('on');

  function finishCred(){
    if(hint) hint.classList.remove('on');
    stopMus();
    next();                                  // после титров история продолжается
  }
  function stepC(){
    if(swapping) return;                       // не глотаем несколько карточек за раз
    if(i>=CRED.length){ finishCred(); return; }
    swapping=true;
    clearTimeout(credT);
    img.style.opacity=0;                       // гасим текущую
    setTimeout(()=>{
      img.src=ART[CRED[i]];
      img.style.opacity=1;                     // проявляем новую
      i++;
      swapping=false;
      const last = (i===CRED.length);
      if(last) fadeMus(5.5);                   // на финальной карточке музыка уходит плавно
      const isFight = CRED[i-1] && (CRED[i-1].startsWith('t_s') || CRED[i-1].startsWith('t_b'));
      credT=setTimeout(stepC, last ? 6500 : (isFight ? 3000 : 4300));
    }, i===0 ? 60 : 480);
  }
  $('#cred').onclick=null;        // титры идут сами, пропустить нельзя
  stepC();
}

/* остановка активной миссии при выходе в меню */
function stopMission(){
  /* модули объявлены через const — на window их нет, проверяем через typeof */
  ['RUN','BUH','POG','SON','BOSS','BOSS2'].forEach(n=>{
    try{ const m = eval(n); if(m && m.stop) m.stop(); }catch(e){}
  });
}

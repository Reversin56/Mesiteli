/* ══════════ МИССИЯ 1: ПОБЕГ ОТ БАБОК ══════════ */
const RUN = (function(){
let onDone=null;
/* ═══════════ ПОБЕГ ОТ БАБОК ═══════════ */
let G=null, cv=null, cx=null, VW=0, VH=0;

const DIST_TOTAL = 24000;         // длина забега — около 75 секунд
const TALONS_TOTAL = 75;          // столько талонов появляется за забег, ровно
const LANE_X = [-1, 0, 1];        // три дорожки
const HORIZON = 0.36;             // линия горизонта в долях высоты

/* что бывает на дороге */
const KIND = {
  jump:  [                        // перепрыгнуть — всё низкое
    {img:'katalka',       h:0.52},
    {img:'utki_na_polu',  h:0.30},
    {img:'mokryj_pol',    h:0.46}
  ],
  duck:  [                        // поднырнуть — всё высокое
    {img:'kapelnica',       h:1.30},
    {img:'polka_istorij',   h:1.50},
    {img:'grafik_dezhurstv',h:1.10}
  ],
  live:  [                        // обойти по другой дорожке
    {img:'tolstyj_vrach',   h:1.05},
    {img:'sanitar_poloter', h:1.00}
  ]
};

function fitCanvas(){
  cv=$('#cv'); cx=cv.getContext('2d');
  const r=Math.min(window.devicePixelRatio||1, 2);
  VW=cv.clientWidth; VH=cv.clientHeight;
  cv.width=Math.round(VW*r); cv.height=Math.round(VH*r);
  cx.setTransform(r,0,0,r,0,0);
}
window.addEventListener('resize', ()=>{ if(G) fitCanvas(); });

function startRun(){
  show('game'); fitCanvas();
  G = {
    dist:0, speed:280, lane:1, laneF:1,
    y:0, vy:0, air:false, slide:0,
    items:[], spawnAt:900,
    talons:0, talonsOut:0, hits:0, chase:0.18, chaseTo:0.18,   // ступеньками по числу задетых
    legT:0, shake:0, flash:'', flashT:0,
    over:0, won:false, last:performance.now(), banner:'ПРИЁМНОЕ ОТДЕЛЕНИЕ', bannerT:2.2
  };
  requestAnimationFrame(loop);
}

/* ── ввод ── */
const keys={};
addEventListener('keydown', e=>{
  if(!G || G.over) return;
  const k=e.key.toLowerCase();
  if(['arrowleft','a'].includes(k)) move(-1);
  if(['arrowright','d'].includes(k)) move(1);
  if(['arrowup','w',' '].includes(k)){ jump(); e.preventDefault(); }
  if(['arrowdown','s'].includes(k)) slide();
  keys[k]=true;
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
function bindTouch(id, fn){
  const el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); if(G && !G.over) fn(); }, {passive:false});
}
bindTouch('tzL', ()=>move(-1)); bindTouch('tzR', ()=>move(1));
bindTouch('tzU', jump);         bindTouch('tzD', slide);

function move(d){ G.lane = Math.max(0, Math.min(2, G.lane+d)); }
function jump(){ if(!G.air && G.slide<=0){ G.air=true; G.vy=-1.0; blip(520,.07,'square',.035);} }
function slide(){ if(!G.air && G.slide<=0){ G.slide=0.62; blip(300,.09,'sawtooth',.035);} }

/* ── создание препятствий ── */
function spawn(){
  const g=G, far=DIST_TOTAL-1900;
  if(g.dist>far) return;
  const hard = Math.min(1, g.dist/15000);
  // ряд препятствий: одна-две дорожки заняты, хотя бы одна свободна
  const busy = Math.random() < 0.45*hard ? 2 : 1;
  const lanes=[0,1,2].sort(()=>Math.random()-0.5).slice(0,busy);
  lanes.forEach(l=>{
    const types = ['jump','duck','live'];
    const t = types[Math.floor(Math.random()* (g.dist>2600 ? 3 : 2))];
    const o = KIND[t][Math.floor(Math.random()*KIND[t].length)];
    g.items.push({t, img:o.img, h:o.h, lane:l, z:g.dist+1100});
  });
  // талоны цепочкой на свободной дорожке; за весь забег их ровно TALONS_TOTAL
  const free=[0,1,2].filter(l=>!lanes.includes(l));
  const fl=free[Math.floor(Math.random()*free.length)];
  const progress = Math.min(1, (g.dist+1100)/far);          // насколько прошли дистанцию
  const should = Math.round(TALONS_TOTAL*progress);          // столько должно быть выпущено к этому моменту
  const n = Math.max(0, Math.min(6, should - g.talonsOut));
  for(let i=0;i<n;i++)
    g.items.push({t:'talon', img:'talon', h:0.44, lane:fl, z:g.dist+1100+i*130});
  g.talonsOut += n;
}

/* ── шаг ── */
function step(dt){
  const g=G;
  if(g.over>0){ g.over-=dt; if(g.over<=0) finish(); return; }

  g.speed = 280 + 190*Math.min(1, g.dist/18000);
  g.dist += g.speed*dt;
  g.legT += dt*(g.speed/95);

  // плавный переход между дорожками
  g.laneF += (g.lane-g.laneF) * Math.min(1, dt*11);

  // прыжок
  if(g.air){
    g.vy += 3.1*dt;
    g.y  += g.vy*dt*2.4;
    if(g.y>=0){ g.y=0; g.vy=0; g.air=false; }
  }
  if(g.slide>0) g.slide-=dt;

  // бабки стоят на своей ступеньке и плавно к ней подтягиваются
  g.chaseTo = 0.18 + g.hits*0.27;
  g.chase += (g.chaseTo - g.chase) * Math.min(1, dt*2.2);

  if(g.spawnAt<=g.dist){ spawn(); g.spawnAt = g.dist + 540 + Math.random()*300; }
  if(g.talonsOut < TALONS_TOTAL && g.dist > DIST_TOTAL-2600 && !g.tailDone){
    g.tailDone = true;                                       // хвост: доводим до ровного числа
    const left = TALONS_TOTAL - g.talonsOut, fl = Math.floor(Math.random()*3);
    for(let i=0;i<left;i++)
      g.items.push({t:'talon', img:'talon', h:0.44, lane:fl, z:g.dist+900+i*130});
    g.talonsOut += left;
  }

  // столкновения
  const px=g.laneF;
  g.items = g.items.filter(o=>{
    const rel=o.z-g.dist;
    if(rel < -60) return false;
    if(rel>2 || rel<-24) return true;
    if(Math.abs(o.lane-px) > 0.55) return true;

    if(o.t==='talon'){ g.talons++; sfxPick(); flash('+1'); return false; }
    const passed = (o.t==='jump' && g.air) || (o.t==='duck' && g.slide>0);
    if(passed) return true;
    // задел
    g.hits++;
    g.shake=13; sfxHit(); haptic(); flash('ОЙ');
    return false;
  });

  // зоны маршрута
  const zone = g.dist<8000 ? 'ПРИЁМНОЕ ОТДЕЛЕНИЕ' : g.dist<17000 ? 'ПОДВАЛ' : 'КОРИДОР К КАБИНЕТУ';
  if(zone!==g.banner){ g.banner=zone; g.bannerT=2.0; }
  if(g.bannerT>0) g.bannerT-=dt;
  if(g.flashT>0) g.flashT-=dt;
  if(g.shake>0) g.shake=Math.max(0, g.shake-dt*38);

  if(g.hits>=3 && !g.over){ g.over=1.4; g.won=false; sfxLose(); }
  if(g.dist>=DIST_TOTAL && !g.over){ g.over=1.4; g.won=true; sfxWin(); }
}
function flash(t){ G.flash=t; G.flashT=0.85; }

/* ── отрисовка ── */
function bgFor(d){
  return d<8000 ? IMG['rf_koridor-priyomnoe']
       : d<17000 ? IMG['rf_koridor-podval']
       : IMG['rf_finish-kabinet'];
}
function laneScreenX(lane, t){        // t: 0 у горизонта, 1 у камеры
  const spread = 0.045 + 0.175*t;    // дорожки укладываются в коридор
  return VW*0.5 + (lane-1)*VW*spread;
}
function draw(){
  const g=G;
  cx.save();
  if(g.shake>0) cx.translate((Math.random()-.5)*g.shake, (Math.random()-.5)*g.shake);

  // фон
  const bg=bgFor(g.dist);
  if(bg && bg.complete && bg.naturalHeight) cx.drawImage(bg,0,0,VW,VH);
  else { cx.fillStyle='#20281c'; cx.fillRect(0,0,VW,VH); }

  // затемнение к горизонту
  const grd=cx.createLinearGradient(0,VH*HORIZON,0,VH);
  grd.addColorStop(0,'rgba(10,12,8,.55)'); grd.addColorStop(1,'rgba(10,12,8,0)');
  cx.fillStyle=grd; cx.fillRect(0,0,VW,VH);

  // предметы — от дальних к ближним
  const list=g.items.slice().sort((a,b)=>b.z-a.z);
  for(const o of list){
    const rel=o.z-g.dist;
    if(rel<-24 || rel>1100) continue;
    const t=Math.pow(1-Math.min(1,rel/1100), 2.1);     // 0 далеко, 1 близко
    if(t<0.012) continue;
    const y=VH*HORIZON + (VH*(1-HORIZON))*t;
    const x=laneScreenX(o.lane, t);
    const im=IMG['r_'+o.img.replace(/_/g,'-')];
    let h=VH*0.34*t*o.h;                                  // рост героя — мера всего
    let ww=(im&&im.naturalHeight) ? h*(im.naturalWidth/im.naturalHeight) : h;
    const laneW=VW*(0.045+0.175*t)*1.05;                  // ширина дорожки на этой глубине
    if(ww>laneW){ const k=laneW/ww; ww*=k; h*=k; }        // не залезаем на соседние
    if(o.t==='talon'){
      cx.save(); cx.globalAlpha=Math.min(1,t*2.4);
      const bob=Math.sin(g.dist*0.03+o.z)*h*0.10;
      cx.shadowColor='rgba(240,200,96,.85)'; cx.shadowBlur=16*t;
      if(im&&im.complete&&im.naturalHeight) cx.drawImage(im, x-ww/2, y-h-bob, ww, h);
      cx.restore();
    } else {
      // тень под предметом
      cx.save(); cx.globalAlpha=Math.min(.5,t);
      cx.fillStyle='rgba(0,0,0,.45)';
      cx.beginPath(); cx.ellipse(x, y, ww*0.42, h*0.10, 0,0,7); cx.fill(); cx.restore();
      if(im&&im.complete&&im.naturalHeight) cx.drawImage(im, x-ww/2, y-h, ww, h);
    }
  }

  // герой
  const hx=laneScreenX(g.laneF, 1), hy=VH*0.955;
  const hh=VH*0.34;
  let hero, hoff=0;
  if(g.slide>0)      hero=IMG['r_danya-podkat'];
  else if(g.air)     hero=IMG['r_danya-pryzhok'];
  else {
    const ph=Math.floor(g.legT)%4;
    hero = [IMG['r_beg-1'], IMG['r_beg-2'], IMG['r_beg-3'], IMG['r_beg-2']][ph];
  }
  const jumpLift = g.air ? Math.max(0, -g.y)*VH*0.55 : 0;
  if(hero && hero.complete && hero.naturalHeight){
    const hw=hh*(hero.naturalWidth/hero.naturalHeight);
    cx.save();
    cx.fillStyle='rgba(0,0,0,.4)';
    cx.beginPath(); cx.ellipse(hx, hy-4, hw*0.34, hh*0.055, 0,0,7); cx.fill();
    cx.drawImage(hero, hx-hw/2, hy-hh-jumpLift-hoff, hw, hh);
    cx.restore();
  }

  // орда сзади
  const orda=IMG['r_orda-babok'];
  if(orda && orda.complete && orda.naturalHeight){
    const k  = 0.44 + 0.42*g.chase;                 // ширина 44..86 процентов экрана
    const ow = VW*k, oh = ow*(orda.naturalHeight/orda.naturalWidth);
    const showH = VH*(0.085 + 0.20*g.chase);        // видно только верхушку, не больше 28 процентов
    cx.save(); cx.globalAlpha=Math.min(1, 0.55+g.chase*0.45);
    cx.drawImage(orda, VW/2-ow/2, VH-showH, ow, oh);
    cx.restore();
  }

  cx.restore();
  drawHUD();
}

function drawHUD(){
  const g=G;
  // полоса дистанции
  const pad=16, bw=VW-pad*2, by=pad+4;
  cx.fillStyle='rgba(6,8,4,.62)'; cx.fillRect(pad-2, by-2, bw+4, 12);
  cx.fillStyle='#2f3a26'; cx.fillRect(pad, by, bw, 8);
  cx.fillStyle='var(--lamp)'; cx.fillStyle='#f0c860';
  cx.fillRect(pad, by, bw*Math.min(1,g.dist/DIST_TOTAL), 8);
  // метка кабинета
  cx.fillStyle='#e4dcc6'; cx.fillRect(pad+bw-3, by-4, 3, 16);

  cx.font='700 11px "Courier New",monospace'; cx.textAlign='left'; cx.fillStyle='#a09786';
  cx.fillText('талоны '+g.talons, pad, by+30);

  // три деления: сколько раз ещё можно зацепиться
  const r=7, gap=9, x0=VW-pad-(r*2*3+gap*2);
  for(let i=0;i<3;i++){
    const cxp=x0+i*(r*2+gap)+r, cyp=by+26;
    cx.beginPath(); cx.arc(cxp, cyp, r, 0, 7);
    cx.fillStyle = i<(3-g.hits) ? '#5aa85a' : 'rgba(176,42,26,.85)';
    cx.fill(); cx.strokeStyle='rgba(6,8,4,.75)'; cx.lineWidth=2; cx.stroke();
  }
  cx.font='700 11px "Courier New",monospace'; cx.textAlign='right'; cx.fillStyle='#8d8778';
  cx.fillText('задел '+g.hits+' из 3', VW-pad, by+48);
  cx.textAlign='left';

  // объявление зоны
  if(g.bannerT>0){
    const a=Math.min(1, g.bannerT*1.6);
    cx.save(); cx.globalAlpha=a;
    cx.font='700 '+Math.round(Math.min(30, VW*0.045))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle='#e4dcc6';
    cx.fillText(g.banner, VW/2, VH*0.20);
    cx.restore(); cx.textAlign='left';
  }
  // всплывашка
  if(g.flashT>0){
    const a=Math.min(1,g.flashT*2.2);
    cx.save(); cx.globalAlpha=a;
    cx.font='700 '+Math.round(Math.min(38, VW*0.06))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle='#f0c860';
    cx.fillText(G.flash, VW/2, VH*0.30);
    cx.restore(); cx.textAlign='left';
  }
  // надпись исхода поверх поля
  if(g.over>0){
    cx.save();
    cx.fillStyle='rgba(6,8,4,.55)'; cx.fillRect(0,0,VW,VH);
    cx.font='700 '+Math.round(Math.min(64, VW*0.10))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle = g.won ? '#f0c860' : '#b02a1a';
    cx.fillText(g.won?'ДОБЕЖАЛ':'ДОГНАЛИ', VW/2, VH*0.5);
    cx.restore(); cx.textAlign='left';
  }
}

function loop(now){
  if(!G) return;
  const dt=Math.min(0.045, (now-G.last)/1000); G.last=now;
  step(dt);
  if(!G) return;                 // забег кончился внутри step — рисовать нечего
  draw();
  requestAnimationFrame(loop);
}

/* ── итог ── */
function finish(){
  const g=G, won=g.won, tal=g.talons; G=null;
  ST.talons = tal; saveST();          // счёт последнего забега, нужен для сцены с талонами
  if(won){ if(onDone) onDone(); }
  else {
    showLose('Догнали', ART['dezhurstvo'],
      'Очередь сомкнулась. Дальше Даня помнит смутно: чей-то платок, чья-то авоська и голос, объясняющий, что он тут не стоял.',
      'Вечернюю смену он встретил с башней уток.', startRun);
  }
}



return {
  start(cb){ onDone=cb; startRun(); },
  stop(){ G=null; },
  skip(){ G=null; if(onDone) onDone(); }
};
})();

/* ══════════ МИССИЯ 2: ОБОРОНА БУХГАЛТЕРИИ ══════════ */
const BUH = (function(){
let onDone=null;
/* ═══════════ ОБОРОНА БУХГАЛТЕРИИ ═══════════ */
let G=null, cv=null, cx=null, VW=0, VH=0;

const WAVES=5;                       // пятая — сюжетная, её не выиграть
const DOOR_MAX=520;
/* размеры в пикселях, как в обороне аэропорта */
const SZ={hero:96, mob:92, taran:132, door:330, duck:30};

/* состав волн */
function waveMix(w){
  if(w===1) return {taran:1, dubina:4, avtomat:0, hpTaran:70};
  if(w===2) return {taran:1, dubina:6, avtomat:0, hpTaran:85};
  if(w===3) return {taran:1, dubina:5, avtomat:3, hpTaran:100};
  if(w===4) return {taran:1, dubina:7, avtomat:5, hpTaran:130};
  return {taran:4, dubina:10, avtomat:6, hpTaran:150};   // пятая
}
const WAVE_NAME=['','ПЕРВАЯ ВОЛНА','ВТОРАЯ ВОЛНА','ТРЕТЬЯ ВОЛНА','ЧЕТВЁРТАЯ ВОЛНА','ИХ СЛИШКОМ МНОГО'];

function fitCanvas(){
  cv=$('#cv'); cx=cv.getContext('2d');
  const r=Math.min(window.devicePixelRatio||1, 2);
  VW=cv.clientWidth; VH=cv.clientHeight;
  cv.width=Math.round(VW*r); cv.height=Math.round(VH*r);
  cx.setTransform(r,0,0,r,0,0);
}
window.addEventListener('resize', ()=>{ if(G) fitCanvas(); });

function startMission(){ startWave(1); }

function startWave(w){
  show('game'); fitCanvas();
  const mix=waveMix(w);
  G={
    wave:w, mix,
    door:{hp:DOOR_MAX, max:DOOR_MAX, flash:0},
    me:{x:VW/2, y:VH*0.80, hp:5, hpMax:5, cd:0, hurt:0, alive:true},
    foes:[], shots:[], ducks:[],
    spawnT:0, endless:(w===WAVES), story:0,
    kills:0, over:0, won:false, last:performance.now(),
    banner:WAVE_NAME[w], bannerT:2.4, flash:'', flashT:0, shake:0
  };
  // выставляем волну
  for(let i=0;i<mix.taran;i++)  spawnFoe('taran');
  for(let i=0;i<mix.dubina;i++) spawnFoe('dubina');
  for(let i=0;i<mix.avtomat;i++)spawnFoe('avtomat');
  requestAnimationFrame(loop);
}

/* входят снизу и с боков — сверху дверь */
function edgePoint(avoidPlayer){
  const m=40;
  for(let t=0;t<20;t++){
    const s=rnd(3);
    let p;
    if(s===0) p={x:m+Math.random()*(VW-2*m), y:VH+m};      // снизу
    else if(s===1) p={x:-m, y:VH*0.35+Math.random()*VH*0.6}; // слева
    else p={x:VW+m, y:VH*0.35+Math.random()*VH*0.6};         // справа
    if(!avoidPlayer || !G.me || Math.hypot(p.x-G.me.x,p.y-G.me.y)>260) return p;
  }
  return {x:VW/2, y:VH+m};
}
function spawnFoe(kind){
  const p=edgePoint(true);
  if(kind==='taran')
    G.foes.push({k:'taran', x:VW*0.5+(Math.random()-0.5)*VW*0.4, y:VH+90,
      hp:G.mix.hpTaran, max:G.mix.hpTaran, spd:58, flash:0, hit:0});
  else if(kind==='dubina')
    G.foes.push({k:'dubina', x:p.x, y:p.y, hp:3, max:3, spd:64+Math.random()*18, flash:0, cd:0});
  else
    G.foes.push({k:'avtomat', x:p.x, y:p.y, hp:4, max:4, spd:46+Math.random()*14, flash:0, cd:0.9});
}

/* ── ввод ── */
const keys={};
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()]=false; });

let stick={on:false,id:-1,bx:0,by:0,dx:0,dy:0};
let aim={on:false,x:0,y:0};
function bindPointer(){
  const el=$('#cv');
  el.addEventListener('pointerdown', e=>{
    if(!G||!G.me.alive) return;
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(x < VW*0.42 && COARSE){ stick={on:true,id:e.pointerId,bx:x,by:y,dx:0,dy:0}; }
    else { aim={on:true,x,y}; throwDuck(x,y); }
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    if(!G) return;
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(stick.on && e.pointerId===stick.id){
      const dx=x-stick.bx, dy=y-stick.by, d=Math.hypot(dx,dy)||1, m=Math.min(1,d/60);
      stick.dx=dx/d*m; stick.dy=dy/d*m;
    } else if(aim.on){ aim.x=x; aim.y=y; }
  });
  const up=e=>{
    if(stick.on && e.pointerId===stick.id) stick={on:false,id:-1,bx:0,by:0,dx:0,dy:0};
    aim.on=false;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
function throwDuck(tx,ty){
  if(!G||!G.me.alive||G.me.cd>0) return;
  const me=G.me, a=Math.atan2(ty-me.y, tx-me.x);
  G.ducks.push({x:me.x, y:me.y-14, px:me.x, py:me.y-14, vx:Math.cos(a)*620, vy:Math.sin(a)*620, r:0, t:0});
  me.cd=0.20; blip(420,.05,'square',.03);
}

/* ── шаг ── */
function step(dt){
  const g=G, me=g.me;
  if(g.over>0){ g.over-=dt; if(g.over<=0) finish(); return; }

  /* движение игрока */
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft'])  mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  if(keys['w']||keys['arrowup'])    my-=1;
  if(keys['s']||keys['arrowdown'])  my+=1;
  if(stick.on){ mx+=stick.dx; my+=stick.dy; }
  const ml=Math.hypot(mx,my);
  if(ml>0.05){ mx/=Math.max(1,ml); my/=Math.max(1,ml);
    me.x=clamp(me.x+mx*240*dt, 26, VW-26);
    me.y=clamp(me.y+my*240*dt, VH*0.26, VH-26); }
  if(me.cd>0) me.cd-=dt;
  if(me.hurt>0) me.hurt-=dt;
  if(aim.on && me.cd<=0) throwDuck(aim.x, aim.y);

  /* пятая волна: подсыпаем без конца */
  if(g.endless){
    g.spawnT-=dt;
    if(g.spawnT<=0 && g.foes.length<40){
      g.spawnT=0.55;
      spawnFoe(Math.random()<0.55?'dubina':'avtomat');
      if(Math.random()<0.14) spawnFoe('taran');
    }
  }

  const doorY=VH*0.115;

  /* противники */
  g.foes.forEach(f=>{
    if(f.hp<=0) return;
    if(f.flash>0) f.flash-=dt;
    if(f.k==='taran'){
      // прёт к двери, на игрока не отвлекается
      if(f.y > doorY+96){ f.y -= f.spd*dt; f.x += Math.sin(f.y*0.01)*8*dt; }
      else { g.door.hp -= 24*dt; g.door.flash=.14; f.hit=.2; g.shake=Math.max(g.shake,5); }
    } else {
      // мобы идут только за игроком
      const dx=me.x-f.x, dy=me.y-f.y, d=Math.hypot(dx,dy)||1;
      if(f.k==='dubina'){
        if(d>22){ f.x+=dx/d*f.spd*dt; f.y+=dy/d*f.spd*dt; }
        else { f.cd-=dt; if(f.cd<=0){ f.cd=1.2; hurtMe(); } }
      } else {
        if(d>230){ f.x+=dx/d*f.spd*dt; f.y+=dy/d*f.spd*dt; }
        else if(d<150){ f.x-=dx/d*f.spd*0.7*dt; f.y-=dy/d*f.spd*0.7*dt; }
        f.cd-=dt;
        if(f.cd<=0){ f.cd=1.25+Math.random()*0.55;
          const a=Math.atan2(dy,dx);
          g.shots.push({x:f.x, y:f.y, px:f.x, py:f.y, vx:Math.cos(a)*260, vy:Math.sin(a)*260}); blip(200,.04,'sawtooth',.02); }
      }
    }
    // не наползают друг на друга
    g.foes.forEach(o=>{
      if(o===f||o.hp<=0) return;
      const dx=o.x-f.x, dy=o.y-f.y, d=Math.hypot(dx,dy);
      const R=(f.k==='taran'||o.k==='taran')?70:34;
      if(d<R && d>0.01){ const p=(R-d)/2/d; f.x-=dx*p; f.y-=dy*p; o.x+=dx*p; o.y+=dy*p; }
    });
    f.x=clamp(f.x,-60,VW+60);
  });

  /* утки летят */
  g.ducks=g.ducks.filter(b=>{
    b.px=b.x; b.py=b.y;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.r+=dt*14; b.t+=dt;
    if(b.x<-40||b.x>VW+40||b.y<-40||b.y>VH+40) return false;
    for(const f of g.foes){
      if(f.hp<=0) continue;
      const R=f.k==='taran'?46:24;
      // проверяем весь путь утки за кадр, иначе на скорости она проскакивает
      if(segDist(b.px,b.py,b.x,b.y, f.x, f.y-(f.k==='taran'?SZ.taran*0.38:SZ.mob*0.42))<R){
        f.hp-=(f.k==='taran'?2:1); f.flash=.14;
        if(f.hp<=0){ g.kills++; blip(160,.12,'square',.04); }
        else blip(560,.04,'square',.025);
        return false;
      }
    }
    return b.t<2.2;
  });

  /* пули по игроку */
  g.shots=g.shots.filter(s=>{
    s.px=s.x; s.py=s.y;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(s.x<-30||s.x>VW+30||s.y<-30||s.y>VH+30) return false;
    if(me.alive && segDist(s.px,s.py,s.x,s.y, me.x, me.y-SZ.hero*0.42)<17){ hurtMe(); return false; }
    return true;
  });

  g.foes=g.foes.filter(f=>f.hp>0);

  /* исход */
  if(g.door.hp<=0 && !g.over){
    g.door.hp=0; g.over=1.3; g.won=false; g.why='door'; sfxLose(); g.shake=18;
  }
  if(!me.alive && !g.over){ g.over=1.3; g.won=false; g.why='me'; sfxLose(); }
  if(!g.endless && !g.foes.length && !g.over){ g.over=1.2; g.won=true; sfxWin(); }
  // пятую волну заканчиваем сами: сюжет
  if(g.endless){
    g.story+=dt;
    if(g.story>26 && !g.over){ g.door.hp=0; g.over=1.4; g.won=false; g.why='door'; sfxLose(); }
  }

  if(g.bannerT>0) g.bannerT-=dt;
  if(g.flashT>0) g.flashT-=dt;
  if(g.door.flash>0) g.door.flash-=dt;
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*34);
}
/* расстояние от точки до отрезка — для честных попаданий на скорости */
function segDist(x1,y1,x2,y2,px,py){
  const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
  let t = L>0 ? ((px-x1)*dx+(py-y1)*dy)/L : 0;
  t = t<0?0:t>1?1:t;
  return Math.hypot(px-(x1+dx*t), py-(y1+dy*t));
}
function hurtMe(){
  const me=G.me;
  if(me.hurt>0||!me.alive) return;
  me.hp--; me.hurt=1.2; G.shake=10; sfxHit(); haptic();
  if(me.hp<=0){ me.alive=false; }
}
function flash(t){ G.flash=t; G.flashT=0.9; }

/* ── отрисовка ── */
function draw(){
  const g=G;
  cx.save();
  if(g.shake>0) cx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);

  const bg=IMG['b_arena'];
  if(bg&&bg.complete&&bg.naturalHeight) cx.drawImage(bg,0,0,VW,VH);
  else { cx.fillStyle='#242c1f'; cx.fillRect(0,0,VW,VH); }
  cx.fillStyle='rgba(8,11,6,.30)'; cx.fillRect(0,0,VW,VH);

  /* дверь наверху */
  const dv=IMG['b_dver'], dw=SZ.door;
  if(dv&&dv.complete&&dv.naturalHeight){
    const dh=dw*(dv.naturalHeight/dv.naturalWidth);
    cx.save();
    if(g.door.flash>0){ cx.globalAlpha=.62; }
    cx.drawImage(dv, VW/2-dw/2, VH*0.115-dh*0.62, dw, dh);
    cx.restore();
    // трещины по мере поломки
    const k=1-g.door.hp/g.door.max;
    if(k>0.02){
      cx.save(); cx.globalAlpha=Math.min(.85,k);
      cx.strokeStyle='#1a1712'; cx.lineWidth=2.4;
      for(let i=0;i<Math.ceil(k*9);i++){
        const sx=VW/2-dw*0.34+((i*97)%(dw*0.68));
        cx.beginPath(); cx.moveTo(sx, VH*0.115-dh*0.42);
        cx.lineTo(sx+((i%2)?18:-16), VH*0.115+dh*0.10);
        cx.lineTo(sx+((i%2)?-8:14), VH*0.115+dh*0.32); cx.stroke();
      }
      cx.restore();
    }
  }
  /* полоска двери */
  const bw=Math.min(VW*0.5,420), bx=VW/2-bw/2, by=14;
  cx.fillStyle='rgba(6,8,4,.8)'; cx.fillRect(bx-2,by-2,bw+4,15);
  cx.fillStyle='#3a2a1a'; cx.fillRect(bx,by,bw,11);
  cx.fillStyle=g.door.hp/g.door.max<.3?'#b02a1a':'#5aa85a';
  cx.fillRect(bx,by,bw*Math.max(0,g.door.hp/g.door.max),11);
  cx.font='700 10px "Courier New",monospace'; cx.textAlign='center'; cx.fillStyle='#e4dcc6';
  cx.fillText('БУХГАЛТЕРИЯ', VW/2, by+21); cx.textAlign='left';

  /* противники — дальние сначала */
  g.foes.slice().sort((a,b)=>a.y-b.y).forEach(f=>{
    const im = f.k==='taran'?IMG['b_taran'] : f.k==='dubina'?IMG['b_dubina'] : IMG['b_avtomat'];
    const h  = f.k==='taran'?SZ.taran : SZ.mob;
    if(!im||!im.complete||!im.naturalHeight) return;
    const w=h*(im.naturalWidth/im.naturalHeight);
    cx.save();
    cx.fillStyle='rgba(0,0,0,.36)';
    cx.beginPath(); cx.ellipse(f.x, f.y+h*0.10, w*0.34, h*0.07, 0,0,7); cx.fill();
    if(f.flash>0) cx.globalAlpha=.55;
    cx.drawImage(im, f.x-w/2, f.y-h*0.90, w, h);
    cx.restore();
    if(f.k==='taran'){
      const tw=72, tx=f.x-tw/2, ty=f.y-h*1.02;
      cx.fillStyle='rgba(6,8,4,.8)'; cx.fillRect(tx-2,ty-2,tw+4,9);
      cx.fillStyle='#3a2a1a'; cx.fillRect(tx,ty,tw,5);
      cx.fillStyle='#e08a3a'; cx.fillRect(tx,ty,tw*(f.hp/f.max),5);
    }
  });

  /* утки и пули */
  const uk=IMG['b_utka'];
  g.ducks.forEach(b=>{
    if(uk&&uk.complete&&uk.naturalHeight){
      const s=SZ.duck, w=s*(uk.naturalWidth/uk.naturalHeight);
      cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r);
      cx.drawImage(uk,-w/2,-s/2,w,s); cx.restore();
    } else { cx.fillStyle='#e8e4d8'; cx.beginPath(); cx.arc(b.x,b.y,7,0,7); cx.fill(); }
  });
  g.shots.forEach(s=>{
    cx.fillStyle='#f0c860';
    cx.beginPath(); cx.arc(s.x,s.y,3.4,0,7); cx.fill();
  });

  /* Даня */
  const me=g.me, dm=IMG['b_danya'];
  if(me.alive && dm && dm.complete && dm.naturalHeight){
    const h=SZ.hero, w=h*(dm.naturalWidth/dm.naturalHeight);
    cx.save();
    if(me.hurt>0) cx.globalAlpha=.45+.4*Math.abs(Math.sin(performance.now()/70));
    cx.fillStyle='rgba(0,0,0,.4)';
    cx.beginPath(); cx.ellipse(me.x, me.y+h*0.06, w*0.42, h*0.07, 0,0,7); cx.fill();
    cx.drawImage(dm, me.x-w/2, me.y-h*0.94, w, h);
    cx.restore();
  }

  cx.restore();
  drawHUD();
}

function drawHUD(){
  const g=G, me=g.me;
  /* сердца */
  const heart=(cxp,cyp,s,fill)=>{
    cx.save(); cx.translate(cxp,cyp); cx.scale(s,s);
    cx.beginPath(); cx.moveTo(0,3.4);
    cx.bezierCurveTo(-5.2,-1.4,-4.4,-6.4,-1.9,-6.4);
    cx.bezierCurveTo(-0.7,-6.4,0,-5.5,0,-4.6);
    cx.bezierCurveTo(0,-5.5,0.7,-6.4,1.9,-6.4);
    cx.bezierCurveTo(4.4,-6.4,5.2,-1.4,0,3.4);
    cx.closePath(); cx.fillStyle=fill; cx.fill();
    cx.strokeStyle='rgba(6,8,4,.8)'; cx.lineWidth=1.1; cx.stroke(); cx.restore();
  };
  for(let i=0;i<me.hpMax;i++)
    heart(24+i*22, 26, 2.0, i<me.hp ? '#c8342a' : 'rgba(180,170,150,.18)');

  cx.font='700 11px "Courier New",monospace'; cx.textAlign='left'; cx.fillStyle='#a09786';
  const left=g.foes.filter(f=>f.hp>0).length;
  cx.fillText(g.endless ? 'их не сосчитать' : ('волна '+g.wave+' из 4   осталось '+left), 16, 50);

  if(g.bannerT>0){
    cx.save(); cx.globalAlpha=Math.min(1,g.bannerT*1.5);
    cx.font='700 '+Math.round(Math.min(34,VW*0.05))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle= g.endless?'#b02a1a':'#e4dcc6';
    cx.fillText(g.banner, VW/2, VH*0.34); cx.restore(); cx.textAlign='left';
  }
  if(g.flashT>0){
    cx.save(); cx.globalAlpha=Math.min(1,g.flashT*2);
    cx.font='700 '+Math.round(Math.min(36,VW*0.055))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle='#f0c860';
    cx.fillText(g.flash, VW/2, VH*0.44); cx.restore(); cx.textAlign='left';
  }
  if(g.over>0){
    cx.save(); cx.fillStyle='rgba(6,8,4,.5)'; cx.fillRect(0,0,VW,VH);
    cx.font='700 '+Math.round(Math.min(58,VW*0.09))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle= g.won?'#f0c860':'#b02a1a';
    cx.fillText(g.won?'ОТБИЛСЯ':'НЕ УДЕРЖАЛ', VW/2, VH*0.5);
    cx.restore(); cx.textAlign='left';
  }
  /* подсказка стика на телефоне */
  if(COARSE && stick.on){
    cx.save(); cx.globalAlpha=.28; cx.strokeStyle='#e4dcc6'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(stick.bx, stick.by, 46, 0, 7); cx.stroke();
    cx.beginPath(); cx.arc(stick.bx+stick.dx*46, stick.by+stick.dy*46, 18, 0, 7); cx.fill();
    cx.restore();
  }
}

function loop(now){
  if(!G) return;
  const dt=Math.min(0.045,(now-G.last)/1000); G.last=now;
  step(dt);
  if(!G) return;
  draw();
  requestAnimationFrame(loop);
}

/* ── исход волны ── */
function finish(){
  const g=G, w=g.wave, won=g.won, why=g.why, kills=g.kills; G=null;
  if(g.endless){ if(onDone) onDone(); return; }
  if(won){
    startWave(w+1);            // волна сменяется без экрана-прокладки
    G.kills = kills;           // счёт уложенных копится через всю миссию
  } else {
    showLose('Не удержал', null,
      why==='door' ? 'Таран прошёл. Дверь сложилась внутрь вместе с косяком.'
                   : 'Даню сбили с ног у самой двери. Дальше держать было некому.',
      'Придётся заново.', ()=>startWave(w));
  }
}


bindPointer();
function fireAuto(){                       // кнопка «огонь»: бьём по ближайшему
  if(!G||!G.me||!G.me.alive) return;
  const me=G.me; let best=null, bd=1e9;
  (G.foes||[]).forEach(f=>{ if(f.hp<=0 && f.hp!==undefined) return;
    const d=Math.hypot(f.x-me.x, f.y-me.y); if(d<bd){ bd=d; best=f; } });
  const tx = best? best.x : me.x+200, ty = best? best.y-10 : me.y-10;
  throwDuck(tx, ty);
}
return {
  start(cb){ onDone=cb; startMission(); },
  stop(){ G=null; },
  skip(){ G=null; if(onDone) onDone(); },
  fire: fireAuto
};
})();

/* ══════════ БОСС: МОСТИК И ПРОЖЕКТОРЫ ══════════ */
const BOSS = (function(){
let onDone=null;
/* ═══════════ БОСС: МОСТИК И ПРОЖЕКТОРЫ ═══════════ */
let G=null, cv=null, cx=null, VW=0, VH=0;

/* размеры в пикселях, как в остальных миссиях */
const SZ={hero:64, babka:66, boss:88, proj:96, ochki:28, mostik:230};

const PROJ_HP = 16;          // ударов по прожектору
const WAVES   = [8, 11, 14]; // бабок в волне перед каждым прожектором

function fitCanvas(){
  cv=$('#cv'); cx=cv.getContext('2d');
  const r=Math.min(window.devicePixelRatio||1, 2);
  VW=cv.clientWidth; VH=cv.clientHeight;
  cv.width=Math.round(VW*r); cv.height=Math.round(VH*r);
  cx.setTransform(r,0,0,r,0,0);
}
addEventListener('resize', ()=>{ if(G) fitCanvas(); });

/* места прожекторов: слева, справа, снизу */
function projSpots(){
  return [
    {x:VW*0.10, y:VH*0.52},
    {x:VW*0.90, y:VH*0.52},
    {x:VW*0.50, y:VH*0.92}
  ];
}

function startBoss(){
  show('game'); fitCanvas();
  G={
    phase:'wave',            // wave → lights → wave → … → jump
    round:0,                 // 0,1,2 — сколько прожекторов уже сломано
    me:{x:VW/2, y:VH*0.62, hp:5, hpMax:5, hurt:0, cd:0, face:1, punch:0, ochki:false, alive:true},
    foes:[], drops:[], beams:[], hits:[], darts:[], slippers:[],
    projs: projSpots().map(p=>({x:p.x, y:p.y, hp:PROJ_HP, max:PROJ_HP, dead:false, on:false, flash:0})),
    boss:{x:VW/2, y:VH*0.085, mood:0},
    spawnLeft:0, spawnT:0, grab:0,
    banner:'ОНИ ИДУТ', bannerT:2.2, flash:'', flashT:0, shake:0,
    over:0, won:false, last:performance.now()
  };
  beginWave();
  requestAnimationFrame(loop);
}

function beginWave(){
  const g=G;
  g.phase='wave';
  g.spawnLeft = WAVES[Math.min(g.round, WAVES.length-1)];
  g.spawnT=0.3;
  g.banner = g.round===0 ? 'ОНИ ИДУТ' : 'СНОВА';
  g.bannerT=1.8;
  g.projs.forEach(p=>p.on=false);
  g.beams.length=0;
}

/* очки падают подальше от игрока, на добег даётся время */
const GRAB_TIME=5.0;
function dropOchki(){
  const g=G, me=g.me;
  let best=null, bd=-1;
  for(let i=0;i<14;i++){
    const p={x:VW*(0.12+Math.random()*0.76), y:VH*(0.32+Math.random()*0.56)};
    const d=Math.hypot(p.x-me.x, p.y-me.y);
    if(d>bd){ bd=d; best=p; }
  }
  g.drops.push({x:best.x, y:best.y, t:0});
  g.grab=GRAB_TIME;
  flash('ОЧКИ! БЕГОМ');
  sfxWin1();
}

function beginLights(){
  const g=G;
  g.phase='lights';
  g.banner='СВЕТИТ';
  g.bannerT=1.8;
  g.boss.mood=1;
  g.projs.forEach(p=>{ if(!p.dead) p.on=true; });
  sfxWin1();
}

/* ── ввод ── */
const keys={};
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(k===' '||k==='enter') punch();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

let stick={on:false,id:-1,bx:0,by:0,dx:0,dy:0};
function bindPointer(){
  const el=$('#cv');
  el.addEventListener('pointerdown', e=>{
    if(!G||!G.me.alive) return;
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(COARSE && x < VW*0.45){ stick={on:true,id:e.pointerId,bx:x,by:y,dx:0,dy:0}; }
    else punch();
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    if(!G||!stick.on||e.pointerId!==stick.id) return;
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    const dx=x-stick.bx, dy=y-stick.by, d=Math.hypot(dx,dy)||1, m=Math.min(1,d/60);
    stick.dx=dx/d*m; stick.dy=dy/d*m;
  });
  const up=e=>{ if(stick.on&&e.pointerId===stick.id) stick={on:false,id:-1,bx:0,by:0,dx:0,dy:0}; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

/* ── удар кулаком ── */
const DART_SPD=560, DART_R=22;
function punch(){                              // теперь это бросок шприца
  const g=G; if(!g||!g.me.alive||g.over>0||g.me.cd>0) return;
  const me=g.me;
  me.cd=0.22; me.punch=0.16;
  blip(420,.05,'square',.03);
  // целимся в ближайшую живую цель, иначе — прямо
  let tx=me.x+me.face*400, ty=me.y-SZ.hero*0.42;
  let best=null, bd=1e9;
  g.foes.forEach(f=>{ if(f.hp<=0) return;
    const d=Math.hypot(f.x-me.x, f.y-me.y); if(d<bd){ bd=d; best={x:f.x, y:f.y-SZ.babka*0.45}; } });
  if(me.ochki) g.projs.forEach(p=>{ if(p.dead||!p.on) return;
    const d=Math.hypot(p.x-me.x, p.y-me.y); if(d<bd){ bd=d; best={x:p.x, y:p.y-SZ.proj*0.4}; } });
  if(best){ tx=best.x; ty=best.y; }
  const a=Math.atan2(ty-(me.y-SZ.hero*0.42), tx-me.x);
  if(Math.cos(a)>0.15) me.face=1; else if(Math.cos(a)<-0.15) me.face=-1;
  g.darts.push({x:me.x, y:me.y-SZ.hero*0.42, vx:Math.cos(a)*DART_SPD, vy:Math.sin(a)*DART_SPD, a, t:0});
}

/* полёт шприцев */
function stepDarts(dt){
  const g=G, me=g.me;
  g.darts=g.darts.filter(d=>{
    d.px=d.x; d.py=d.y;
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.t+=dt;
    if(d.x<-40||d.x>VW+40||d.y<-40||d.y>VH+40||d.t>0.62) return false;   // дальность ограничена
    // бабки
    for(const f of g.foes){
      if(f.hp<=0) continue;
      if(segDist(d.px,d.py,d.x,d.y, f.x, f.y-SZ.babka*0.45) < DART_R){
        f.hp--; f.flash=.15; f.kb=(d.vx>0?1:-1)*180; f.stun=0.35;
        g.hits.push({x:d.x,y:d.y,t:0});
        if(f.hp<=0){
          g.kills=(g.kills||0)+1;
          const left=g.foes.filter(x=>x.hp>0).length;
          if(left===0 && g.spawnLeft===0) dropOchki();
          blip(150,.12,'square',.045);
        } else blip(560,.04,'square',.025);
        return false;
      }
    }
    // прожекторы — только когда светят и очки на глазах
    for(const p of g.projs){
      if(p.dead||!p.on) continue;
      if(!me.ochki) continue;
      if(segDist(d.px,d.py,d.x,d.y, p.x, p.y-SZ.proj*0.4) < DART_R+16){
        p.hp--; p.flash=.14;
        g.hits.push({x:d.x,y:d.y,t:0});
        blip(300,.06,'sawtooth',.035);
        if(p.hp<=0){
          p.dead=true; p.on=false;
          me.ochki=false;
          g.round++;
          g.shake=14; flash('ПРОЖЕКТОР ВСЁ'); sfxWin1();
          if(g.projs.every(x=>x.dead)){ g.phase='jump'; g.over=2.2; g.won=true; sfxWin(); }
          else beginWave();
        }
        return false;
      }
    }
    return true;
  });
}

/* ── шаг ── */
function step(dt){
  const g=G, me=g.me;
  if(g.over>0){ g.over-=dt; if(g.over<=0) finish(); return; }

  /* движение */
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft'])  mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  if(keys['w']||keys['arrowup'])    my-=1;
  if(keys['s']||keys['arrowdown'])  my+=1;
  if(stick.on){ mx+=stick.dx; my+=stick.dy; }
  const ml=Math.hypot(mx,my);
  if(ml>0.05){
    mx/=Math.max(1,ml); my/=Math.max(1,ml);
    if(Math.abs(mx)>0.1) me.face = mx>0?1:-1;
    me.x=clamp(me.x+mx*230*dt, 28, VW-28);
    me.y=clamp(me.y+my*230*dt, VH*0.24, VH-30);
  }
  if(me.cd>0) me.cd-=dt;
  if(me.punch>0) me.punch-=dt;
  if(me.hurt>0) me.hurt-=dt;

  /* волна бабок */
  if(g.phase==='wave'){
    g.spawnT-=dt;
    const naPole = g.foes.filter(f=>f.hp>0).length;
    if(g.spawnLeft>0 && g.spawnT<=0 && naPole<6){     // больше шестерых разом не наваливаются
      g.spawnT=0.5;
      g.spawnLeft--;
      const side=rnd(3);
      const p = side===0 ? {x:-40, y:VH*(0.3+Math.random()*0.6)}
              : side===1 ? {x:VW+40, y:VH*(0.3+Math.random()*0.6)}
                         : {x:VW*(0.15+Math.random()*0.7), y:VH+40};
      const thrower = (g.spawnLeft % 3 === 1);      // каждая третья кидает тапки
      g.foes.push({x:p.x, y:p.y, hp:3, max:3,
        spd: thrower ? 62+Math.random()*14 : 118+Math.random()*28,
        flash:0, cd:0, kb:0, stun:0, thrower, tcd:1.2+Math.random()*1.2});
    }
    // волна кончилась → пошёл отсчёт на добег до очков
    if(g.spawnLeft===0 && !g.foes.some(f=>f.hp>0)){
      if(!g.drops.length && !me.ochki && !g.grab) dropOchki();
      if(g.grab>0){
        g.grab-=dt;
        if(g.grab<=0){ g.grab=0; g.drops.length=0; beginLights(); }   // не успел — свет включается
      }
      if(me.ochki && g.grab>0){ g.grab=0; beginLights(); }
    }
  }

  /* бабки идут к игроку */
  g.foes.forEach(f=>{
    if(f.hp<=0) return;
    if(f.flash>0) f.flash-=dt;
    if(f.kb){ f.x += f.kb*dt; f.kb *= Math.pow(0.02, dt); if(Math.abs(f.kb)<4) f.kb=0; }
    if(f.stun>0){ f.stun-=dt; return; }              // после удара стоит и приходит в себя
    const dx=me.x-f.x, dy=me.y-f.y, d=Math.hypot(dx,dy)||1;
    if(f.thrower){
      // держится на расстоянии броска и швыряет тапком
      const want=300;
      const sp = d>want+40 ? f.spd : (d<want-40 ? -f.spd*0.7 : 0);
      if(sp) { f.x=clamp(f.x+dx/d*sp*dt, 20, VW-20); f.y=clamp(f.y+dy/d*sp*dt, VH*0.20, VH-20); }
      f.tcd-=dt;
      if(f.tcd<=0 && d<430){
        f.tcd=2.1+Math.random()*0.9;
        const a=Math.atan2(dy,dx);
        g.slippers.push({x:f.x, y:f.y-SZ.babka*0.5, vx:Math.cos(a)*300, vy:Math.sin(a)*300, a, t:0, spin:0});
        blip(240,.07,'square',.03);
      }
      return;
    }
    if(d>30){ f.x+=dx/d*f.spd*dt; f.y+=dy/d*f.spd*dt; }
    else { f.cd-=dt; if(f.cd<=0){ f.cd=1.2; hurtMe(); } }
    // не наползают друг на друга
    g.foes.forEach(o=>{
      if(o===f||o.hp<=0) return;
      const ox=o.x-f.x, oy=o.y-f.y, od=Math.hypot(ox,oy);
      if(od<34 && od>0.01){ const p=(34-od)/2/od; f.x-=ox*p; f.y-=oy*p; o.x+=ox*p; o.y+=oy*p; }
    });
  });
  g.foes=g.foes.filter(f=>f.hp>0 || (f.flash>-0.4 && (f.flash-=dt)>-0.4));
  g.foes=g.foes.filter(f=>f.hp>0);

  /* очки на полу */
  g.drops=g.drops.filter(dr=>{
    dr.t+=dt;
    if(Math.hypot(me.x-dr.x, me.y-dr.y) < 34){
      me.ochki=true;
      if(me.hp<me.hpMax){ me.hp++; flash('ОЧКИ НАДЕТЫ  ·  +1'); }   // передышка между кругами
      else flash('ОЧКИ НАДЕТЫ');
      sfxPick();
      return false;
    }
    return true;
  });

  /* прожекторы светят */
  if(g.phase==='lights'){
    g.projs.forEach(p=>{
      if(!p.on) return;
      if(p.flash>0) p.flash-=dt;
      const dx=me.x-p.x, dy=me.y-p.y, d=Math.hypot(dx,dy)||1;
      if(!me.ochki){
        // без очков — смерть
        if(!g.over){ me.alive=false; g.over=1.4; g.won=false; g.why='light'; sfxLose(); }
      } else {
        // с очками луч толкает
        if(d<VW*0.9){
          const push=30*dt*(1 - Math.min(1, d/(VW*0.9)));
          me.x=clamp(me.x+dx/d*push, 28, VW-28);
          me.y=clamp(me.y+dy/d*push, VH*0.24, VH-30);
        }
      }
    });
  }

  stepDarts(dt);
  g.slippers=g.slippers.filter(sl=>{
    sl.px=sl.x; sl.py=sl.y;
    sl.x+=sl.vx*dt; sl.y+=sl.vy*dt; sl.t+=dt; sl.spin+=dt*11;
    if(sl.x<-40||sl.x>VW+40||sl.y<-40||sl.y>VH+40||sl.t>2.4) return false;
    if(segDist(sl.px,sl.py,sl.x,sl.y, me.x, me.y-SZ.hero*0.45) < 26){ hurtMe(); return false; }
    return true;
  });
  g.hits=g.hits.filter(h=>{ h.t+=dt; return h.t<0.22; });
  if(g.bannerT>0) g.bannerT-=dt;
  if(g.flashT>0) g.flashT-=dt;
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*34);
  if(!me.alive && !g.over){ g.over=1.4; g.won=false; g.why='babki'; sfxLose(); }
}

function hurtMe(){
  const me=G.me;
  if(me.hurt>0||!me.alive) return;
  me.hp--; me.hurt=2.0; G.shake=10; sfxHit(); haptic();
  if(me.hp<=0) me.alive=false;
}
function flash(t){ G.flash=t; G.flashT=1.0; }

/* ── отрисовка ── */
function draw(){
  const g=G;
  cx.save();
  if(g.shake>0) cx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);

  const bg=IMG['bs_arena'];
  if(bg&&bg.complete&&bg.naturalHeight) cx.drawImage(bg,0,0,VW,VH);
  else { cx.fillStyle='#2a2f34'; cx.fillRect(0,0,VW,VH); }
  cx.fillStyle='rgba(8,11,14,.34)'; cx.fillRect(0,0,VW,VH);

  /* лучи прожекторов */
  if(g.phase==='lights'){
    g.projs.forEach(p=>{
      if(!p.on) return;
      const grd=cx.createRadialGradient(p.x,p.y,10,p.x,p.y,VW*0.75);
      grd.addColorStop(0,'rgba(255,248,220,.55)');
      grd.addColorStop(0.35,'rgba(255,244,210,.18)');
      grd.addColorStop(1,'rgba(255,240,200,0)');
      cx.fillStyle=grd; cx.fillRect(0,0,VW,VH);
    });
    if(!g.me.ochki){
      cx.fillStyle='rgba(255,255,255,'+(0.5+0.3*Math.sin(performance.now()/70))+')';
      cx.fillRect(0,0,VW,VH);
    }
  }

  /* мостик и главная */
  const mo=IMG['bs_mostik'];
  let deckY=VH*0.10;                                  // где у платформы настил
  if(mo&&mo.complete&&mo.naturalHeight){
    const w=SZ.mostik, h=w*(mo.naturalHeight/mo.naturalWidth);
    const top=VH*0.115;                               // ниже, чтобы фигура целиком влезала
    cx.drawImage(mo, VW/2-w/2, top, w, h);
    deckY = top + h*0.34;                             // линия настила внутри картинки
  }
  const bo=IMG['bs_glavnaya'];
  if(bo&&bo.complete&&bo.naturalHeight){
    const h=SZ.boss, w=h*(bo.naturalWidth/bo.naturalHeight);
    cx.drawImage(bo, VW/2-w/2, deckY-h, w, h);        // ступни ровно на настиле
  }

  /* прожекторы */
  g.projs.forEach(p=>{
    const im = p.dead ? IMG['bs_projektor-slom'] : IMG['bs_projektor'];
    if(!im||!im.complete||!im.naturalHeight) return;
    const h=SZ.proj, w=h*(im.naturalWidth/im.naturalHeight);
    cx.save();
    cx.fillStyle='rgba(0,0,0,.34)';
    cx.beginPath(); cx.ellipse(p.x, p.y+h*0.06, w*0.36, h*0.07, 0,0,7); cx.fill();
    if(p.flash>0) cx.globalAlpha=.55;
    cx.drawImage(im, p.x-w/2, p.y-h*0.92, w, h);
    cx.restore();
    if(!p.dead){
      const bw=64, bx=p.x-bw/2, by=p.y-h*0.98;
      cx.fillStyle='rgba(6,8,4,.8)'; cx.fillRect(bx-2,by-2,bw+4,8);
      cx.fillStyle='#3a2a1a'; cx.fillRect(bx,by,bw,4);
      cx.fillStyle='#e08a3a'; cx.fillRect(bx,by,bw*(p.hp/p.max),4);
    }
  });

  /* очки на полу */
  const ok=IMG['bs_ochki'];
  g.drops.forEach(dr=>{
    if(!ok||!ok.complete||!ok.naturalHeight) return;
    const h=SZ.ochki, w=h*(ok.naturalWidth/ok.naturalHeight);
    const bob=Math.sin(dr.t*4)*4;
    cx.save();
    cx.shadowColor='rgba(240,200,96,.8)'; cx.shadowBlur=16;
    cx.drawImage(ok, dr.x-w/2, dr.y-h/2+bob, w, h);
    cx.restore();
  });

  /* бабки */
  const ba=IMG['bs_babka'];
  g.foes.slice().sort((a,b)=>a.y-b.y).forEach(f=>{
    if(!ba||!ba.complete||!ba.naturalHeight) return;
    const h=SZ.babka, w=h*(ba.naturalWidth/ba.naturalHeight);
    cx.save();
    cx.fillStyle='rgba(0,0,0,.36)';
    cx.beginPath(); cx.ellipse(f.x, f.y+h*0.05, w*0.34, h*0.07, 0,0,7); cx.fill();
    if(f.flash>0) cx.globalAlpha=.5;
    cx.drawImage(ba, f.x-w/2, f.y-h*0.92, w, h);
    if(f.thrower){                                  // метательница помечена
      cx.globalAlpha=1;
      cx.strokeStyle='rgba(240,200,96,.75)'; cx.lineWidth=2;
      cx.beginPath(); cx.ellipse(f.x, f.y+h*0.03, w*0.36, h*0.08, 0,0,7); cx.stroke();
    }
    cx.restore();
  });

  /* Даня */
  const me=g.me, dm=(me.ochki && IMG['bs_danya-ochki'] && IMG['bs_danya-ochki'].naturalWidth)
    ? IMG['bs_danya-ochki'] : IMG['bs_danya'];
  if(me.alive && dm && dm.complete && dm.naturalHeight){
    const h=SZ.hero, w=h*(dm.naturalWidth/dm.naturalHeight);
    cx.save();
    if(me.hurt>0) cx.globalAlpha=.45+.4*Math.abs(Math.sin(performance.now()/70));
    cx.fillStyle='rgba(0,0,0,.4)';
    cx.beginPath(); cx.ellipse(me.x, me.y+h*0.05, w*0.42, h*0.07, 0,0,7); cx.fill();
    cx.translate(me.x, me.y);
    if(me.face<0) cx.scale(-1,1);
    const lean = me.punch>0 ? 8 : 0;
    cx.drawImage(dm, -w/2+lean, -h*0.94, w, h);
    cx.restore();

  }
  /* тапки в полёте */
  const sl0=IMG['bs_tapok'];
  g.slippers.forEach(sl=>{
    if(sl0&&sl0.complete&&sl0.naturalHeight){
      const w=32, hh=w*(sl0.naturalHeight/sl0.naturalWidth);
      cx.save(); cx.translate(sl.x,sl.y); cx.rotate(sl.spin);
      cx.drawImage(sl0,-w/2,-hh/2,w,hh); cx.restore();
    } else { cx.fillStyle='#4a5a7a'; cx.beginPath(); cx.ellipse(sl.x,sl.y,11,6,sl.spin,0,7); cx.fill(); }
  });

  /* шприцы в полёте */
  const sh=IMG['bs_shpric'];
  g.darts.forEach(d=>{
    if(sh&&sh.complete&&sh.naturalHeight){
      const w=34, hh=w*(sh.naturalHeight/sh.naturalWidth);
      cx.save(); cx.translate(d.x,d.y); cx.rotate(d.a);
      cx.drawImage(sh,-w/2,-hh/2,w,hh); cx.restore();
    } else { cx.fillStyle='#e8e1c8'; cx.beginPath(); cx.arc(d.x,d.y,5,0,7); cx.fill(); }
  });
  g.hits.forEach(h=>{
    cx.save(); cx.globalAlpha=1-h.t/0.22;
    cx.strokeStyle='#f0c860'; cx.lineWidth=3;
    cx.beginPath(); cx.arc(h.x, h.y, 8+h.t*60, 0, 7); cx.stroke(); cx.restore();
  });

  cx.restore();
  drawHUD();
}

function drawHUD(){
  const g=G, me=g.me;
  const heart=(cxp,cyp,s,fill)=>{
    cx.save(); cx.translate(cxp,cyp); cx.scale(s,s);
    cx.beginPath(); cx.moveTo(0,3.4);
    cx.bezierCurveTo(-5.2,-1.4,-4.4,-6.4,-1.9,-6.4);
    cx.bezierCurveTo(-0.7,-6.4,0,-5.5,0,-4.6);
    cx.bezierCurveTo(0,-5.5,0.7,-6.4,1.9,-6.4);
    cx.bezierCurveTo(4.4,-6.4,5.2,-1.4,0,3.4);
    cx.closePath(); cx.fillStyle=fill; cx.fill();
    cx.strokeStyle='rgba(6,8,4,.8)'; cx.lineWidth=1.1; cx.stroke(); cx.restore();
  };
  for(let i=0;i<me.hpMax;i++)
    heart(24+i*22, 26, 2.0, i<me.hp ? '#c8342a' : 'rgba(180,170,150,.18)');

  cx.font='700 11px "Courier New",monospace'; cx.textAlign='left'; cx.fillStyle='#a09786';
  const left=g.foes.filter(f=>f.hp>0).length + g.spawnLeft;
  cx.fillText(g.phase==='wave' ? ('бабок осталось '+left) : 'прожекторы', 16, 50);
  if(g.grab>0){
    const k=g.grab/GRAB_TIME;
    const bw=Math.min(VW*0.4,300), bx=VW/2-bw/2, by=VH-38;
    cx.fillStyle='rgba(6,8,4,.75)'; cx.fillRect(bx-2,by-2,bw+4,14);
    cx.fillStyle='#3a2a1a'; cx.fillRect(bx,by,bw,10);
    cx.fillStyle = k<0.35 ? '#b02a1a' : '#f0c860';
    cx.fillRect(bx,by,bw*k,10);
    cx.font='700 11px "Courier New",monospace'; cx.textAlign='center'; cx.fillStyle='#e4dcc6';
    cx.fillText('ДО ОЧКОВ '+g.grab.toFixed(1)+' с', VW/2, by-6); cx.textAlign='left';
  }

  cx.textAlign='right';
  cx.fillStyle = me.ochki ? '#f0c860' : '#8d8778';
  cx.fillText(me.ochki ? 'ОЧКИ НА ГЛАЗАХ' : 'без очков', VW-16, 28);
  cx.fillStyle='#a09786';
  cx.fillText('прожекторов цело '+g.projs.filter(p=>!p.dead).length+' из 3', VW-16, 46);
  cx.textAlign='left';

  if(g.bannerT>0){
    cx.save(); cx.globalAlpha=Math.min(1,g.bannerT*1.5);
    cx.font='700 '+Math.round(Math.min(38,VW*0.055))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle= g.phase==='lights' ? '#f0c860' : '#e4dcc6';
    cx.fillText(g.banner, VW/2, VH*0.30); cx.restore(); cx.textAlign='left';
  }
  if(g.flashT>0){
    cx.save(); cx.globalAlpha=Math.min(1,g.flashT*2);
    cx.font='700 '+Math.round(Math.min(30,VW*0.044))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle='#f0c860';
    cx.fillText(g.flash, VW/2, VH*0.42); cx.restore(); cx.textAlign='left';
  }
  if(g.over>0){
    cx.save(); cx.fillStyle='rgba(6,8,4,.5)'; cx.fillRect(0,0,VW,VH);
    cx.font='700 '+Math.round(Math.min(56,VW*0.085))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle= g.won?'#f0c860':'#b02a1a';
    cx.fillText(g.won?'Н.О. СПРЫГИВАЕТ':'КОНЕЦ', VW/2, VH*0.5);
    cx.restore(); cx.textAlign='left';
  }
  if(COARSE && stick.on){
    cx.save(); cx.globalAlpha=.26; cx.strokeStyle='#e4dcc6'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(stick.bx, stick.by, 44, 0, 7); cx.stroke();
    cx.beginPath(); cx.arc(stick.bx+stick.dx*44, stick.by+stick.dy*44, 17, 0, 7); cx.fill();
    cx.restore();
  }
}

function loop(now){
  if(!G) return;
  const dt=Math.min(0.045,(now-G.last)/1000); G.last=now;
  step(dt);
  if(!G) return;
  draw();
  requestAnimationFrame(loop);
}

/* служебное окно в модуль — для проверки и отладки */
function peek(){
  if(!G) return null;
  return {фаза:G.phase, круг:G.round, сердца:G.me.hp, очки:G.me.ochki,
          бабок:G.foes.filter(f=>f.hp>0).length, вОчереди:G.spawnLeft,
          очкиНаПолу:G.drops.length,
          прожекторы:G.projs.map(p=>p.dead?'сломан':(p.on?'светит:'+p.hp:'ждёт:'+p.hp))};
}
function finish(){
  const g=G, won=g.won, why=g.why; G=null;
  if(won){ if(onDone) onDone(); return; }
  const txt = why==='light'
    ? 'Свет ударил в незащищённые глаза. Дальше Даня не помнит ничего.'
    : 'Его дожали числом. Платки сомкнулись сверху.';
  showLose('Конец', null, txt, 'Придётся заново.', startBoss);
}

bindPointer();
return {
  start(cb){ onDone=cb; startBoss(); },
  stop(){ G=null; },
  skip(){ G=null; if(onDone) onDone(); },
  fire(){ if(typeof punch==='function') punch(); },
  peek, hero(){ return G?G.me:null; }, state(){ return G; }
};
})();

/* ══════════ БОСС, ЧАСТЬ ВТОРАЯ ══════════ */
const BOSS2 = (function(){
let onDone=null;
/* ═══════════ БОСС, ЧАСТЬ ВТОРАЯ: САМА ═══════════ */
let G2=null, cv2=null, cx2=null, W2=0, H2=0;

const SZ2={hero:64, babka:66, boss:104, book:96};   // очки сгорели вместе с прожекторами
const BOSS_HP=115;

function fit2(){
  cv2=$('#cv'); cx2=cv2.getContext('2d');
  const r=Math.min(window.devicePixelRatio||1, 2);
  W2=cv2.clientWidth; H2=cv2.clientHeight;
  cv2.width=Math.round(W2*r); cv2.height=Math.round(H2*r);
  cx2.setTransform(r,0,0,r,0,0);
}
addEventListener('resize', ()=>{ if(G2) fit2(); });

function startBoss2(){
  show('game'); fit2();
  G2={
    me:{x:W2*0.30, y:H2*0.66, hp:5, hpMax:5, hurt:0, cd:0, face:1, punch:0, alive:true},
    boss:{x:W2*0.70, y:H2*0.42, hp:BOSS_HP, max:BOSS_HP,
          state:'idle', t:0, cd:2.0, flash:0, open:0,   // open — окно уязвимости
          dx:0, dy:0, phase:1},
    foes:[], waves:[], hits:[], darts:[], blind:0,
    banner:'Н.О. СПРЫГНУЛА', bannerT:2.4, flash:'', flashT:0, shake:0,
    over:0, won:false, last:performance.now()
  };
  requestAnimationFrame(loop2);
}

/* ── ввод ── */
const keys2={};
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  keys2[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(k===' '||k==='enter') punch2();
});
addEventListener('keyup', e=>{ keys2[e.key.toLowerCase()]=false; });

let stick2={on:false,id:-1,bx:0,by:0,dx:0,dy:0};
function bind2(){
  const el=$('#cv');
  el.addEventListener('pointerdown', e=>{
    if(!G2||!G2.me.alive) return;
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(COARSE && x < W2*0.45){ stick2={on:true,id:e.pointerId,bx:x,by:y,dx:0,dy:0}; }
    else punch2();
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    if(!G2||!stick2.on||e.pointerId!==stick2.id) return;
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    const dx=x-stick2.bx, dy=y-stick2.by, d=Math.hypot(dx,dy)||1, m=Math.min(1,d/60);
    stick2.dx=dx/d*m; stick2.dy=dy/d*m;
  });
  const up=e=>{ if(stick2.on&&e.pointerId===stick2.id) stick2={on:false,id:-1,bx:0,by:0,dx:0,dy:0}; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

const DART_SPD2=560, DART_R2=22;
function punch2(){                             // бросок шприца
  const g=G2; if(!g||!g.me.alive||g.over>0||g.me.cd>0) return;
  const me=g.me, bs=g.boss;
  me.cd=0.22; me.punch=0.16;
  blip(420,.05,'square',.03);
  // целимся в ближайшую бабку, иначе — в неё
  let tx=bs.x, ty=bs.y-SZ2.boss*0.45, bd=Math.hypot(bs.x-me.x, bs.y-me.y);
  g.foes.forEach(f=>{ if(f.hp<=0) return;
    const d=Math.hypot(f.x-me.x,f.y-me.y);
    if(d<bd*0.8){ bd=d; tx=f.x; ty=f.y-SZ2.babka*0.45; } });
  const a=Math.atan2(ty-(me.y-SZ2.hero*0.42), tx-me.x);
  if(Math.cos(a)>0.15) me.face=1; else if(Math.cos(a)<-0.15) me.face=-1;
  g.darts.push({x:me.x, y:me.y-SZ2.hero*0.42, vx:Math.cos(a)*DART_SPD2, vy:Math.sin(a)*DART_SPD2, a, t:0});
}

function stepDarts2(dt){
  const g=G2, me=g.me, bs=g.boss;
  g.darts=g.darts.filter(d=>{
    d.px=d.x; d.py=d.y;
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.t+=dt;
    if(d.x<-40||d.x>W2+40||d.y<-40||d.y>H2+40||d.t>2.2) return false;
    for(const f of g.foes){
      if(f.hp<=0) continue;
      if(segDist(d.px,d.py,d.x,d.y, f.x, f.y-SZ2.babka*0.45) < DART_R2){
        f.hp--; f.flash=.15; f.kb=(d.vx>0?1:-1)*180; f.stun=0.35;
        g.hits.push({x:d.x,y:d.y,t:0});
        blip(f.hp<=0?150:560,.08,'square',.035);
        return false;
      }
    }
    if(segDist(d.px,d.py,d.x,d.y, bs.x, bs.y-SZ2.boss*0.45) < DART_R2+18){
      if(bs.open>0){
        bs.hp-=4; bs.flash=.14; g.shake=6;
        g.hits.push({x:d.x,y:d.y,t:0});
        blip(520,.08,'triangle',.05);
        if(bs.hp<=0 && !g.over){ bs.hp=0; g.over=2.0; g.won=true; sfxWin(); }
      } else {
        bs.flash=.10; blip(120,.10,'sawtooth',.03);
        g.hits.push({x:d.x,y:d.y,t:0,miss:true});
      }
      return false;
    }
    return true;
  });
}

/* ── приёмы ── */
function bossPick(){
  const g=G2, bs=g.boss;
  const ph=bs.phase;
  const pool = ph===1 ? ['rush','book']
             : ph===2 ? ['rush','book','call','rush']
                      : ['rush','book','call','rush','book'];
  const move = pool[rnd(pool.length)];
  if(move==='call' && g.foes.filter(f=>f.hp>0).length>=3) return bossPick();
  bs.state=move; bs.t=0;
  if(move==='rush'){
    const dx=g.me.x-bs.x, dy=g.me.y-bs.y, d=Math.hypot(dx,dy)||1;
    bs.dx=dx/d; bs.dy=dy/d;
    flash2('РАЗБЕГ');
  }
  if(move==='book')  flash2('УЧЕБНИК');
  if(move==='call')  flash2('ЗОВЁТ ПОДРУГ');

}

function step2(dt){
  const g=G2, me=g.me, bs=g.boss;
  if(g.over>0){ g.over-=dt; if(g.over<=0) finish2(); return; }

  /* фаза по здоровью */
  const frac=bs.hp/bs.max;
  bs.phase = frac>0.66 ? 1 : frac>0.33 ? 2 : 3;

  /* движение игрока */
  let mx=0,my=0;
  if(keys2['a']||keys2['arrowleft'])  mx-=1;
  if(keys2['d']||keys2['arrowright']) mx+=1;
  if(keys2['w']||keys2['arrowup'])    my-=1;
  if(keys2['s']||keys2['arrowdown'])  my+=1;
  if(stick2.on){ mx+=stick2.dx; my+=stick2.dy; }
  const ml=Math.hypot(mx,my);
  if(ml>0.05){
    mx/=Math.max(1,ml); my/=Math.max(1,ml);
    if(Math.abs(mx)>0.1) me.face = mx>0?1:-1;
    me.x=clamp(me.x+mx*230*dt, 28, W2-28);
    me.y=clamp(me.y+my*230*dt, H2*0.20, H2-30);
  }
  if(me.cd>0) me.cd-=dt;
  if(me.punch>0) me.punch-=dt;
  if(me.hurt>0) me.hurt-=dt;
  if(g.blind>0) g.blind-=dt;

  /* поведение босса */
  bs.t+=dt;
  if(bs.flash>0) bs.flash-=dt;
  if(bs.open>0) bs.open-=dt;

  if(bs.state==='idle'){
    // держится на расстоянии, покачиваясь
    const dx=me.x-bs.x, dy=me.y-bs.y, d=Math.hypot(dx,dy)||1;
    const want = 210;
    const sp = d>want ? 62 : -46;
    bs.x=clamp(bs.x+dx/d*sp*dt, 40, W2-40);
    bs.y=clamp(bs.y+dy/d*sp*dt, H2*0.18, H2-40);
    bs.cd-=dt;
    if(bs.cd<=0){ bossPick(); bs.cd = (bs.phase===3?1.5:bs.phase===2?1.9:2.4); }
  }
  else if(bs.state==='rush'){
    if(bs.t<0.55){
      // замах: чуть отходит назад
      bs.x=clamp(bs.x-bs.dx*70*dt, 40, W2-40);
      bs.y=clamp(bs.y-bs.dy*70*dt, H2*0.18, H2-40);
    } else if(bs.t<1.65){
      const sp=520;
      bs.x=clamp(bs.x+bs.dx*sp*dt, 40, W2-40);
      bs.y=clamp(bs.y+bs.dy*sp*dt, H2*0.18, H2-40);
      if(Math.hypot(bs.x-me.x, bs.y-me.y) < 52) hurtMe2();
      if(bs.x<=41||bs.x>=W2-41||bs.y<=H2*0.18+1||bs.y>=H2-41){ bs.t=1.65; g.shake=14; }
    } else {
      // пробуксовка — открыта
      if(bs.open<=0){ bs.open=1.7; }
      if(bs.t>1.65+1.7){ bs.state='idle'; bs.t=0; }
    }
  }
  else if(bs.state==='book'){
    if(bs.t>0.7 && bs.t<0.86){
      // ударная волна по дуге
      const dx=me.x-bs.x, dy=me.y-bs.y, d=Math.hypot(dx,dy);
      if(d<230){
        const a=Math.atan2(dy,dx), face=Math.atan2(me.y-bs.y, me.x-bs.x);
        hurtMe2();
        me.x=clamp(me.x+Math.cos(a)*90, 28, W2-28);
        me.y=clamp(me.y+Math.sin(a)*90, H2*0.20, H2-30);
      }
      g.shake=Math.max(g.shake,10);
    }
    if(bs.t>1.0 && bs.open<=0){ bs.open=1.2; }
    if(bs.t>2.6){ bs.state='idle'; bs.t=0; }
  }
  else if(bs.state==='call'){
    if(bs.t>0.5 && !bs.called){
      bs.called=true;
      const n=bs.phase===3?3:2;
      for(let i=0;i<n;i++){
        const side=rnd(3);
        const p = side===0 ? {x:-40, y:H2*(0.3+Math.random()*0.6)}
                : side===1 ? {x:W2+40, y:H2*(0.3+Math.random()*0.6)}
                           : {x:W2*(0.15+Math.random()*0.7), y:H2+40};
        g.foes.push({x:p.x,y:p.y,hp:2,max:2,spd:56+Math.random()*16,flash:0,cd:0,kb:0,stun:0});
      }
      sfxHit();
    }
    if(bs.t>1.4){ bs.state='idle'; bs.t=0; bs.called=false; }
  }


  /* бабки */
  g.foes.forEach(f=>{
    if(f.hp<=0) return;
    if(f.flash>0) f.flash-=dt;
    if(f.kb){ f.x+=f.kb*dt; f.kb*=Math.pow(0.02,dt); if(Math.abs(f.kb)<4) f.kb=0; }
    if(f.stun>0){ f.stun-=dt; return; }
    const dx=me.x-f.x, dy=me.y-f.y, d=Math.hypot(dx,dy)||1;
    if(d>30){ f.x+=dx/d*f.spd*dt; f.y+=dy/d*f.spd*dt; }
    else { f.cd-=dt; if(f.cd<=0){ f.cd=1.6; hurtMe2(); } }
    g.foes.forEach(o=>{
      if(o===f||o.hp<=0) return;
      const ox=o.x-f.x, oy=o.y-f.y, od=Math.hypot(ox,oy);
      if(od<34&&od>0.01){ const pp=(34-od)/2/od; f.x-=ox*pp; f.y-=oy*pp; o.x+=ox*pp; o.y+=oy*pp; }
    });
  });
  g.foes=g.foes.filter(f=>f.hp>0);

  stepDarts2(dt);
  g.hits=g.hits.filter(h=>{ h.t+=dt; return h.t<0.22; });
  if(g.bannerT>0) g.bannerT-=dt;
  if(g.flashT>0) g.flashT-=dt;
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*34);
  if(!me.alive && !g.over){ g.over=1.4; g.won=false; sfxLose(); }
}

function hurtMe2(){
  const me=G2.me;
  if(me.hurt>0||!me.alive) return;
  me.hp--; me.hurt=2.0; G2.shake=12; sfxHit(); haptic();
  if(me.hp<=0) me.alive=false;
}
function flash2(t){ G2.flash=t; G2.flashT=1.0; }

/* ── отрисовка ── */
function draw2(){
  const g=G2, me=g.me, bs=g.boss;
  cx2.save();
  if(g.shake>0) cx2.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);

  const bg=IMG['bs_arena'];
  if(bg&&bg.complete&&bg.naturalHeight) cx2.drawImage(bg,0,0,W2,H2);
  else { cx2.fillStyle='#242c1f'; cx2.fillRect(0,0,W2,H2); }
  cx2.fillStyle='rgba(8,11,14,.36)'; cx2.fillRect(0,0,W2,H2);

  /* сломанные прожекторы по краям — след первой части */
  const pr=IMG['bs_projektor-slom'];
  if(pr&&pr.complete&&pr.naturalHeight){
    [[W2*0.10,H2*0.52],[W2*0.90,H2*0.52],[W2*0.50,H2*0.94]].forEach(p=>{
      const h=86, w=h*(pr.naturalWidth/pr.naturalHeight);
      cx2.save(); cx2.globalAlpha=.75;
      cx2.drawImage(pr, p[0]-w/2, p[1]-h*0.9, w, h); cx2.restore();
    });
  }

  /* бабки */
  const ba=IMG['bs_babka'];
  g.foes.slice().sort((a,b)=>a.y-b.y).forEach(f=>{
    if(!ba||!ba.complete||!ba.naturalHeight) return;
    const h=SZ2.babka, w=h*(ba.naturalWidth/ba.naturalHeight);
    cx2.save();
    cx2.fillStyle='rgba(0,0,0,.36)';
    cx2.beginPath(); cx2.ellipse(f.x, f.y+h*0.05, w*0.34, h*0.07, 0,0,7); cx2.fill();
    if(f.flash>0) cx2.globalAlpha=.5;
    cx2.drawImage(ba, f.x-w/2, f.y-h*0.92, w, h);
    cx2.restore();
  });

  /* она */
  let im = IMG['bs_glavnaya-boy'];
  if(bs.state==='rush' && bs.t>0.55) im=IMG['bs_glavnaya-ryvok']||im;
  if(bs.state==='book') im=IMG['bs_glavnaya-kniga']||im;
  if(im&&im.complete&&im.naturalHeight){
    const h=SZ2.boss, w=h*(im.naturalWidth/im.naturalHeight);
    cx2.save();
    cx2.fillStyle='rgba(0,0,0,.4)';
    cx2.beginPath(); cx2.ellipse(bs.x, bs.y+h*0.05, w*0.4, h*0.07, 0,0,7); cx2.fill();
    if(bs.flash>0) cx2.globalAlpha=.55;
    if(bs.open>0){
      cx2.shadowColor='rgba(240,200,96,.9)'; cx2.shadowBlur=22;
    }
    const flip = (me.x < bs.x);
    cx2.translate(bs.x, bs.y);
    if(flip) cx2.scale(-1,1);
    cx2.drawImage(im, -w/2, -h*0.94, w, h);
    cx2.restore();
  }

  /* волна от учебника */
  if(bs.state==='book' && bs.t>0.62 && bs.t<1.0){
    const k=(bs.t-0.62)/0.38;
    cx2.save(); cx2.globalAlpha=(1-k)*0.8;
    cx2.strokeStyle='#f0c860'; cx2.lineWidth=5;
    cx2.beginPath(); cx2.arc(bs.x, bs.y-SZ2.boss*0.4, 40+k*200, 0, 7); cx2.stroke();
    cx2.restore();
  }

  /* Даня */
  const dm=IMG['bs_danya'];
  if(me.alive && dm && dm.complete && dm.naturalHeight){
    const h=SZ2.hero, w=h*(dm.naturalWidth/dm.naturalHeight);
    cx2.save();
    if(me.hurt>0) cx2.globalAlpha=.45+.4*Math.abs(Math.sin(performance.now()/70));
    cx2.fillStyle='rgba(0,0,0,.4)';
    cx2.beginPath(); cx2.ellipse(me.x, me.y+h*0.05, w*0.42, h*0.07, 0,0,7); cx2.fill();
    cx2.translate(me.x, me.y);
    if(me.face<0) cx2.scale(-1,1);
    cx2.drawImage(dm, -w/2+(me.punch>0?8:0), -h*0.94, w, h);
    cx2.restore();

  }
  const sh2=IMG['bs_shpric'];
  g.darts.forEach(d=>{
    if(sh2&&sh2.complete&&sh2.naturalHeight){
      const w=34, hh=w*(sh2.naturalHeight/sh2.naturalWidth);
      cx2.save(); cx2.translate(d.x,d.y); cx2.rotate(d.a);
      cx2.drawImage(sh2,-w/2,-hh/2,w,hh); cx2.restore();
    } else { cx2.fillStyle='#e8e1c8'; cx2.beginPath(); cx2.arc(d.x,d.y,5,0,7); cx2.fill(); }
  });
  g.hits.forEach(h=>{
    cx2.save(); cx2.globalAlpha=1-h.t/0.22;
    cx2.strokeStyle=h.miss?'#8d8778':'#f0c860'; cx2.lineWidth=3;
    cx2.beginPath(); cx2.arc(h.x,h.y,8+h.t*60,0,7); cx2.stroke(); cx2.restore();
  });

  cx2.restore();

  /* ослепление */
  if(g.blind>0){
    cx2.fillStyle='rgba(255,255,255,'+Math.min(0.92, g.blind/1.4)+')';
    cx2.fillRect(0,0,W2,H2);
  }
  drawHUD2();
}

function drawHUD2(){
  const g=G2, me=g.me, bs=g.boss;
  const heart=(cxp,cyp,s,fill)=>{
    cx2.save(); cx2.translate(cxp,cyp); cx2.scale(s,s);
    cx2.beginPath(); cx2.moveTo(0,3.4);
    cx2.bezierCurveTo(-5.2,-1.4,-4.4,-6.4,-1.9,-6.4);
    cx2.bezierCurveTo(-0.7,-6.4,0,-5.5,0,-4.6);
    cx2.bezierCurveTo(0,-5.5,0.7,-6.4,1.9,-6.4);
    cx2.bezierCurveTo(4.4,-6.4,5.2,-1.4,0,3.4);
    cx2.closePath(); cx2.fillStyle=fill; cx2.fill();
    cx2.strokeStyle='rgba(6,8,4,.8)'; cx2.lineWidth=1.1; cx2.stroke(); cx2.restore();
  };
  for(let i=0;i<me.hpMax;i++)
    heart(24+i*22, 26, 2.0, i<me.hp ? '#c8342a' : 'rgba(180,170,150,.18)');

  /* полоска босса */
  const bw=Math.min(W2*0.56,460), bx=W2/2-bw/2, by=16;
  cx2.fillStyle='rgba(6,8,4,.78)'; cx2.fillRect(bx-2,by-2,bw+4,17);
  cx2.fillStyle='#3a2a1a'; cx2.fillRect(bx,by,bw,13);
  cx2.fillStyle = bs.phase===3 ? '#b02a1a' : bs.phase===2 ? '#d08a2a' : '#8a4a9a';
  cx2.fillRect(bx,by,bw*Math.max(0,bs.hp/bs.max),13);
  cx2.font='700 10px "Courier New",monospace'; cx2.textAlign='center'; cx2.fillStyle='#e4dcc6';
  cx2.fillText('Н.О.', W2/2, by+24); cx2.textAlign='left';



  if(g.bannerT>0){
    cx2.save(); cx2.globalAlpha=Math.min(1,g.bannerT*1.5);
    cx2.font='700 '+Math.round(Math.min(36,W2*0.052))+'px Arial Black, Arial, sans-serif';
    cx2.textAlign='center'; cx2.fillStyle='#e4dcc6';
    cx2.fillText(g.banner, W2/2, H2*0.32); cx2.restore(); cx2.textAlign='left';
  }
  if(g.flashT>0){
    cx2.save(); cx2.globalAlpha=Math.min(1,g.flashT*2);
    cx2.font='700 '+Math.round(Math.min(28,W2*0.04))+'px Arial Black, Arial, sans-serif';
    cx2.textAlign='center'; cx2.fillStyle='#f0c860';
    cx2.fillText(g.flash, W2/2, H2*0.44); cx2.restore(); cx2.textAlign='left';
  }
  if(g.over>0){
    cx2.save(); cx2.fillStyle='rgba(6,8,4,.5)'; cx2.fillRect(0,0,W2,H2);
    cx2.font='700 '+Math.round(Math.min(64,W2*0.095))+'px Arial Black, Arial, sans-serif';
    cx2.textAlign='center'; cx2.fillStyle= g.won?'#f0c860':'#b02a1a';
    cx2.fillText(g.won?'ПОБЕДА':'КОНЕЦ', W2/2, H2*0.5);
    cx2.restore(); cx2.textAlign='left';
  }
  if(COARSE && stick2.on){
    cx2.save(); cx2.globalAlpha=.26; cx2.strokeStyle='#e4dcc6'; cx2.lineWidth=2;
    cx2.beginPath(); cx2.arc(stick2.bx, stick2.by, 44, 0, 7); cx2.stroke();
    cx2.beginPath(); cx2.arc(stick2.bx+stick2.dx*44, stick2.by+stick2.dy*44, 17, 0, 7); cx2.fill();
    cx2.restore();
  }
}

function loop2(now){
  if(!G2) return;
  const dt=Math.min(0.045,(now-G2.last)/1000); G2.last=now;
  step2(dt);
  if(!G2) return;
  draw2();
  requestAnimationFrame(loop2);
}

function peek2(){
  if(!G2) return null;
  return {сердца:G2.me.hp, боссHP:Math.round(G2.boss.hp), фаза:G2.boss.phase,
          приём:G2.boss.state, открыта:+(G2.boss.open>0), бабок:G2.foes.length,
          слепит:+(G2.blind>0)};
}

function finish2(){
  const g=G2, won=g.won; G2=null;
  if(won){ if(onDone) onDone(); return; }
  showLose('Конец', null,
    'Она оказалась быстрее, чем выглядела.',
    'Придётся заново.', startBoss2);
}

bind2();
return {
  start(cb){ onDone=cb; startBoss2(); },
  stop(){ G2=null; },
  skip(){ G2=null; if(onDone) onDone(); },
  fire(){ if(typeof punch2==='function') punch2(); },
  peek:peek2, state(){ return G2; }
};
})();

/* ══════════ МИССИЯ 3: ПОГОНЯ ══════════ */
const POG = (function(){
let onDone=null;
/* ═══════════ ПОГОНЯ: БАБКИ КАК БОМБЫ ═══════════ */
let G=null, cv=null, cx=null, VW=0, VH=0;

const HOLD=50;                       // сколько секунд надо продержаться
const SZ0={heli:156, car:78, babka:56, boom:96};  // машина ~1.9 м, вертолёт длиннее её в 2.5 раза
let SZ={...SZ0};                                  // на узком экране всё ужимается пропорционально
function scaleSZ(){
  const k=Math.max(0.44, Math.min(1, VW/1050));
  SZ={heli:SZ0.heli*k, car:SZ0.car*k, babka:SZ0.babka*k, boom:SZ0.boom*k};
}
const CRIES=['НОСАТЫЙ ДОКТОР ПЕДИК','ПОШЁЛ ТЫ','МОЛОДОЙ ЗАСРАНЕЦ','БЛЯЯЯ'];

function roadY(){ return VH*0.80; }   // линия шоссе

function fitCanvas(){
  cv=$('#cv'); cx=cv.getContext('2d');
  const r=Math.min(window.devicePixelRatio||1, 2);
  VW=cv.clientWidth; VH=cv.clientHeight;
  cv.width=Math.round(VW*r); cv.height=Math.round(VH*r);
  cx.setTransform(r,0,0,r,0,0);
  scaleSZ();
}
window.addEventListener('resize', ()=>{ if(G) fitCanvas(); });

function startRun(){
  show('game'); fitCanvas();
  G={
    t:0, scroll:0,
    heli:{x:VW*0.70, y:VH*0.30, vy:0, hp:135, max:135, hurt:0},
    cars:[], bombs:[], booms:[], shots:[], cries:[],
    reload:0, spawnT:1.2,
    kills:0, drops:0, over:0, won:false, shake:0, last:performance.now(),
    banner:'ДЕРЖИСЬ', bannerT:2.0
  };
  spawnCar(); 
  requestAnimationFrame(loop);
}

function spawnCar(){
  const g=G;
  g.cars.push({
    x: -140 - Math.random()*220,          // подъезжают слева, догоняют
    spd: 96 + Math.random()*46,
    hp: 1, cd: 1.2+Math.random()*1.2, flash:0
  });
}

/* ── ввод ── */
const keys={};
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(k===' '||k==='enter') drop();
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

let stick={on:false,id:-1,bx:0,by:0,dx:0,dy:0};
function bindPointer(){
  const el=$('#cv');
  el.addEventListener('pointerdown', e=>{
    if(!G) return;
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(x < VW*0.45){ stick={on:true,id:e.pointerId,bx:x,by:y,dx:0,dy:0}; }
    else drop();
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    if(!G||!stick.on||e.pointerId!==stick.id) return;
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    const dx=x-stick.bx, dy=y-stick.by, d=Math.hypot(dx,dy)||1, m=Math.min(1,d/70);
    stick.dx=dx/d*m; stick.dy=dy/d*m;
  });
  const up=e=>{ if(stick.on&&e.pointerId===stick.id) stick={on:false,id:-1,bx:0,by:0,dx:0,dy:0}; };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

function drop(){
  if(!G || G.over>0 || G.reload>0) return;
  const h=G.heli;
  G.bombs.push({x:h.x-SZ.heli*0.10, y:h.y+SZ.heli*0.14, vy:0, r:0, t:0});
  G.drops++;                                   // считаем сброшенных, а не попадания
  G.reload=1.6;
  G.cries.push({txt:CRIES[Math.floor(Math.random()*CRIES.length)], x:h.x, y:h.y+40, t:0});
  blip(300,.12,'sawtooth',.04);
}

/* ── шаг ── */
function step(dt){
  const g=G, h=g.heli;
  if(g.over>0){ g.over-=dt; if(g.over<=0) finish(); return; }

  g.t+=dt;
  g.scroll+=190*dt;

  /* вертолёт: вверх-вниз и вперёд-назад */
  let my=0, mx=0;
  if(keys['w']||keys['arrowup'])    my-=1;
  if(keys['s']||keys['arrowdown'])  my+=1;
  if(keys['a']||keys['arrowleft'])  mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  if(stick.on){ my+=stick.dy; mx+=stick.dx; }
  const ml=Math.hypot(mx,my);
  if(ml>1){ mx/=ml; my/=ml; }
  h.y=clamp(h.y+my*190*dt, VH*0.12, VH*0.52);
  h.x=clamp(h.x+mx*230*dt, VW*0.16, VW*0.86);
  h.bob = Math.sin(g.t*1.1)*10;              // лёгкое покачивание, только для картинки
  h.tilt = (h.tilt||0) + (mx*0.13 - (h.tilt||0))*Math.min(1, dt*7);
  if(h.hurt>0) h.hurt-=dt;
  if(g.reload>0) g.reload-=dt;

  /* машины */
  const need = 1 + Math.floor(g.t/11);        // со временем их больше
  g.spawnT-=dt;
  if(g.spawnT<=0 && g.cars.length<need+1){ g.spawnT=2.4; spawnCar(); }

  g.cars.forEach(c=>{
    if(c.hp<=0) return;
    c.x += c.spd*dt;
    if(c.flash>0) c.flash-=dt;
    // подтягиваются к вертолёту и держатся под ним
    const want=VW*0.62;
    if(c.x>want) c.x -= (c.x-want)*0.55*dt;
    // стреляют
    c.cd-=dt;
    if(c.cd<=0 && c.x>60){
      c.cd = 1.6+Math.random()*1.1;
      const a=Math.atan2((h.y+16)-(roadY()-30), h.x-c.x) + (Math.random()-0.5)*0.22;
      g.shots.push({x:c.x, y:roadY()-30, px:c.x, py:roadY()-30,
        vx:Math.cos(a)*300, vy:Math.sin(a)*300});
      blip(210,.05,'sawtooth',.02);
    }
  });
  g.cars=g.cars.filter(c=>c.hp>0 && c.x<VW+260);

  /* бабки летят вниз */
  g.bombs=g.bombs.filter(b=>{
    b.vy += 620*dt;                    // разгоняются
    b.y  += b.vy*dt;
    b.x  += 40*dt;                     // сносит вперёд
    b.r  += dt*2.6; b.t+=dt;
    if(b.y >= roadY()-26){
      // взрыв на дороге
      g.booms.push({x:b.x, y:roadY()-30, t:0});
      g.shake=Math.max(g.shake,9); blip(90,.28,'sawtooth',.07); haptic();
      let got=0;
      g.cars.forEach(c=>{
        if(c.hp>0 && Math.abs(c.x-b.x)<SZ.boom*0.72){ c.hp=0; got++; }
      });
      if(got){ g.kills+=got; flash(got>1?('ДВЕ РАЗОМ'):'ПОПАЛ'); sfxWin1(); }
      return false;
    }
    return true;
  });

  /* пули по вертолёту */
  g.shots=g.shots.filter(s=>{
    s.px=s.x; s.py=s.y;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(s.x<-40||s.x>VW+40||s.y<-40||s.y>VH+40) return false;
    if(segDist(s.px,s.py,s.x,s.y, h.x, h.y+10) < 34){
      if(h.hurt<=0){ h.hp-=6; h.hurt=0.6; g.shake=Math.max(g.shake,7); sfxHit(); }
      return false;
    }
    return true;
  });

  g.booms=g.booms.filter(b=>{ b.t+=dt; return b.t<0.55; });
  g.cries=g.cries.filter(c=>{ c.t+=dt; c.y+=34*dt; return c.t<1.5; });

  if(h.hp<=0 && !g.over){ h.hp=0; g.over=1.3; g.won=false; sfxLose(); g.shake=16; }
  if(g.t>=HOLD && !g.over){ g.over=1.5; g.won=true; sfxWin(); }

  if(g.bannerT>0) g.bannerT-=dt;
  if(g.flashT>0) g.flashT-=dt;
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*32);
}
function segDist(x1,y1,x2,y2,px,py){
  const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
  let t = L>0 ? ((px-x1)*dx+(py-y1)*dy)/L : 0;
  t = t<0?0:t>1?1:t;
  return Math.hypot(px-(x1+dx*t), py-(y1+dy*t));
}
function flash(t){ G.flash=t; G.flashT=1.0; }

/* ── отрисовка ── */
function draw(){
  const g=G, h=g.heli;
  cx.save();
  if(g.shake>0) cx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);

  /* фон прокручивается */
  const bg=IMG['p_shosse'];
  if(bg&&bg.complete&&bg.naturalHeight){
    const bw=VH*(bg.naturalWidth/bg.naturalHeight);
    let off=-(g.scroll%bw);
    for(let x=off; x<VW+bw; x+=bw) cx.drawImage(bg, x, 0, bw, VH);
  } else { cx.fillStyle='#141b22'; cx.fillRect(0,0,VW,VH); }
  cx.fillStyle='rgba(6,9,14,.22)'; cx.fillRect(0,0,VW,VH);

  /* машины */
  const car=IMG['p_mashina'];
  g.cars.forEach(c=>{
    if(!car||!car.complete||!car.naturalHeight) return;
    const w=SZ.car*(car.naturalWidth/car.naturalHeight), hh=SZ.car;
    cx.save();
    if(c.flash>0) cx.globalAlpha=.55;
    cx.fillStyle='rgba(0,0,0,.35)';
    cx.beginPath(); cx.ellipse(c.x, roadY()+6, w*0.40, 8, 0,0,7); cx.fill();
    cx.drawImage(car, c.x-w/2, roadY()-hh*0.86, w, hh);
    cx.restore();
  });

  /* бабки */
  const bb=IMG['p_babka'];
  g.bombs.forEach(b=>{
    if(!bb||!bb.complete||!bb.naturalHeight) return;
    const hh=SZ.babka, w=hh*(bb.naturalWidth/bb.naturalHeight);
    cx.save(); cx.translate(b.x,b.y); cx.rotate(Math.sin(b.r)*0.22);
    cx.drawImage(bb,-w/2,-hh/2,w,hh); cx.restore();
  });

  /* взрывы */
  const bo=IMG['p_vzryv'];
  g.booms.forEach(b=>{
    if(!bo||!bo.complete||!bo.naturalHeight) return;
    const k=0.5+b.t*2.2, s=SZ.boom*k, w=s*(bo.naturalWidth/bo.naturalHeight);
    cx.save(); cx.globalAlpha=Math.max(0,1-b.t/0.55);
    cx.drawImage(bo, b.x-w/2, b.y-s*0.62, w, s); cx.restore();
  });

  /* пули */
  cx.fillStyle='#f0c860';
  g.shots.forEach(s=>{ cx.beginPath(); cx.arc(s.x,s.y,3.4,0,7); cx.fill(); });

  /* вертолёт */

    cx.restore();

function drawHUD(){

  const left=Math.max(0, HOLD-g.t);

  /* прочность вертолёта слева */
  const hw=110, hx=16, hy=by;
  cx.fillStyle='rgba(6,8,4,.7)'; cx.fillRect(hx-2,hy-2,hw+4,13);
  cx.fillStyle='#3a2a1a'; cx.fillRect(hx,hy,hw,9);
  cx.fillStyle=h.hp/h.max<.32?'#b02a1a':'#4a9ad0';
  cx.fillRect(hx,hy,hw*Math.max(0,h.hp/h.max),9);
  cx.font='700 9px "Courier New",monospace'; cx.fillStyle='#8fa6b5';
  cx.fillText('ВЕРТОЛЁТ', hx, hy+21);

  const rd = g.reload>0 ? 1-g.reload/2.0 : 1;
  cx.fillStyle= g.reload>0 ? '#8d8778' : '#f0c860';
  cx.fillRect(rx,hy,rw*rd,9);
  cx.textAlign='right'; cx.fillStyle='#8d8778';
  cx.fillText(g.reload>0?'ПОДНИМАЮТ':'ГОТОВА', VW-16, hy+21); cx.textAlign='left';

  cx.font='700 11px "Courier New",monospace'; cx.fillStyle='#a09786';
  cx.fillText('уничтожено машин '+g.kills, 16, hy+40);

  if(g.bannerT>0){
    cx.save(); cx.globalAlpha=Math.min(1,g.bannerT*1.4);
    cx.font='700 '+Math.round(Math.min(40,VW*0.06))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle='#e4dcc6';
    cx.fillText(g.banner, VW/2, VH*0.30); cx.restore(); cx.textAlign='left';
  }
  if(g.flashT>0){
    cx.save(); cx.globalAlpha=Math.min(1,g.flashT*1.8);
    cx.font='700 '+Math.round(Math.min(34,VW*0.05))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle='#f0c860';
    cx.fillText(g.flash, VW/2, VH*0.40); cx.restore(); cx.textAlign='left';
  }
  if(g.over>0){
    cx.save(); cx.fillStyle='rgba(6,8,4,.5)'; cx.fillRect(0,0,VW,VH);
    cx.font='700 '+Math.round(Math.min(60,VW*0.09))+'px Arial Black, Arial, sans-serif';
    cx.textAlign='center'; cx.fillStyle=g.won?'#f0c860':'#b02a1a';
    cx.fillText(g.won?'ОТОРВАЛИСЬ':'СБИЛИ', VW/2, VH*0.5);
    cx.restore(); cx.textAlign='left';
  }
  if(COARSE && stick.on){
    cx.save(); cx.globalAlpha=.24; cx.strokeStyle='#e4dcc6'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(VW*0.18, stick.by, 44,0,7); cx.stroke();
    cx.beginPath(); cx.arc(VW*0.18, stick.by+stick.dy*44, 17,0,7); cx.fill();
    cx.restore();
  }
}

function loop(now){
  if(!G) return;
  const dt=Math.min(0.045,(now-G.last)/1000); G.last=now;
  step(dt);
  if(!G) return;

function finish(){

  ST.drops = drops; saveST();         // хотя бы один сброс открывает сцену с выговором Паши

function step(dt){
  const g=G, th=g.th;
  if(g.over>0){ g.over-=dt; if(g.over<=0) finish(); return; }
  g.t+=dt; g.goalBob+=dt;
  if(!g.started){ g.y = VH*0.42 + Math.sin(g.t*3)*VH*0.012; return; }

  g.scroll += SPEED*dt;
  g.vy += GRAV*dt;
  g.y  += g.vy*dt;
  g.rot = Math.max(-0.5, Math.min(1.1, g.vy/700));

  const r=VH*BODY, px=VW*0.28;
  for(const p of g.pipes){

    if(!p.scored && p.x + 46 < px){
      p.scored=true; g.passed++; sfxPass();
      if(g.passed>=NEED){
        g.over=1.4; g.won=true; g.done=true;
        g.pipes.length=0;                    // дальше небо чистое, препятствий больше нет
        sfxWin(); return;
      }
    }
    if(px + r > p.x && px - r < p.x + 46){
      if(g.y - r < p.top || g.y + r > p.top + p.gap){
        g.over=1.1; g.won=false; sfxHit(); return;
      }
    }
  }
  g.pipes = g.pipes.filter(p=>p.x > -120);
  if(!g.done){                               // после победы новые не досыпаем
    while(g.pipes.length < 4) addPipe(g.pipes.length ? g.pipes[g.pipes.length-1].x + STEP : VW + 260);
  }

  if(g.y - r < 0){ g.y = r; if(g.vy<0) g.vy = 0; }        // в потолок упирается, но не гибнет
  if(g.y + r > VH*0.94){ g.over=1.1; g.won=false; sfxHit(); }
}

}

/* цель, до которой не долететь: отодвигается по мере успехов */
function drawGoal(){
  const th=G.th, k=G.passed/NEED;

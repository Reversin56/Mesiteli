<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Месители: Финал</title>
<style>
  :root{
    --ink:#0b0e08; --paper:#e8e1c8; --dust:#a09786; --lamp:#f0c860; --blood:#b02a1a;
    --disp:'Arial Black','Arial',sans-serif; --mono:'Courier New',monospace;
    --cardink:#2a2620;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink);color:var(--paper);font-family:Georgia,serif;
    overflow:hidden;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  .scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;padding:clamp(16px,3.4vw,34px);text-align:center;overflow-y:auto}
  .scr.on{display:flex;animation:fade .45s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ── меню ── */
  #menu{padding:0}
  #mbg{position:absolute;inset:-2.5%;background-size:cover;background-position:center bottom;
    animation:drift 30s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.03) translateY(.5%)}to{transform:scale(1.075) translateY(-.8%)}}
  #mflick{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;
    background:linear-gradient(0deg, rgba(226,120,44,.10), transparent 78%);
    animation:flick 2.8s steps(2,end) infinite}
  @keyframes flick{0%,100%{opacity:.34}14%{opacity:.66}31%{opacity:.20}54%{opacity:.58}77%{opacity:.28}}
  #msky{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(4,6,4,.72) 0%, rgba(4,6,4,.46) 26%, transparent 52%)}
  #medge{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 118% at 50% 62%, transparent 44%, rgba(4,6,3,.44) 84%, rgba(3,4,2,.66) 100%)}
  .em{position:absolute;bottom:-20px;width:3px;height:3px;border-radius:50%;
    background:#f7a541;box-shadow:0 0 8px 2px rgba(247,165,65,.5);pointer-events:none;
    animation:up linear infinite}
  @keyframes up{0%{transform:translate(0,0) scale(1);opacity:0}
    10%{opacity:.9}100%{transform:translate(var(--dx),-106vh) scale(.3);opacity:0}}
  .mwrap{position:relative;z-index:5;height:100%;width:100%;display:flex;flex-direction:column;
    align-items:center;padding:clamp(26px,7vh,72px) clamp(16px,4vw,32px) 0;text-align:center}
  #menu h1{font-family:var(--disp);text-transform:uppercase;line-height:.93;letter-spacing:.02em;
    font-size:clamp(42px,12vw,148px);color:#f6f0dc;
    text-shadow:0 0 46px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.9),0 5px 0 #5e1a10,0 9px 30px rgba(0,0,0,.9)}
  #menu h1 .fin{display:block;color:#d8402a;
    text-shadow:0 0 46px rgba(0,0,0,.95),0 0 26px rgba(216,64,42,.5),0 5px 0 #4a0f08,0 9px 30px rgba(0,0,0,.9)}
  .mbar{height:5px;width:min(52vw,320px);margin:clamp(16px,3vh,28px) auto 0;
    background:linear-gradient(90deg,transparent,var(--blood) 18%,var(--blood) 82%,transparent);
    box-shadow:0 0 22px rgba(176,42,26,.75)}
  .mbtns{position:absolute;left:50%;top:clamp(44%,50vh,54%);transform:translateX(-50%);
    display:flex;flex-direction:column;gap:11px;align-items:stretch;width:max-content}
  .go{background:var(--lamp);color:#17140c;font-family:var(--disp);text-transform:uppercase;
    letter-spacing:.14em;font-size:clamp(13px,2.3vw,19px);
    padding:clamp(14px,2.2vw,20px) clamp(26px,5vw,52px);
    box-shadow:0 0 0 0 rgba(240,200,96,.55),0 10px 34px rgba(0,0,0,.75);
    animation:pulse 2.4s ease-out infinite;transition:background .15s;white-space:nowrap;
    text-align:center;width:100%;border:2px solid transparent;box-sizing:border-box}
  .go:hover{background:#ffdc7a}
  .go.sec{background:transparent;border-color:rgba(232,225,200,.4);color:#e8e1c8;
    animation:none;box-shadow:none}
  .go.sec:hover{border-color:var(--lamp);color:var(--lamp);background:transparent}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,200,96,.5),0 10px 34px rgba(0,0,0,.75)}
    70%{box-shadow:0 0 0 22px rgba(240,200,96,0),0 10px 34px rgba(0,0,0,.75)}
    100%{box-shadow:0 0 0 0 rgba(240,200,96,0),0 10px 34px rgba(0,0,0,.75)}}

  /* ── сцена с кадром ── */
  .cutwrap{max-width:940px;width:100%;display:flex;flex-direction:column;align-items:center;
    max-height:calc(100vh - 24px)}                       /* сцена не вылезает за экран */
  .cutpic{width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;
    border:2px solid #2a3320;box-shadow:0 14px 44px rgba(0,0,0,.6);position:relative;
    flex:0 1 auto;min-height:34vh}                        /* кадр может ужаться, но не исчезнет */
  /* кликабельные точки на карте */
  .mhot{position:absolute;transform:translate(-50%,-50%);width:9%;height:15%;
    border:2px solid rgba(240,200,96,.85);border-radius:50%;background:rgba(240,200,96,.14);
    cursor:pointer;transition:.15s;padding:0;display:flex;align-items:center;justify-content:center}
  .mhot:hover{background:rgba(240,200,96,.34);transform:translate(-50%,-50%) scale(1.14)}
  .mhot span{font-family:var(--mono);font-size:12px;color:var(--paper);text-shadow:0 0 4px #000}
  .mhot.seen{border-color:rgba(160,151,134,.5);background:rgba(0,0,0,.42);opacity:.55}
  .mhot.seen:hover{background:rgba(0,0,0,.5)}
  .cutbox{width:100%;background:rgba(10,13,8,.94);border:2px solid #2a3320;border-top:none;
    padding:clamp(16px,2.6vw,26px) clamp(18px,3vw,32px) clamp(18px,2.6vw,26px);
    display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
  .cuttxt{font-size:clamp(14px,1.9vw,17px);line-height:1.75;text-align:left;color:var(--paper);
    max-width:70ch;margin:0 auto;width:100%;
    overflow-y:auto;min-height:0;flex:1 1 auto;
    scrollbar-width:thin;scrollbar-color:#3a4630 transparent}
  .cuttxt::-webkit-scrollbar{width:6px}
  .cuttxt::-webkit-scrollbar-thumb{background:#3a4630;border-radius:3px}
  .cuttxt b{color:var(--lamp);font-weight:normal}
  .vo{display:none}
  .cutbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;flex:0 0 auto}
  .cutbtns.stack{flex-direction:column;align-items:stretch;max-width:520px;margin-left:auto;margin-right:auto}
  .nx{background:var(--lamp);color:var(--ink);font-family:var(--disp);text-transform:uppercase;
    letter-spacing:.14em;font-size:13px;padding:14px 28px;transition:.15s;
    min-width:210px;text-align:center;line-height:1.25}
  .nx:hover{filter:brightness(1.12)}
  .nx.alt{background:transparent;border:2px solid #3a4630;color:var(--dust)}
  .nx.alt:hover{border-color:var(--lamp);color:var(--lamp)}

  /* ── текстовая карточка ── */
  .tcard{max-width:640px}
  .tbig{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;
    font-size:clamp(24px,5.4vw,50px);line-height:1.1;color:var(--paper)}
  .tbig em{display:block;font-style:normal;color:var(--blood)}
  .tsm{font-family:var(--mono);font-size:clamp(10px,1.9vw,12.5px);letter-spacing:.26em;
    text-transform:uppercase;color:var(--dust);margin-top:18px;line-height:2}
  .tcard{display:flex;flex-direction:column;align-items:center}

  /* ── выбор ── */
  .picks{display:flex;flex-direction:column;gap:12px;margin-top:26px;width:100%;max-width:620px}
  .pick{background:#12160e;border:2px solid #2f3a26;border-left:7px solid #3a4630;
    padding:16px 20px;text-align:left;transition:.16s}
  .pick:hover{border-color:var(--lamp);border-left-color:var(--lamp);transform:translateX(3px)}
  .pick b{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;
    font-size:15px;color:var(--lamp);margin-bottom:7px}
  .pick span{display:block;font-size:13.5px;line-height:1.55;color:var(--paper)}

  /* ── папка импорта ── */
  #imp{background:radial-gradient(1100px 620px at 50% 34%,#171c12 0%,#0b0e08 62%,#080a06 100%)}
  .folder{max-width:840px;width:100%;background:#f0eadb;color:var(--cardink);
    border:1px solid #b9b2a0;position:relative;
    box-shadow:0 26px 70px rgba(0,0,0,.62),0 3px 0 #d8d1bf,0 6px 0 #cbc4b1,0 9px 0 #beb7a4;
    padding:clamp(22px,4vw,46px) clamp(18px,4vw,52px) clamp(28px,4vw,46px);text-align:left}
  .folder::before{content:'';position:absolute;left:0;top:0;bottom:0;width:11px;
    background:linear-gradient(90deg,#8f3226,#b0472f 55%,#8f3226)}
  .fhead{display:flex;justify-content:space-between;gap:14px;border-bottom:2px solid #cdc6b3;
    padding-bottom:12px;margin-bottom:clamp(18px,3vw,28px);font-family:var(--mono);
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7a7263}
  .fhead b{display:block;color:#4a4437;margin-top:4px;letter-spacing:.16em}
  .folder h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.03em;
    font-size:clamp(23px,5.4vw,44px);line-height:1.08;color:#20242a;text-align:center}
  .folder h2 em{display:block;font-style:normal;color:var(--blood)}
  .frule{height:4px;background:var(--blood);max-width:180px;margin:clamp(14px,2.6vw,22px) auto clamp(16px,2.8vw,24px)}
  .flead{font-size:clamp(14px,2vw,16.5px);line-height:1.72;color:#3b362c;max-width:540px;
    margin:0 auto;text-align:center}
  .flead + .flead{margin-top:11px}
  .fpick{background:#fbf7ec;border:2px solid #cdc6b3;border-left:7px solid #b9b2a0;
    padding:16px 20px;width:100%;text-align:left;transition:.16s;margin-top:12px;display:block}
  .fpick:hover{border-color:var(--blood);border-left-color:var(--blood);transform:translateX(3px)}
  .fpick b{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;
    font-size:clamp(14px,2.2vw,17px);color:#20242a;margin-bottom:7px}
  .fpick span{display:block;font-size:clamp(13px,1.8vw,14.5px);line-height:1.55;color:#5c5648}
  .andrey{display:flex;gap:clamp(14px,3vw,28px);align-items:flex-end;margin:6px 0 18px;
    flex-shrink:0;min-height:max-content}
  .apic img{height:clamp(180px,30vw,300px);width:auto;display:block;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.4))}
  .apic{position:relative;flex:0 0 auto}
  .aglow{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:230px;height:230px;
    border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(176,42,26,.22) 0%,transparent 68%)}
  .talk{flex:1;min-width:0;min-height:max-content}   /* иначе реплики вылезают на кнопку */
  .anm{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--blood);margin-bottom:12px;font-weight:700}
  .aline{font-size:clamp(14px,2.2vw,17.5px);line-height:1.6;color:#2c2820;margin-bottom:13px;
    opacity:0;transform:translateY(9px);transition:opacity .5s ease,transform .5s ease}
  .aline.on{opacity:1;transform:none}
  .aline.hot{color:var(--blood);font-family:var(--disp);text-transform:uppercase;
    font-size:clamp(13px,1.9vw,16px);letter-spacing:.03em;line-height:1.4}
  .crew{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(8px,2vw,18px);
    margin:clamp(18px,3vw,28px) 0 6px}
  .crew .man{flex:0 1 clamp(140px,26vw,220px)}   /* карточки по центру, а не растянуты на три колонки */
  .man{background:#fdfbf4;border:1px solid #c9c2ae;padding:9px 8px 12px;
    box-shadow:0 4px 14px rgba(0,0,0,.2);transition:.18s;position:relative;display:block;width:100%}
  .man:nth-child(1){transform:rotate(-1.4deg)}
  .man:nth-child(2){transform:rotate(.7deg)}
  .man:nth-child(3){transform:rotate(-.6deg)}
  .man:hover{transform:rotate(0) translateY(-4px);z-index:2}
  .man .ph{background:#ded7c6;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;
    height:clamp(110px,18vw,160px)}
  .man img{height:100%;width:auto}
  .man .n{font-family:var(--disp);text-transform:uppercase;font-size:clamp(11px,1.8vw,14px);
    color:#20242a;margin-top:9px;text-align:center}
  .man .f{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#8b8474;text-align:center;margin-top:3px}
  .man.dead{background:#efe9db}
  .man.dead img{filter:grayscale(1) contrast(.82) brightness(.86)}
  .man .stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-13deg) scale(.82);
    font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;
    font-size:clamp(13px,2.4vw,19px);color:var(--blood);border:4px solid var(--blood);
    padding:4px 11px;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;
    background:rgba(255,253,246,.35)}
  .man.dead .stamp{opacity:.88;transform:translate(-50%,-50%) rotate(-13deg) scale(1)}
  .fnote{font-family:var(--mono);font-size:clamp(10px,1.5vw,11.5px);letter-spacing:.16em;
    text-transform:uppercase;color:#8b8474;text-align:center;margin-top:16px;line-height:2;min-height:42px}
  .fnote.warn{color:var(--blood)}
  .fbtn{background:var(--blood);color:#fbf7ec;font-family:var(--disp);text-transform:uppercase;
    letter-spacing:.16em;font-size:clamp(13px,2vw,15px);padding:15px 28px;margin-top:14px;width:100%;
    border:2px solid var(--blood);transition:.15s}
  .fbtn:hover{background:#8f2216;border-color:#8f2216}

  /* ── фотография в руке ── */
  .fotoview{max-width:720px;width:100%}
  .fotoview{display:flex;flex-direction:column;align-items:center}
  .fotoview .cutbox{width:100%;max-width:820px;border-top:none}
  /* вид от первого лица: руки держат фотографию */
  .hands{position:relative;width:100%;max-width:820px;line-height:0}
  .hands .handsbg{width:100%;display:block}
  /* белое поле снимка в кадре с руками */
  .hands .slot{position:absolute;left:30.3%;top:25.2%;width:40.4%;height:38.1%;
    padding:1.6% 1.6% 4.2%;background:#f4efe2;
    transform:rotate(-.8deg);transform-origin:50% 50%;
    box-shadow:0 3px 10px rgba(0,0,0,.42), 0 0 0 1px rgba(120,110,92,.5)}
  .hands .slot::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(112deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.05) 26%,
      transparent 46%, rgba(0,0,0,.10) 88%)}
  .hands .slot .ph{width:100%;height:100%;overflow:hidden;position:relative;
    box-shadow:inset 0 0 14px rgba(60,50,36,.34)}
  .hands .slot .ph img{width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(.92) contrast(.97) brightness(.97)}
  .hands .slot .ph::after{content:'';position:absolute;inset:0;
    background:radial-gradient(120% 120% at 50% 42%, transparent 52%, rgba(30,24,16,.30) 100%)}

  /* ── игровое поле ── */
  #game{position:fixed;inset:0;display:none;background:#0a0c08;touch-action:none}
  #game.on{display:block}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #touch{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
  /* кнопка огня — только на телефоне, в миссиях со стрельбой */
  #fireBtn{position:fixed;right:22px;bottom:32px;z-index:7;display:none;
    width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #d8452c, #8d1f10);
    border:3px solid rgba(255,220,170,.55);
    box-shadow:0 6px 22px rgba(0,0,0,.55), inset 0 -5px 14px rgba(0,0,0,.35);
    color:#fff3dd;font-family:var(--disp);letter-spacing:.09em;font-size:14px;
    align-items:center;justify-content:center;touch-action:none;user-select:none}
  #fireBtn.on{display:flex}
  #fireBtn:active{transform:scale(.93);filter:brightness(1.15)}
  #touch.on{display:block}
  .tz{position:absolute;pointer-events:auto}
  #tzL{left:0;top:0;width:34%;height:100%}
  #tzR{right:0;top:0;width:34%;height:100%}
  #tzU{left:34%;top:0;width:32%;height:50%}
  #tzD{left:34%;top:50%;width:32%;height:50%}

  /* ── титры ── */
  #cred{background:#070906}
  .credpic{max-width:1000px;width:100%;display:block;
    opacity:0;transition:opacity .5s ease}
  .credhint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));
    text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;
    text-transform:uppercase;color:rgba(160,151,134,.5);pointer-events:none;
    opacity:0;transition:opacity .6s ease;z-index:6}
  .credhint.on{opacity:1}

  #mute{position:fixed;z-index:40;top:calc(9px + env(safe-area-inset-top));
    right:calc(9px + env(safe-area-inset-right));width:36px;height:36px;display:flex;
    align-items:center;justify-content:center;background:rgba(10,13,8,.7);
    border:1px solid #2c3623;color:var(--dust);font-size:14px}
  #home{position:fixed;z-index:40;top:calc(9px + env(safe-area-inset-top));
    right:calc(51px + env(safe-area-inset-right));width:36px;height:36px;display:none;
    align-items:center;justify-content:center;background:rgba(10,13,8,.7);
    border:1px solid #2c3623;color:var(--dust);font-size:16px}
  #home.on{display:flex}

  .modal{position:fixed;inset:0;z-index:60;background:rgba(6,8,4,.86);display:flex;
    align-items:center;justify-content:center;padding:24px}
  .modal .box{background:#12160e;border:2px solid #3a4630;padding:26px 28px;max-width:420px;text-align:center}
  .modal p{font-size:15px;line-height:1.6;margin-bottom:18px}

  @media (max-width:560px){
    .andrey{flex-direction:column;align-items:center;text-align:center}
    .anm{text-align:center}
    .cutbtns{justify-content:center}
  }
  /* игровой экран */
  #quiz{position:fixed;inset:0;display:none;background:#0b0e10;z-index:60}
  #quiz.on{display:block}
  #vbg{position:absolute;inset:0;background-size:cover;background-position:center}
  #vbg:after{content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(11,14,16,.15) 0%, rgba(11,14,16,.72) 46%, rgba(11,14,16,.9) 100%)}
  #vea,#vser{position:absolute;pointer-events:none}
  #vea{left:50%;top:4%;height:34%;transform:translateX(-50%)}
  #vser{right:2%;top:6%;height:24%;transform-origin:50% 0}
  #vser.yell{animation:yell .5s ease-in-out 3}
  @keyframes yell{0%,100%{transform:rotate(-9deg) scale(1.04)}50%{transform:rotate(9deg) scale(1.04)}}
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px}
  .head{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust);
    text-shadow:0 2px 6px #000}
  /* фитиль вместо полоски */
  .fuse{position:relative;height:16px;margin:8px 0 2px}
  .fuse i{position:absolute;left:0;top:7px;height:3px;background:#6b5a3c;border-radius:2px}
  .fuse b{position:absolute;top:2px;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle,#fff2b0 0%,#f0a020 45%,rgba(240,120,20,0) 72%);
    transform:translateX(-50%)}
  .qbox{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    max-width:860px;width:100%;margin:0 auto;padding-bottom:6px}
  .q{font-size:clamp(16px,3.2vw,25px);line-height:1.4;margin-bottom:16px;text-align:center;
    text-shadow:0 3px 10px #000}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){ .opts{grid-template-columns:1fr} }
  .opt{position:relative;border:none;background:transparent;color:#2a1f12;
    padding:16px 14px;font-size:15.5px;line-height:1.25;font-weight:700;
    text-shadow:0 1px 0 rgba(255,255,255,.35);min-height:62px;
    background-size:100% 100%;background-repeat:no-repeat}
  .opt:hover{filter:brightness(1.12)}
  .opt.gone{opacity:.2;pointer-events:none}
  .opt.right{filter:brightness(1.1) sepia(.5) hue-rotate(60deg) saturate(2)}

  if(!key || !MUSIC[key]) { MUSKEY=null; return; }
  MUSKEY=key;
  try{
    MUS=new Audio(MUSIC[key]);
    MUS.loop=true; MUS.volume=0;
    const from=MUSFROM[key]||0;
    if(from) MUS.addEventListener('loadedmetadata', ()=>{
      try{ if(MUS && MUS.duration>from+10) MUS.currentTime=from; }catch(e){}
    }, {once:true});
    MUS.play().catch(()=>{});
    const q=MUSQUIET[key];
    const target=MUTED?0:(q?q.low:0.42);
    if(q && q.rise>0 && !MUTED) setTimeout(()=>{                 // через паузу выводим на нормальную громкость
      if(MUSKEY!==key || !MUS) return;
      clearInterval(musFade);
      const from=MUS.volume, to=0.42, ticks=Math.round(q.rise*20), dv=(to-from)/ticks;
      let n=0;
      musFade=setInterval(()=>{
        if(!MUS || MUSKEY!==key){ clearInterval(musFade); return; }
        n++; try{ MUS.volume=Math.min(to, from+dv*n); }catch(e){}
        if(n>=ticks) clearInterval(musFade);
      },50);
    }, q.hold*1000);
    let v=0;
    clearInterval(musFade);
    musFade=setInterval(()=>{
      if(!MUS){ clearInterval(musFade); return; }
      v=Math.min(target, v+0.03);
      MUS.volume=v;
      if(v>=target) clearInterval(musFade);
    },60);
  }catch(e){ MUS=null; MUSKEY=null; }
}
function fadeMus(seconds){
  if(!MUS) return;
  clearInterval(musFade);
  const step=0.08, ticks=Math.max(1, Math.round(seconds/step));
  const dv=MUS.volume/ticks;
  musFade=setInterval(()=>{
    if(!MUS){ clearInterval(musFade); return; }
    const v=MUS.volume-dv;
    if(v<=0.005){ clearInterval(musFade); try{ MUS.volume=0; MUS.pause(); }catch(e){} MUS=null; }   // ключ держим, чтобы трек не поднялся заново
    else { try{ MUS.volume=v; }catch(e){} }
  }, step*1000);
}
function stopMus(instant){
  MUSKEY=null;
  const old=MUS; MUS=null;
  if(!old) return;
  clearInterval(musFade);
  if(instant){ try{ old.pause(); }catch(e){} return; }
  let v=old.volume;
  const t=setInterval(()=>{
    v-=0.05;
    if(v<=0){ clearInterval(t); try{ old.pause(); }catch(e){} }
    else { try{ old.volume=v; }catch(e){} }
  },50);
}
/* ── озвучка реплик: очередь по порядку ── */
let VO=null, voQueue=[], voToken=0;
let musDuck=null, musWas=null;
function duckMus(on){                        // музыка тише, пока говорят
  if(!MUS) return;
  clearInterval(musDuck);
  if(on && musWas===null) musWas=MUS.volume;
  const to = on ? (musWas!==null?musWas:MUS.volume)*0.28 : (musWas!==null?musWas:0.42);
  const from=MUS.volume, ticks=8, dv=(to-from)/ticks; let n=0;
  musDuck=setInterval(()=>{
    if(!MUS){ clearInterval(musDuck); return; }
    n++; try{ MUS.volume=Math.max(0, Math.min(1, from+dv*n)); }catch(e){}
    if(n>=ticks){ clearInterval(musDuck); if(!on) musWas=null; }
  }, 40);
}
function stopVo(){
  voToken++; voQueue=[];
  duckMus(false);
  if(VO){ try{ VO.pause(); }catch(e){} VO=null; }
}
function queryVo(){                                  // первая метка на видимом экране
  const el=document.querySelector('#cuttxt .vo, #cardbox .vo, #fotobox .vo');
  return el ? el.getAttribute('data-vo') : null;
}
function voPlayNext(token){
  if(token!==voToken) return;
  if(!voQueue.length){ VO=null; duckMus(false); return; }
  const key=voQueue.shift();
  if(MUTED || typeof VOICE==='undefined' || !VOICE[key]){ voPlayNext(token); return; }
  try{
    VO=new Audio(VOICE[key]);
    VO.volume=0.95;
    VO.addEventListener('ended', ()=>{ setTimeout(()=>voPlayNext(token), 260); }, {once:true});
    VO.addEventListener('error', ()=>voPlayNext(token), {once:true});
    duckMus(true);
    VO.play().catch(()=>{});
  }catch(e){ VO=null; voPlayNext(token); }
}
function playChain(key, then){              // сыграть и позвать следующую
  stopVo();
  const go=()=>{ if(then) setTimeout(then, 320); };
  if(MUTED || !key || typeof VOICE==='undefined' || !VOICE[key]){ setTimeout(go, 1100); return; }
  try{
    VO=new Audio(VOICE[key]); VO.volume=0.95;
    VO.addEventListener('ended', go, {once:true});
    VO.addEventListener('error', go, {once:true});
    duckMus(true);
    VO.play().catch(()=>{ setTimeout(go, 1100); });
  }catch(e){ VO=null; setTimeout(go, 1100); }
}
function playOne(key){                       // одиночная реплика вне обычных сцен
  stopVo();
  if(MUTED || !key || typeof VOICE==='undefined' || !VOICE[key]) return;
  try{ VO=new Audio(VOICE[key]); VO.volume=0.95; duckMus(true);
        VO.addEventListener('ended',()=>duckMus(false),{once:true});
        VO.play().catch(()=>{}); }catch(e){ VO=null; }
}
function playVoice(){                                // собираем все метки экрана и играем подряд
  stopVo();
  const box=document.querySelector('#fotobox .vo') ? '#fotobox'
          : document.querySelector('#cardbox .vo') ? '#cardbox' : '#cuttxt';
  voQueue=[...document.querySelectorAll(box+' .vo')].map(e=>e.getAttribute('data-vo'));
  if(voQueue.length) voPlayNext(voToken);
}
/* любой перерисованный текст сам запускает свои реплики */
function voWatch(){
  const obs=new MutationObserver(()=>{ clearTimeout(voWatch._t); voWatch._t=setTimeout(playVoice, 90); });
  ['#cuttxt','#cardbox','#fotobox'].forEach(sel=>{
    const el=document.querySelector(sel);
    if(el) obs.observe(el, {childList:true, subtree:true});
  });
}
function musVolume(){
  if(MUS) try{ MUS.volume = MUTED?0:0.42; }catch(e){}
}
